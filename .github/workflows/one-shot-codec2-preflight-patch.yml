name: One-shot Codec2 preflight patch

on:
  push:
    branches:
      - experiment/rpi4-codec2-narrow-soong-graph
    paths:
      - .github/workflows/one-shot-codec2-preflight-patch.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/rpi4-codec2-narrow-soong-graph
          fetch-depth: 0

      - name: Patch narrow AVC preflight closure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/build-minimal-codec2-modules.sh")
          text = path.read_text()
          start_marker = "    # Preflight the entire concrete AVC dependency graph without compiling.\n"
          end_marker = "\n\n    set +e\n    build_output="
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("preflight start marker not found")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("preflight end marker not found")
          if text.find(start_marker, start + 1) >= 0:
              raise SystemExit("preflight start marker is not unique")

          replacement = r'''    # Preflight the entire concrete AVC dependency graph without compiling.
              # Ninja -n checks missing inputs and absent generating rules up front.
              # A canonical missing HOST_OUT tool can be closed by adding only its
              # Soong module to the next narrow-graph attempt. Do not expand arbitrary
              # intermediates here: that would pull unrelated framework/test graphs.
              echo "CODEC2_NARROW_PREFLIGHT_BEGIN=1"
              preflight_output="$("$NINJA" -n -f "$NARROW_NINJA" -j"$JOBS" "$avc_target" 2>&1)" || preflight_rc=$?
              preflight_rc="${preflight_rc:-0}"
              echo "CODEC2_NARROW_PREFLIGHT_RC=$preflight_rc"
              printf '%s\n' "$preflight_output" | python3 -c '
          import re, sys
          text = sys.stdin.read()
          for line in text.splitlines():
              if re.search(r"ninja: error:|missing and no known rule|missing dependencies:", line, re.I):
                  print("CODEC2_NARROW_PREFLIGHT_ISSUE=" + line[:600])
          ' || true
              for host_tool in hidl-gen aidl aidl-cpp sysprop_cpp ndkstubgen sbox merge_zips; do
                if [ -x "$TREE/out/host/linux-x86/bin/$host_tool" ]; then
                  echo "CODEC2_NARROW_HOST_TOOL_OK=$host_tool"
                else
                  echo "CODEC2_NARROW_HOST_TOOL_ABSENT=$host_tool"
                fi
              done
              echo "CODEC2_NARROW_PREFLIGHT_END=1"
              if [ "$preflight_rc" -ne 0 ]; then
                preflight_host_modules="$(printf '%s\n' "$preflight_output" | python3 -c '
          import re, sys
          text = re.sub(r"\x1b\[[0-9;]*m", "", sys.stdin.read())
          mods = set()
          for line in text.splitlines():
              if "missing and no known rule to make it" not in line.lower():
                  continue
              for match in re.finditer(r"[\047\"]([^\047\"]*/out/host/linux-x86/bin/([A-Za-z0-9_.+-]+))[\047\"]", line):
                  mods.add(match.group(2))
          print(",".join(sorted(mods)))
          ')"
                if [ -n "$preflight_host_modules" ]; then
                  preflight_added=0
                  IFS=',' read -r -a preflight_host_array <<< "$preflight_host_modules"
                  for module in "${preflight_host_array[@]}"; do
                    case ",$REQUIRED_MODULES," in
                      *",$module,"*) ;;
                      *)
                        REQUIRED_MODULES="${REQUIRED_MODULES:+$REQUIRED_MODULES,}$module"
                        preflight_added=1
                        ;;
                    esac
                  done
                  if [ "$preflight_added" -eq 1 ]; then
                    echo "CODEC2_NARROW_PREFLIGHT_HOST_MODULES=$preflight_host_modules"
                    unset preflight_rc
                    continue
                  fi
                  echo "CODEC2_NARROW_PREFLIGHT_HOST_MODULES_STALLED=$preflight_host_modules" >&2
                fi
                echo "CODEC2_NARROW_PREFLIGHT_BLOCKED=1" >&2
                printf '%s\n' "$preflight_output" | tail -80 >&2
                exit "$preflight_rc"
              fi
              unset preflight_rc
          '''
          # The raw block is indented for this workflow's Python heredoc. Normalize
          # only the fixed ten-space prefix introduced above; preserve shell/Python
          # relative indentation inside the replacement itself.
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines()
          ) + "\n"
          new_text = text[:start] + replacement.rstrip("\n") + text[end:]
          if new_text == text:
              raise SystemExit("patch made no change")
          path.write_text(new_text)
          PY

          bash -n scripts/build-minimal-codec2-modules.sh
          git diff --check
          git diff -- scripts/build-minimal-codec2-modules.sh

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/one-shot-codec2-preflight-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-minimal-codec2-modules.sh
          git commit -m "fix(codec2): retry narrow preflight host tool closure [probe-codec2]"
          git push origin HEAD:experiment/rpi4-codec2-narrow-soong-graph

      - name: Dispatch heavy Codec2 probe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run codec2-no-full-build-check.yml \
            --ref experiment/rpi4-codec2-narrow-soong-graph \
            -f probe_codec2=true
