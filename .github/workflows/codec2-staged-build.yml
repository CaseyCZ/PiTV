name: Codec2 Staged ARM64 Build

on:
  push:
    branches: [experiment/rpi4-codec2-narrow-soong-graph]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: codec2-staged-${{ github.ref }}
  cancel-in-progress: true

env:
  TREE: ${{ github.workspace }}/android13
  SOURCES: ${{ github.workspace }}/codec2-sources
  OUT: ${{ github.workspace }}/codec2-payload
  PITV_CODEC2_LUNCH: aosp_rpi4_tv-userdebug
  PITV_CODEC2_JOBS: 2
  PITV_CODEC2_REQUIRED_GB: 10
  PITV_CODEC2_REQUIRE_BOOTSTRAP_REUSE: 1
  PITV_CODEC2_NORMALIZE_BOOTSTRAP_REUSE: 1

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-codec2-staged]')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync Android 13 and reclaim repo metadata
        run: |
          mkdir -p "$TREE" && cd "$TREE"
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r75 --depth=1
          curl -fsSL --create-dirs -o .repo/local_manifests/manifest_brcm_rpi4.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/manifest_brcm_rpi4.xml
          curl -fsSL -o .repo/local_manifests/remove_projects.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/remove_projects.xml
          for attempt in 1 2 3; do
            echo "CODEC2_REPO_SYNC_ATTEMPT=$attempt"
            if repo sync -c --no-tags --no-clone-bundle --optimized-fetch --fail-fast -j8; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android repo sync failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          repo manifest -r > "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          rm -rf "$TREE/.repo"
          echo "CODEC2_STAGED_REPO_METADATA_DROPPED=1"
          df -h "$TREE"

      - name: Fetch pinned Codec2 sources
        run: python3 scripts/fetch-minimal-codec2-sources.py "$SOURCES"

      - name: Build and promote Soong bootstrap
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 90s env \
            PITV_CODEC2_REQUIRE_BOOTSTRAP_REUSE=0 \
            PITV_CODEC2_PHASE=graph \
            bash scripts/build-minimal-codec2-modules.sh "$TREE" "$SOURCES" "$OUT"
          rc=$?
          set -e
          echo "CODEC2_STAGED_BOOTSTRAP_RC=$rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi
          for _ in $(seq 1 20); do
            if ! pgrep -x soong_ui >/dev/null 2>&1 && \
               ! pgrep -x ninja >/dev/null 2>&1 && \
               ! pgrep -x soong_build >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if pgrep -x soong_ui >/dev/null 2>&1 || \
             pgrep -x ninja >/dev/null 2>&1 || \
             pgrep -x soong_build >/dev/null 2>&1; then
            pkill -KILL -x soong_ui 2>/dev/null || true
            pkill -KILL -x ninja 2>/dev/null || true
            pkill -KILL -x soong_build 2>/dev/null || true
            sleep 1
          fi
          host_builder="$TREE/out/host/linux-x86/bin/soong_build"
          bootstrap_builder="$TREE/out/soong/host/linux-x86/bin/soong_build"
          if [ ! -s "$host_builder" ] && [ -s "$bootstrap_builder" ]; then
            mkdir -p "$(dirname "$host_builder")"
            cp "$bootstrap_builder" "$host_builder"
            chmod +x "$host_builder"
            echo "CODEC2_STAGED_PROMOTED_SOONG_BUILDER=1"
          fi
          test -x "$host_builder"
          mkdir -p "$TREE/out/soong"
          cp "${GITHUB_WORKSPACE}/pitv-source-manifest.xml" "$TREE/out/soong/pitv-source-manifest.xml"
          du -sh "$TREE/out"
          tar --exclude='out/.path_interposer_log' --zstd -cf "${GITHUB_WORKSPACE}/codec2-bootstrap-state.tar.zst" -C "$TREE" out
          ls -lh "${GITHUB_WORKSPACE}/codec2-bootstrap-state.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: pitv-codec2-staged-bootstrap-${{ github.sha }}
          path: codec2-bootstrap-state.tar.zst
          if-no-files-found: error
          retention-days: 2

  graph:
    needs: [bootstrap]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync Android 13 and reclaim repo metadata
        run: |
          mkdir -p "$TREE" && cd "$TREE"
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r75 --depth=1
          curl -fsSL --create-dirs -o .repo/local_manifests/manifest_brcm_rpi4.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/manifest_brcm_rpi4.xml
          curl -fsSL -o .repo/local_manifests/remove_projects.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/remove_projects.xml
          for attempt in 1 2 3; do
            echo "CODEC2_REPO_SYNC_ATTEMPT=$attempt"
            if repo sync -c --no-tags --no-clone-bundle --optimized-fetch --fail-fast -j8; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android repo sync failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          repo manifest -r > "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          rm -rf "$TREE/.repo"
          echo "CODEC2_STAGED_REPO_METADATA_DROPPED=1"
          df -h "$TREE"

      - name: Fetch pinned Codec2 sources
        run: python3 scripts/fetch-minimal-codec2-sources.py "$SOURCES"

      - uses: actions/download-artifact@v4
        with:
          name: pitv-codec2-staged-bootstrap-${{ github.sha }}
          path: codec2-bootstrap-checkpoint

      - name: Restore bootstrap checkpoint
        run: |
          test -s codec2-bootstrap-checkpoint/codec2-bootstrap-state.tar.zst
          tar --zstd -xf codec2-bootstrap-checkpoint/codec2-bootstrap-state.tar.zst -C "$TREE"
          test -s "$TREE/out/soong/pitv-source-manifest.xml"
          cmp "$TREE/out/soong/pitv-source-manifest.xml" "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          test -x "$TREE/out/host/linux-x86/bin/soong_build"
          du -sh "$TREE/out"

      - name: Build isolated Python 2.7
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz \
            -o /tmp/Python-2.7.18.tgz
          mkdir -p /tmp/pitv-python27-src
          tar -xzf /tmp/Python-2.7.18.tgz -C /tmp/pitv-python27-src --strip-components=1
          cd /tmp/pitv-python27-src
          ./configure --prefix=/tmp/pitv-python27 --without-ensurepip > /tmp/pitv-python27-configure.log
          make -j2 > /tmp/pitv-python27-build.log 2>&1
          make install > /tmp/pitv-python27-install.log 2>&1
          echo "/tmp/pitv-python27/bin" >> "$GITHUB_PATH"
          /tmp/pitv-python27/bin/python2.7 --version

      - name: Generate complete Codec2 graph
        run: |
          PITV_CODEC2_PHASE=graph bash scripts/build-minimal-codec2-modules.sh "$TREE" "$SOURCES" "$OUT"
          echo "CODEC2_STAGED_GRAPH_READY=1"
          du -sh "$TREE/out"
          tar --exclude='out/.path_interposer_log' --zstd -cf "${GITHUB_WORKSPACE}/codec2-graph-state.tar.zst" -C "$TREE" out
          ls -lh "${GITHUB_WORKSPACE}/codec2-graph-state.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: pitv-codec2-staged-graph-${{ github.sha }}
          path: codec2-graph-state.tar.zst
          if-no-files-found: error
          retention-days: 2

  modules:
    needs: [graph]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync Android 13 and reclaim repo metadata
        run: |
          mkdir -p "$TREE" && cd "$TREE"
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r75 --depth=1
          curl -fsSL --create-dirs -o .repo/local_manifests/manifest_brcm_rpi4.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/manifest_brcm_rpi4.xml
          curl -fsSL -o .repo/local_manifests/remove_projects.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/remove_projects.xml
          for attempt in 1 2 3; do
            echo "CODEC2_REPO_SYNC_ATTEMPT=$attempt"
            if repo sync -c --no-tags --no-clone-bundle --optimized-fetch --fail-fast -j8; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android repo sync failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          repo manifest -r > "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          rm -rf "$TREE/.repo"
          echo "CODEC2_STAGED_REPO_METADATA_DROPPED=1"
          df -h "$TREE"

      - name: Fetch pinned Codec2 sources
        run: python3 scripts/fetch-minimal-codec2-sources.py "$SOURCES"

      - uses: actions/download-artifact@v4
        with:
          name: pitv-codec2-staged-graph-${{ github.sha }}
          path: codec2-graph-checkpoint

      - name: Restore graph checkpoint
        run: |
          test -s codec2-graph-checkpoint/codec2-graph-state.tar.zst
          tar --zstd -xf codec2-graph-checkpoint/codec2-graph-state.tar.zst -C "$TREE"
          test -s "$TREE/out/soong/pitv-source-manifest.xml"
          cmp "$TREE/out/soong/pitv-source-manifest.xml" "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          test -x "$TREE/out/host/linux-x86/bin/soong_build"
          du -sh "$TREE/out"

      - name: Build isolated Python 2.7
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz \
            -o /tmp/Python-2.7.18.tgz
          mkdir -p /tmp/pitv-python27-src
          tar -xzf /tmp/Python-2.7.18.tgz -C /tmp/pitv-python27-src --strip-components=1
          cd /tmp/pitv-python27-src
          ./configure --prefix=/tmp/pitv-python27 --without-ensurepip > /tmp/pitv-python27-configure.log
          make -j2 > /tmp/pitv-python27-build.log 2>&1
          make install > /tmp/pitv-python27-install.log 2>&1
          echo "/tmp/pitv-python27/bin" >> "$GITHUB_PATH"
          /tmp/pitv-python27/bin/python2.7 --version

      - name: Build AVC and HEVC Codec2 payload
        run: |
          PITV_CODEC2_PHASE=modules bash scripts/build-minimal-codec2-modules.sh "$TREE" "$SOURCES" "$OUT"
          python3 scripts/codec2-payload-readiness.py "$OUT"
          test -s "$OUT/PITV-CODEC2-PAYLOAD.txt"
          echo "CODEC2_STAGED_PAYLOAD_READY=1"
          cat "$OUT/PITV-CODEC2-PAYLOAD.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: pitv-rpi4-codec2-payload-${{ github.sha }}
          path: codec2-payload/
          if-no-files-found: error
          retention-days: 14
