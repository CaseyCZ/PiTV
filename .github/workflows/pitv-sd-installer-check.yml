name: PiTV SD Installer Check

on:
  push:
    branches: [Master]
    paths:
      - "tools/windows/**"
      - ".github/workflows/pitv-sd-installer-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pitv-sd-installer-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
            }
            exit 1
          }

          Write-Host "PowerShell syntax OK"

      - name: Verify live Ubuntu catalog
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -SelfTestCatalog

      - name: Verify current Raspberry Pi Imager CLI contract
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{ "User-Agent" = "PiTV-CI" }
          $release = Invoke-RestMethod -UseBasicParsing -Headers $headers -Uri "https://api.github.com/repos/raspberrypi/rpi-imager/releases/latest"
          $tag = [string]$release.tag_name
          if (-not $tag) { throw "Unable to resolve latest Raspberry Pi Imager release tag." }

          $cliUrl = "https://raw.githubusercontent.com/raspberrypi/rpi-imager/$tag/src/cli.cpp"
          $cliSource = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 60 -Headers $headers -Uri $cliUrl).Content
          foreach ($required in @("--cloudinit-userdata","--cloudinit-networkconfig","--sha256")) {
            if ($cliSource -notmatch [regex]::Escape($required.TrimStart("-"))) {
              throw "Raspberry Pi Imager $tag source is missing CLI contract item $required"
            }
          }

          $pitv = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -Raw
          if ($pitv -match '"--disable-telemetry"') {
            throw "PiTV passes GUI-only --disable-telemetry to Raspberry Pi Imager CLI."
          }
          foreach ($required in @("--cloudinit-userdata","--cloudinit-networkconfig")) {
            if ($pitv -notmatch [regex]::Escape('"' + $required + '"')) {
              throw "PiTV write path is missing required argument $required"
            }
          }

          Write-Host ("Raspberry Pi Imager contract OK against latest release " + $tag)
      - name: Verify launcher target
        shell: powershell
        run: |
          $launcher = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\Start-PiTV-SD-Installer.cmd" -Raw
          if ($launcher -notmatch "PiTV-SD-Installer\.ps1") {
            throw "Launcher does not reference PiTV-SD-Installer.ps1"
          }
          Write-Host "Launcher target OK"
