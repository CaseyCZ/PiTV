name: PiTV SD Installer Check

on:
  push:
    branches: [Master]
    paths:
      - "tools/windows/**"
      - ".github/workflows/pitv-sd-installer-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pitv-sd-installer-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
            }
            exit 1
          }

          Write-Host "PowerShell syntax OK"

      - name: Verify live Ubuntu catalog
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -SelfTestCatalog

      - name: Verify current Raspberry Pi Imager CLI contract
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "rpi-imager.exe"
          Invoke-WebRequest -UseBasicParsing -Uri "https://downloads.raspberrypi.com/imager/imager_latest.exe" -OutFile $installer

          $p = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-"
          ) -Wait -PassThru

          if ($p.ExitCode -ne 0) {
            throw "Raspberry Pi Imager installer failed with exit code $($p.ExitCode)"
          }

          $candidates = @(
            (Join-Path $env:ProgramFiles "Raspberry Pi Ltd\Imager\rpi-imager.exe"),
            (Join-Path $env:ProgramFiles "Raspberry Pi Imager\rpi-imager.exe")
          )
          $imager = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $imager) { throw "Installed rpi-imager.exe was not found." }

          $help = (& $imager --cli --help 2>&1 | Out-String)
          foreach ($required in @("--cloudinit-userdata","--cloudinit-networkconfig","--sha256")) {
            if ($help -notmatch [regex]::Escape($required)) {
              throw "Current Raspberry Pi Imager CLI is missing $required"
            }
          }

          $script = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -Raw
          if ($script -match '"--disable-telemetry"') {
            throw "PiTV installer still passes GUI-only --disable-telemetry to CLI mode."
          }

          & $imager --version
          Write-Host "Current Raspberry Pi Imager CLI contract OK"

      - name: Verify launcher target
        shell: powershell
        run: |
          $launcher = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\Start-PiTV-SD-Installer.cmd" -Raw
          if ($launcher -notmatch "PiTV-SD-Installer\.ps1") {
            throw "Launcher does not reference PiTV-SD-Installer.ps1"
          }
          Write-Host "Launcher target OK"
