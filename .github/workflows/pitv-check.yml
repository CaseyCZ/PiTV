name: PiTV Full Regression Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m py_compile \
            pitv/pitv.py \
            pitv/apk_backend.py \
            pitv/store_backend.py \
            pitv/update_backend.py \
            system/pitv-helper \
            system/pitv-self-update \
            system/pitv-inputd \
            system/pitv-displayd \
            system/pitv-waydroid-device-patch
          python3 system/pitv-waydroid-device-patch --self-test
          python3 -m py_compile scripts/probe-codec2-prebuilt.py scripts/collect-codec2-prebuilt.py scripts/assemble-codec2-overlay.py scripts/validate-codec2-payload.py scripts/verify-staged-codec2-payload.py

      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n system/pitv-session
          bash -n system/pitv-session-run
          ! grep -q '^CapabilityBoundingSet=' system/pitv-shell.service
          ! grep -q '^AmbientCapabilities=' system/pitv-shell.service
          ! grep -q '^NoNewPrivileges=yes' system/pitv-shell.service
          grep -q '/usr/local/libexec/pitv-helper' system/pitv-shell.service
          grep -q 'systemd-run --user' config/apps.d/stremio.json
          bash -n system/pitv-launcher-run
          bash -n system/pitv-android-warm
          bash -n system/pitv-waydroid-launch
          bash -n scripts/build-waydroid-rpi4-v4l2.sh
          bash -n scripts/install-waydroid-rpi4-v4l2-image.sh
          bash -n scripts/probe-waydroid-codec2-target.sh
          bash -n scripts/prepare-codec2-overlay.sh
          bash -n scripts/install-codec2-overlay.sh
          bash -n scripts/rollback-codec2-overlay.sh
          bash scripts/check-codec2-no-full-build.sh
          python3 - <<'PYV4L2'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          media = Path("android/waydroid-rpi4/media_codecs.xml")
          root = ET.parse(media).getroot()
          names = {
              node.get("name")
              for node in root.findall(".//MediaCodec")
              if node.get("name")
          }
          includes = {node.get("href") for node in root.findall(".//Include")}
          assert "c2.v4l2.avc.decoder" in names
          assert "c2.v4l2.vp9.decoder" not in names
          assert "c2.v4l2.hevc.decoder" not in names
          assert "media_codecs_ffmpeg_c2.xml" in includes

          ffmpeg = ET.parse(
              "android/waydroid-rpi4/media_codecs_ffmpeg_c2.xml"
          ).getroot()
          ffmpeg_names = {
              node.get("name")
              for node in ffmpeg.findall(".//MediaCodec")
              if node.get("name")
          }
          assert ffmpeg_names == {"c2.ffmpeg.hevc.decoder"}

          mk = Path("android/waydroid-rpi4/pitv-rpi4-v4l2.mk").read_text()
          assert "android.hardware.media.c2@1.0-service-v4l2" in mk
          assert "android.hardware.media.c2@1.2-service-ffmpeg" in mk

          vendor_prop = Path("android/waydroid-rpi4/vendor.prop").read_text()
          assert "debug.stagefright.c2-poolmask=0x350000" in vendor_prop
          assert "persist.v4l2_codec2.rank.decoder=128" in vendor_prop
          assert "ro.vendor.v4l2_codec2.decode_concurrent_instances=4" in vendor_prop
          assert "persist.ffmpeg_codec2" not in vendor_prop

          hw_marker = Path("android/waydroid-rpi4/hwdecode.env").read_text()
          assert "HEVC_V4L2_REQUEST=compiled" in hw_marker
          assert "HEVC_BACKEND=ffmpeg-v4l2-request-rpivid" in hw_marker

          build = Path("scripts/build-waydroid-rpi4-v4l2.sh").read_text()
          assert "lineage_waydroid_arm64-userdebug" in build
          assert "lineage-rpi/android_external_v4l2_codec2.git" in build
          assert "raspberry-vanilla/android_external_ffmpeg.git" in build
          assert "raspberry-vanilla/android_external_ffmpeg_codec2.git" in build
          assert "raspberry-vanilla/android_external_libudev-zero.git" in build
          assert "c2.v4l2.avc.decoder" in build
          assert "c2.ffmpeg.hevc.decoder" in build
          assert "repo forall -c" in build
          assert "repo sync -c -d --force-sync" in build
          assert "checkout --detach FETCH_HEAD" in build
          assert "TARGET_VENDOR_PROP += vendor/pitv/rpi4/vendor.prop" in build
          assert "Unexpected V4L2ComponentStore::listComponents layout" in build
          assert "ret.push_back(GetTraits(V4L2ComponentName::kH264Decoder));" in build
          assert "VP8/VP9 are not" in build
          assert "Unexpected FFmpeg HEVC hwaccel property gate" in build
          assert "static const size_t kNumAudioComponents = 0;" in build
          assert "defaultRankVideo = 0x100u" in build
          assert "media_codecs_ffmpeg_c2.xml" in build
          assert "HEVC_V4L2_REQUEST=compiled" in build
          assert "persist.ffmpeg_codec2.v4l2.h265" in build
          assert "rm -rf external/v4l2_codec2" not in build

          installer = Path("scripts/install-waydroid-rpi4-v4l2-image.sh").read_text()
          assert "restore_previous" in installer
          assert "fail_and_restore" in installer
          assert "c2.v4l2.avc.decoder" in installer
          assert "c2.ffmpeg.hevc.decoder" in installer
          assert "V4L2 AVC Codec2 process is not running" in installer
          assert "FFmpeg HEVC Codec2 process is not running" in installer
          assert "media\\.c2.*v4l2" in installer
          assert "media\\.c2.*ffmpeg" in installer
          assert "/dev/media*" in installer
          assert "HEVC_V4L2_REQUEST=compiled" in installer
          assert "persist.ffmpeg_codec2.v4l2.h265" not in installer

          helper = Path("system/pitv-helper").read_text()
          assert "process_probe = waydroid_shell(" in helper
          assert 'any("media.c2" in line and "v4l2" in line for line in process_lines)' in helper
          assert 'any("media.c2" in line and "ffmpeg" in line for line in process_lines)' in helper
          assert "HEVC_V4L2_REQUEST=compiled" in helper
          assert "persist.ffmpeg_codec2.v4l2.h265" not in helper

          node_patch = Path("system/pitv-waydroid-device-patch").read_text()
          assert 'glob.glob("/dev/media*")' in node_patch
          assert "--remove" in node_patch
          assert "--self-test" in node_patch
          assert "remove_once" in node_patch
          assert "Future native upstream support" in node_patch
          dropin = Path("system/waydroid-container-pitv.conf").read_text()
          assert "ExecStartPre=/usr/local/libexec/pitv-waydroid-device-patch" in dropin

          main_install = Path("install.sh").read_text()
          assert "system/pitv-waydroid-device-patch /usr/local/libexec/pitv-waydroid-device-patch" in main_install
          assert "waydroid-container.service.d/pitv-rpi4-media.conf" in main_install

          print("PiTV RPi4 AVC + HEVC hardware decode static contract OK")
          PYV4L2
          python3 - <<'PYWAYDROID'
          from pathlib import Path
          src = Path("system/pitv-waydroid-launch").read_text(encoding="utf-8")
          verify = 'if ! package_installed "$TARGET"; then'
          launch = 'if ! start_package "$TARGET"; then'
          assert verify in src
          assert launch in src
          assert src.index(verify) < src.index(launch)
          assert 'package missing; installing APK before launch' in src
          assert 'for _ in $(seq 1 25)' in src
          print("Waydroid missing-package launch regression OK")
          PYWAYDROID
          sudo python3 system/pitv-helper self-test </dev/null
          python3 system/pitv-self-update --self-test
          python3 - <<'PYSTORESTATE'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "pitv")
          import store_backend as sb

          item = {
              "id": "smarttube",
              "installer": {
                  "type": "github_release_apk",
                  "expected_package": "org.smarttube.stable",
              },
          }
          with tempfile.TemporaryDirectory() as td:
              apk = Path(td) / "smarttube.apk"
              apk.write_bytes(b"apk")
              sb.read_receipt = lambda _sid: {
                  "installed": True,
                  "package": "org.smarttube.stable",
                  "path": str(apk),
              }
              writes = []
              sb.write_receipt = lambda *args, **kwargs: writes.append((args, kwargs))

              sb._waydroid_packages_state = lambda: (True, set())
              assert sb.store_state(item) == "downloaded"
              assert writes and writes[-1][1].get("installed") is False

              sb._waydroid_packages_state = lambda: (
                  True, {"org.smarttube.stable"}
              )
              assert sb.store_state(item) == "installed"

              sb._waydroid_packages_state = lambda: (False, set())
              sb.read_receipt = lambda _sid: {
                  "installed": True,
                  "package": "org.smarttube.stable",
                  "path": str(apk),
              }
              assert sb.store_state(item) == "installed"
          print("Android Store live-package state regression OK")
          PYSTORESTATE
          bash -n system/pitv-kodi-launch
          bash -n system/pitv-kodi-addon
          bash -n system/pitv-cec-control
          ! grep -q 'dbus-run-session' system/pitv-session
          ! grep -q 'SDL_AUDIODRIVER=alsa' system/labwc/autostart
          grep -q 'RUNTIME="/run/user/$(id -u)"' system/pitv-session
          grep -q 'RUNTIME="/run/user/$(id -u)"' system/pitv-waydroid-launch
          grep -q 'RUNTIME="/run/user/$(id -u)"' system/pitv-kodi-addon
          grep -q 'TV aplikace musí běžet v session uživatele pitv' system/pitv-waydroid-launch
          grep -q 'Kodi/Plex musí běžet v TV session uživatele pitv' system/pitv-kodi-addon
          grep -q 'Kodi musí běžet v TV session uživatele pitv' system/pitv-kodi-launch
          grep -q 'pitv-kodi-launch' config/apps.d/kodi.json
          grep -q 'kodi-appliance-defaults' system/pitv-helper
          grep -q 'system/kodi/appliance.xml /etc/pitv/kodi-appliance.xml' install.sh
          grep -q 'videoplayer.useprimedecoder' system/kodi/appliance.xml
          grep -q 'videoplayer.useprimedecoderforhw' system/kodi/appliance.xml
          grep -q 'system/pitv-kodi-launch /usr/local/bin/pitv-kodi-launch' install.sh
          grep -q 'waydroid-app-uninstall' system/pitv-helper
          grep -q 'waydroid-clean-legacy' system/pitv-helper
          grep -q '"com.stremio.one"' system/pitv-helper
          grep -q 'com.plexapp.android' system/pitv-helper
          grep -q '"type": "flatpak"' store/catalog.json
          grep -q '"app_id": "com.stremio.Stremio"' store/catalog.json
          grep -q 'flatpak run com.stremio.Stremio' config/apps.d/stremio.json
          ! grep -q 'stremio_tv_apk' store/catalog.json
          ! grep -q 'stremio_tv_apk' pitv/store_backend.py
          grep -q 'waydroid-keyevent' system/pitv-helper
          grep -q 'waydroid-hw-codec-status' system/pitv-helper
          grep -q 'c2.v4l2.avc.decoder' system/pitv-helper
          grep -q 'c2.ffmpeg.hevc.decoder' system/pitv-helper
          grep -q 'hevc_v4l2_request' system/pitv-helper
          grep -q 'if sys.stdin.isatty():' system/pitv-helper
          grep -q 'payload = json.loads(sys.stdin.read() or "{}")' system/pitv-helper
          grep -q 'tv-runtime-reset' system/pitv-helper
          grep -q 'tv-runtime-reset' system/pitv-session
          python3 system/pitv-inputd --self-test
          python3 system/pitv-displayd --self-test
          ! grep -q 'class CECReader' pitv/pitv.py
          ! grep -q 'cec_queue' pitv/pitv.py
          ! grep -q '_CEC_MANAGER' pitv/pitv.py
          grep -q 'python3-evdev' install.sh
          grep -q 'system/pitv-inputd /usr/local/libexec/pitv-inputd' install.sh
          grep -q 'system/pitv-cec-control /usr/local/libexec/pitv-cec-control' install.sh
          grep -q '/usr/local/libexec/pitv-cec-control' pitv/pitv.py
          ! grep -q '/usr/local/libexec/pitv-cec-monitor' pitv/pitv.py
          ! grep -q "cat >/usr/local/libexec/pitv-cec-monitor" install.sh
          ! grep -q 'register)' system/pitv-cec-control
          ! grep -q 'monitor)' system/pitv-cec-control
          grep -q 'system/pitv-global-action /usr/local/libexec/pitv-global-action' install.sh
          grep -q 'system/pitv-inputd.service /etc/systemd/system/pitv-inputd.service' install.sh
          grep -q 'systemctl enable pitv-inputd.service pitv-displayd.service pitv-shell.service pitv-android-warm.service' install.sh
          grep -q 'pitv-inputd.service' system/pitv.target
          grep -q 'After=.*pitv-inputd.service' system/pitv-shell.service
          grep -q 'Wants=.*pitv-inputd.service' system/pitv-shell.service
          grep -q '^ConditionPathExists=!/var/lib/pitv/cec-disabled$' system/pitv-inputd.service
          grep -q '^Restart=always$' system/pitv-inputd.service
          grep -q 'PiTV TV Remote' system/pitv-inputd
          grep -q -- '--no-rc-passthrough' system/pitv-inputd
          grep -q 'KEY_F13' system/pitv-inputd
          grep -q 'KEY_F14' system/pitv-inputd
          grep -q '^KEY_BACK = 158$' system/pitv-inputd
          grep -q 'self.sink.tap(KEY_BACK)' system/pitv-inputd
          grep -q 'key="F13"' system/labwc/rc.xml
          grep -q 'key="F14"' system/labwc/rc.xml
          grep -q 'pitv-global-action home' system/labwc/rc.xml
          grep -q 'pitv-global-action close' system/labwc/rc.xml
          grep -q 'id -u pitv' system/pitv-global-action
          grep -q 'exec runuser -u pitv' system/pitv-global-action
          grep -q 'wtype -M logo -k F9 -m logo' system/pitv-global-action
          grep -q 'tv-input-enable' system/pitv-helper
          grep -q 'system_input_managed' pitv/pitv.py
          grep -q '_consume_global_tv_action' pitv/pitv.py
          grep -q 'if not system_input_managed()' pitv/pitv.py
          ! grep -q 'tv-runtime-reset' system/pitv-launcher-run
          grep -q '^exec labwc -s /usr/local/bin/pitv-launcher-run$' system/pitv-session
          grep -q 'pitv-wayland-display' system/pitv-session
          grep -q 'pitv-wayland-display' system/pitv-launcher-run
          grep -q 'pitv-wayland-display' system/pitv-android-warm
          grep -q 'pitv-wayland-display' system/pitv-session-run
          grep -q 'pitv-wayland-display' system/pitv-kodi-launch
          grep -q 'pitv-wayland-display' system/pitv-kodi-addon
          grep -q 'pitv-wayland-display' system/pitv-waydroid-launch
          grep -q 'pitv-wayland-display' pitv/pitv.py
          ! grep -q 'for socket in "$RUNTIME"/wayland-\*' system/pitv-session-run
          ! grep -q 'for socket in "$RUNTIME"/wayland-\*' system/pitv-kodi-launch
          ! grep -q 'for socket in "$RUNTIME"/wayland-\*' system/pitv-kodi-addon
          ! grep -q 'glob("wayland-\*")' pitv/pitv.py
          grep -q 'if \[ "$MODE" = "client" \]' system/pitv-waydroid-launch
          grep -q 'CANDIDATE=.*pitv-wayland-display\|MARKER=.*pitv-wayland-display' system/pitv-waydroid-launch
          ! grep -q 'pitv-launcher-run' system/labwc/autostart
          grep -q '^exec /usr/bin/python3 /opt/pitv/pitv/pitv.py$' system/pitv-launcher-run
          ! grep -q '"waydroid", "shell", "input"' pitv/pitv.py
          grep -q 'waydroid session start' system/pitv-waydroid-launch
          test "$(grep -c 'waydroid session start' system/pitv-waydroid-launch)" -eq 1
          grep -q 'flock -n 9' system/pitv-waydroid-launch
          grep -q 'cleanup_stale_android_runtime' system/pitv-waydroid-launch
          grep -q 'stale Android runtime detected before new Cage session' system/pitv-waydroid-launch
          grep -q 'Waydroid session is still RUNNING after stale cleanup' system/pitv-waydroid-launch
          grep -q 'waydroid show-full-ui' system/pitv-waydroid-launch
          test "$(grep -c 'waydroid show-full-ui' system/pitv-waydroid-launch)" -eq 1
          grep -q 'pitv-waydroid-app-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-runtime-ready' system/pitv-waydroid-launch
          grep -q 'exec /usr/local/bin/pitv-waydroid-launch --warm' system/pitv-android-warm
          grep -q 'pitv-wayland-display' system/pitv-android-warm
          grep -q 'def _android_runtime_ready(self)' pitv/pitv.py
          grep -q 'pid = int(raw)' pitv/pitv.py
          grep -q 'kill -0 "$pid"' system/pitv-waydroid-launch
          grep -q 'persistent Android runtime ready pid=' system/pitv-waydroid-launch
          grep -q 'starting persistent Android warm runtime' system/pitv-waydroid-launch
          grep -q 'using persistent Android runtime for:' system/pitv-waydroid-launch
          grep -q 'persistent Android session manager was lost' system/pitv-waydroid-launch
          grep -Fq 'printf '\''%s\n'\'' "${BASHPID:-0}" >"$RUNTIME_READY"' system/pitv-waydroid-launch
          grep -q 'Never trust only the exit status' system/pitv-waydroid-launch
          grep -q 'launching resolved Android TV Activity directly' system/pitv-waydroid-launch
          grep -q 'forcing explicit Android TV launcher Activity' system/pitv-waydroid-launch
          ! grep -q 'launching through official Waydroid app controller' system/pitv-waydroid-launch
          grep -q 'maintenance must never block an app launch' pitv/pitv.py
          python3 - <<'PYLIFECYCLE'
          from pathlib import Path
          helper = Path("system/pitv-helper").read_text(encoding="utf-8")
          block = helper.split('elif action == "waydroid-clean-legacy":', 1)[1]
          block = block.split('elif action == "waydroid-app-uninstall":', 1)[0]
          assert '"container", "start"' not in block
          assert '"container", "stop"' not in block
          wrapper = Path("system/pitv-waydroid-launch").read_text(encoding="utf-8")
          assert 'waydroid session start' in wrapper
          assert wrapper.count('waydroid session start') == 1
          outer = wrapper.split('if [ "$MODE" = "outer" ]; then', 2)[2]
          outer = outer.split('if [ "$MODE" = "client" ]; then', 1)[0]
          warm = outer.split('if [ "$TARGET" = "--warm" ]; then', 1)[1]
          warm = warm.split('fi\n\n  # Normal TV apps reuse', 1)[0]
          assert 'flock -n 9' in warm
          assert 'cleanup_stale_android_runtime' in warm
          assert warm.index('flock -n 9') < warm.index('cleanup_stale_android_runtime')
          assert 'starting persistent Android warm runtime' in warm
          assert 'cage -d -- "$0" --cage-client --warm' in warm
          assert 'cage_rc=$?' in warm
          assert 'exit "$cage_rc"' in warm
          regular = outer.split('# Normal TV apps reuse', 1)[1]
          assert 'waydroid-warm-start' in regular
          assert 'runtime_ready' in regular
          assert 'flock -n 8' in regular
          assert 'using persistent Android runtime for:' in regular
          assert 'cage -d -- "$0" --cage-client "$TARGET"' not in regular
          assert 'cleanup_stale_android_runtime' not in regular
          client = wrapper.split('if [ "$MODE" = "client" ]; then', 2)[2]
          client = client.split('# From here a lightweight command wrapper', 1)[0]
          assert 'waydroid session stop' in client
          assert 'waydroid-container-stop' not in client
          assert 'waydroid show-full-ui' not in client
          assert 'persistent Android runtime ready pid=' in client
          assert 'persistent Android session manager was lost' in client
          assert 'waydroid-active-app-idle' in client
          assert 'persistent Android runtime entered windowless idle state' in client
          assert '>"$RUNTIME_READY"' in wrapper.replace(" ", "")
          assert 'waydroid app list' in wrapper
          launch = wrapper.split('# Never trust only the exit status', 1)[1]
          launch = launch.split('# Keep the per-app command alive', 1)[0]
          assert 'package_installed "$TARGET"' in launch
          assert 'waydroid app install "$APK"' in launch
          assert 'start_package "$TARGET"' in launch
          assert 'mark_ready "$TRACK_PACKAGE"' in launch
          assert 'explicit Android TV Activity accepted; ready marker published' in launch
          assert 'if ! wait_package_visible "$TARGET"; then' not in launch
          start_fn = wrapper.split('start_package() {', 1)[1].split('launch_package() {', 1)[0]
          assert 'start_explicit_tv_activity "$package"' in start_fn
          assert 'waydroid app launch "$package"' not in start_fn
          visible_fn = wrapper.split('wait_package_visible() {', 1)[1].split('start_explicit_tv_activity() {', 1)[0]
          assert 'local deadline=$((SECONDS + 15))' in visible_fn
          assert 'while [ "$SECONDS" -lt "$deadline" ]; do' in visible_fn
          assert 'for _ in $(seq 1 75)' not in visible_fn
          lifecycle = wrapper.split('# Keep the per-app command alive', 1)[1]
          assert 'SESSION_SEEN_ACTIVE=0' in lifecycle
          assert 'STARTUP_HOME_GRACE_UNTIL=$((SECONDS + 20))' in lifecycle
          assert 'Android Home observed during startup Activity hand-off; allowing 20s grace' in lifecycle
          assert 'Android TV foreground flow verified' in lifecycle
          assert 'Android TV foreground never appeared after startup grace' in lifecycle
          assert 'diagnostics "$TRACK_PACKAGE"' in lifecycle
          assert 'persistent Android runtime returned to windowless idle state' in lifecycle
          print("PiTV 1.5 persistent Android lifecycle OK")
          PYLIFECYCLE
          grep -q 'waydroid-app-visible' system/pitv-waydroid-launch
          grep -q 'waydroid-app-visible' system/pitv-helper
          grep -q 'waydroid-app-session-active' system/pitv-helper
          grep -q 'waydroid-app-session-active' system/pitv-waydroid-launch
          grep -q 'Android TV session returned Home' system/pitv-waydroid-launch
          grep -q 'Android Home observed during startup Activity hand-off; allowing 20s grace' system/pitv-waydroid-launch
          grep -q 'Android TV foreground flow verified' system/pitv-waydroid-launch
          grep -q 'Android TV foreground never appeared after startup grace' system/pitv-waydroid-launch
          grep -Fq 'STARTUP_HOME_GRACE_UNTIL=$((SECONDS + 20))' system/pitv-waydroid-launch
          grep -q 'com.android.launcher3' system/pitv-helper
          ! grep -q 'waydroid-app-running.*>/dev/null' system/pitv-waydroid-launch
          grep -q '"dumpsys", "activity", "top"' system/pitv-helper
          ! grep -q '"dumpsys", "activity", "activities"' system/pitv-helper
          grep -Fq 'local deadline=$((SECONDS + 15))' system/pitv-waydroid-launch
          grep -Fq 'while [ "$SECONDS" -lt "$deadline" ]; do' system/pitv-waydroid-launch
          ! grep -q 'for _ in $(seq 1 75)' system/pitv-waydroid-launch
          grep -q 'sleep 0.20' system/pitv-waydroid-launch
          grep -q 'explicit Android TV Activity accepted; ready marker published' system/pitv-waydroid-launch
          grep -q 'waydroid-app-stop' system/pitv-helper
          grep -q 'waydroid-app-stop' pitv/pitv.py
          ! grep -q '\["waydroid", "session", "stop"\]' pitv/pitv.py
          grep -q 'android_key_queue' pitv/pitv.py
          grep -q 'One global activity banner' pitv/pitv.py
          ! grep -q 'persist.waydroid.multi_windows false' system/pitv-waydroid-launch
          grep -q 'waydroid-user-ready' system/pitv-waydroid-launch
          grep -q 'waydroid-user-ready' system/pitv-helper
          grep -q 'get-started-user-state' system/pitv-helper
          grep -q 'RUNNING_UNLOCKED' system/pitv-helper
          grep -q '^def waydroid_shell(args, timeout=30):' system/pitv-helper
          grep -Fq '["waydroid", "shell"]' system/pitv-helper
          grep -Fq 'input=command + "\n"' system/pitv-helper
          python3 - <<'PYWAYDROIDSHELL'
          from pathlib import Path
          src = Path("system/pitv-helper").read_text(encoding="utf-8")
          launch = src.split('elif action == "waydroid-app-launch":', 1)[1]
