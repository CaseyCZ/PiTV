          grep -q 'try-restart.*pitv-shell.service' system/pitv-displayd
          grep -q 'home|close|display' system/pitv-global-action
          grep -q 'action == "display"' pitv/pitv.py
          ! grep -q 'pitv-display-repair' pitv/pitv.py
          ! test -e system/pitv-display-watch
          ! test -e system/pitv-display.service
          ! grep -q 'system/pitv-display-watch /usr/local/libexec/pitv-display-watch' install.sh
          ! grep -q 'system/pitv-display.service /etc/systemd/system/pitv-display.service' install.sh
          grep -q '<reuseOutputMode>yes</reuseOutputMode>' system/labwc/rc.xml
          grep -q '<action name="MoveTo" x="0" y="0" />' system/labwc/rc.xml
          grep -q '^Wants=pitv-shell.service$' system/pitv-android-warm.service
          grep -q '^PartOf=pitv-shell.service$' system/pitv-android-warm.service
          ! grep -q '^Requires=pitv-shell.service$' system/pitv-android-warm.service
          grep -q '^Restart=always$' system/pitv-android-warm.service
          grep -q '^TimeoutStopSec=40$' system/pitv-android-warm.service
          grep -q 'waydroid-warm-start' system/pitv-waydroid-launch
          grep -q 'waydroid-warm-start' system/pitv-helper
          grep -q 'systemctl", "start", "pitv-android-warm.service"' system/pitv-helper
          grep -q 'loginctl enable-linger pitv' install.sh
          grep -q 'systemctl set-default pitv.target' install.sh
          grep -q 'systemctl mask getty@tty1.service' install.sh
          grep -q 'PITV_LEGACY_LIVE=0' install.sh
          grep -q 'pitv-shell-migration-' install.sh
          grep -q -- '--on-active=3s' install.sh
          ! grep -q 'agetty --autologin' install.sh
          ! grep -q 'system/bash_profile /home/pitv/.bash_profile' install.sh
          grep -q 'legacy-android-media-v2.done' pitv/pitv.py
          grep -q 'DPkg::Lock::Timeout' scripts/install-waydroid.sh
          grep -q 'identifier="wlroots"' system/labwc/rc.xml
          grep -q 'title="PiTV \*"' system/labwc/rc.xml
          grep -q 'SendToDesktop" to="Android" follow="no"' system/labwc/rc.xml
          grep -q '<name>PiTV</name>' system/labwc/rc.xml
          grep -q '<name>Kodi</name>' system/labwc/rc.xml
          grep -q '<name>Stremio</name>' system/labwc/rc.xml
          grep -q '<name>Android</name>' system/labwc/rc.xml
          grep -q 'GoToDesktop" to="PiTV"' system/labwc/rc.xml
          grep -q '"127".*KEYCODE_MEDIA_PAUSE' system/pitv-helper
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
