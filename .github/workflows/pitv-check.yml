          grep -q '^WantedBy=pitv.target$' system/pitv-shell.service
          grep -q 'wlr-randr' install.sh
          grep -q 'system/pitv-displayd /usr/local/libexec/pitv-displayd' install.sh
          grep -q 'system/pitv-displayd.service /etc/systemd/system/pitv-displayd.service' install.sh
          grep -q 'pitv-displayd.service' system/pitv.target
          ! grep -q 'pitv-display.service' system/pitv.target
          grep -q 'After=.*pitv-displayd.service' system/pitv-shell.service
          grep -q 'Wants=.*pitv-displayd.service' system/pitv-shell.service
          grep -q '^Restart=always$' system/pitv-displayd.service
          grep -q 'connector_snapshot' system/pitv-displayd
