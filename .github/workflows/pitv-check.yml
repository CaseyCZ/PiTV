          assert launch.index('prepared = waydroid_shell(') < launch.index('resolved = waydroid_shell(')
          assert 'resolved = waydroid_shell(' in launch
          assert 'launched = waydroid_shell(' in launch
          assert '"cmd", "package", "resolve-activity"' in launch
          assert '"am", "start", "--user", "0", "-W"' in launch
          assert '["waydroid", "shell", "cmd"' not in launch
          assert '["waydroid", "shell", "am", "start"' not in launch
          diagnostics = src.split('elif action == "waydroid-diagnostics":', 1)[1]
          diagnostics = diagnostics.split('elif action == "waydroid-keyevent":', 1)[0]
          assert 'if list(args[:2]) == ["waydroid", "shell"]:' in diagnostics
          assert 'p = waydroid_shell(args[2:], timeout=timeout)' in diagnostics
          print("Waydroid shell flag passthrough contract OK")
          PYWAYDROIDSHELL
          ! grep -q 'is-user-unlocked' system/pitv-helper
          grep -q 'systemctl", "start", "waydroid-container.service"' system/pitv-helper
          grep -q '/home/pitv/.local/share/waydroid/data/media/0/PiTV-Media' system/pitv-helper
          grep -q 'systemctl enable --now waydroid-container.service' scripts/install-waydroid.sh
          grep -q 'timeout --signal=TERM --kill-after=5s 20s' system/pitv-waydroid-launch
          grep -Fq 'cage -d -- "$0" --cage-client' system/pitv-waydroid-launch
          grep -Fq 'exit "$cage_rc"' system/pitv-waydroid-launch
          grep -q 'labwc cage wtype' install.sh
          grep -q 'pitv-launcher-run' install.sh
          grep -q 'pitv-launcher.service' install.sh
          grep -q 'ExecStart=/usr/bin/systemctl restart pitv-shell.service' install.sh
          grep -q '^Requires=multi-user.target pitv-shell.service$' system/pitv.target
          grep -q '^AllowIsolate=yes$' system/pitv.target
          grep -q '^PAMName=login$' system/pitv-shell.service
