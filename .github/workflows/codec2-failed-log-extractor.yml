name: Codec2 Failed Log Extractor

on:
  push:
    branches: [experiment/rpi4-codec2-narrow-soong-graph]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  extract:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[extract-codec2-log]')
    runs-on: ubuntu-24.04
    env:
      FAILED_JOB_ID: '114271289760'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download failed Codec2 job log
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" \
            -o "$RUNNER_TEMP/codec2-failed-job.log"
          test -s "$RUNNER_TEMP/codec2-failed-job.log"
          wc -l "$RUNNER_TEMP/codec2-failed-job.log"

      - name: Extract first causal blocker
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/codec2-failed-job.log"
          clean="$RUNNER_TEMP/codec2-blockers.txt"
          sed -r 's/\x1B\[[0-9;]*[mK]//g' "$log" \
            | grep -E 'FAILED:|fatal error:|(^|[[:space:]])error:|ninja: error:|missing and no known rule|missing dependencies:|CODEC2_[A-Z0-9_]*(ISSUE|BLOCKED|FAILED|MISSING|NOT_FOUND|RC=)' \
            > "$clean" || true
          {
            echo '## Failed Codec2 job 114271289760'
            echo
            echo '```text'
            tail -n 160 "$clean"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '=== CODEC2 BLOCKERS ==='
          tail -n 160 "$clean"

      - name: Upload extracted logs
        uses: actions/upload-artifact@v4
        with:
          name: codec2-failed-job-114271289760
          path: |
            ${{ runner.temp }}/codec2-failed-job.log
            ${{ runner.temp }}/codec2-blockers.txt
          if-no-files-found: error
          retention-days: 3
