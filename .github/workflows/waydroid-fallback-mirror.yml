name: Waydroid Fallback Mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [Master]
    paths:
      - ".github/workflows/waydroid-fallback-mirror.yml"

permissions:
  contents: write

concurrency:
  group: waydroid-fallback-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Mirror current Noble ARM64 runtime packages
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://repo.waydro.id/dists/noble"
          DEST="vendor/waydroid/noble"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          echo "Reading $BASE/"
          listing="$(curl --retry 3 --connect-timeout 15 -fsSL "$BASE/")"

          pick() {
            local regex="$1"
            printf '%s\n' "$listing" \
              | grep -oE 'href="[^"]+\.deb"' \
              | cut -d'"' -f2 \
              | grep -E "$regex" \
              | sort -V \
              | tail -n 1
          }

          LIBGLIBUTIL="$(pick '^libglibutil_[^/]+_arm64\.deb$')"
          LIBGBINDER="$(pick '^libgbinder_[^/]+_arm64\.deb$')"
          PYGBINDER="$(pick '^python3-gbinder_[^/]+_arm64\.deb$')"
          WAYDROID="$(pick '^waydroid_[^/]+_all\.deb$')"

          for file in "$LIBGLIBUTIL" "$LIBGBINDER" "$PYGBINDER" "$WAYDROID"; do
            test -n "$file"
            echo "Downloading $file"
            curl --retry 3 --connect-timeout 15 -fL "$BASE/$file" -o "$TMP/$file"
          done

          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$TMP"/*.deb "$DEST/"

          (
            cd "$DEST"
            sha256sum *.deb | sort -k2 > SHA256SUMS
          )

          cat > "$DEST/README.md" <<EOF
          # PiTV Waydroid fallback snapshot

          This directory is an automated fallback snapshot of the current ARM64 runtime
          packages from the official Waydroid repository for Ubuntu 24.04 (Noble).

          It is used only when the primary `https://repo.waydro.id` installation path
          is unavailable.

          Mirrored packages:

          - `$LIBGLIBUTIL`
          - `$LIBGBINDER`
          - `$PYGBINDER`
          - `$WAYDROID`

          Source: `$BASE/`

          Updated by `.github/workflows/waydroid-fallback-mirror.yml`.
          EOF

          cat > "$DEST/packages.env" <<EOF
          LIBGLIBUTIL_FILE=$LIBGLIBUTIL
          LIBGBINDER_FILE=$LIBGBINDER
          PYGBINDER_FILE=$PYGBINDER
          WAYDROID_FILE=$WAYDROID
          EOF

      - name: Commit changed snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- vendor/waydroid/noble && \
             git status --porcelain -- vendor/waydroid/noble | grep -qv .; then
            echo "Fallback snapshot is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/waydroid/noble
          git commit -m "Update Waydroid fallback snapshot"
          git push
