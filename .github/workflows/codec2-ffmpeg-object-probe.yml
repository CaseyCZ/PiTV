name: Codec2 FFmpeg Android 13 Object Probe

on:
  push:
    branches: [experiment/rpi4-codec2-narrow-soong-graph]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codec2-ffmpeg-object-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[probe-ffmpeg-objects]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned Codec2 sources
        run: |
          python3 scripts/fetch-minimal-codec2-sources.py "$RUNNER_TEMP/codec2-sources"

      - name: Resolve exact Android 13 FFmpeg ARM64 object graph
        run: |
          python3 scripts/probe-ffmpeg-android13-objects.py \
            "$RUNNER_TEMP/codec2-sources/ffmpeg" \
            "$RUNNER_TEMP/ffmpeg-android13-objects.json"
          python3 -m json.tool "$RUNNER_TEMP/ffmpeg-android13-objects.json" >/dev/null
          grep -q '"v4l2_request": true' "$RUNNER_TEMP/ffmpeg-android13-objects.json"
          grep -q '"codec": "HEVC"' "$RUNNER_TEMP/ffmpeg-android13-objects.json"

      - name: Generate narrow FFmpeg Soong shim
        run: |
          python3 scripts/generate-ffmpeg-android13-soong.py \
            "$RUNNER_TEMP/codec2-sources/ffmpeg" \
            "$RUNNER_TEMP/codec2-sources/ffmpeg_codec2" \
            "$RUNNER_TEMP/ffmpeg-android13-objects.json"
          grep -q 'name: "libavcodec"' "$RUNNER_TEMP/codec2-sources/ffmpeg/Android.bp"
          grep -q 'name: "android.hardware.media.c2@1.2-service-ffmpeg"' \
            "$RUNNER_TEMP/codec2-sources/ffmpeg_codec2/Android.bp"
          ! grep -q 'libavformat' "$RUNNER_TEMP/codec2-sources/ffmpeg_codec2/Android.bp"

      - name: Show compact inventory
        run: |
          python3 - "$RUNNER_TEMP/ffmpeg-android13-objects.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          print(f"revision={data['ffmpeg_revision']}")
          print(f"total_objects={data['total_objects']}")
          selected = 0
          for name, item in data['libraries'].items():
              print(f"{name}: objects={item['object_count']} deps={','.join(item['fflibs']) or '-'}")
              if name != 'libavformat':
                  selected += item['object_count']
          print(f"narrow_soong_objects={selected}")
          if selected != 1102:
              raise SystemExit(f"unexpected narrow Soong object count: {selected}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pitv-ffmpeg-android13-object-inventory-${{ github.sha }}
          path: ${{ runner.temp }}/ffmpeg-android13-objects.json
          if-no-files-found: error
          retention-days: 7
