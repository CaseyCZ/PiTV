name: Codec2 Narrow Diagnostic

on:
  push:
    branches: [experiment/rpi4-codec2-narrow-soong-graph]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: codec2-narrow-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  narrow-diagnostic:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[diag-narrow]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TREE: ${{ github.workspace }}/android13
      SOURCES: ${{ github.workspace }}/codec2-sources
      OUT: ${{ github.workspace }}/codec2-payload
      PITV_CODEC2_LUNCH: aosp_rpi4_tv-userdebug
      PITV_CODEC2_JOBS: 2
      PITV_CODEC2_REQUIRED_GB: 10
      PITV_CODEC2_REQUIRE_BOOTSTRAP_REUSE: 1
      PITV_CODEC2_NORMALIZE_BOOTSTRAP_REUSE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync exact Android tree
        run: |
          mkdir -p "$TREE" && cd "$TREE"
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r75 --depth=1
          curl -fsSL --create-dirs -o .repo/local_manifests/manifest_brcm_rpi4.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/manifest_brcm_rpi4.xml
          curl -fsSL -o .repo/local_manifests/remove_projects.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/remove_projects.xml
          for attempt in 1 2 3; do
            echo "CODEC2_REPO_SYNC_ATTEMPT=$attempt"
            if repo sync -c --no-tags --no-clone-bundle --optimized-fetch --fail-fast -j8; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android repo sync failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          repo manifest -r > "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"

      - name: Warm local Soong bootstrap
        run: |
          python3 scripts/fetch-minimal-codec2-sources.py "$SOURCES"
          set +e
          timeout --signal=TERM --kill-after=15s 90s env PITV_CODEC2_REQUIRE_BOOTSTRAP_REUSE=0 PITV_CODEC2_PHASE=graph bash scripts/build-minimal-codec2-modules.sh "$TREE" "$SOURCES" "$OUT"
          rc=$?
          set -e
          echo "CODEC2_NARROW_LOCAL_BOOTSTRAP_RC=$rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi
          for _ in $(seq 1 20); do
            if ! pgrep -x soong_ui >/dev/null 2>&1 && ! pgrep -x ninja >/dev/null 2>&1 && ! pgrep -x soong_build >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          pkill -KILL -x soong_ui 2>/dev/null || true
          pkill -KILL -x ninja 2>/dev/null || true
          pkill -KILL -x soong_build 2>/dev/null || true

          bootstrap_builder="$TREE/out/host/linux-x86/bin/soong_build"
          bootstrap_source="$TREE/out/soong/host/linux-x86/bin/soong_build"
          if [ ! -s "$bootstrap_builder" ] && [ -s "$bootstrap_source" ]; then
            mkdir -p "$(dirname "$bootstrap_builder")"
            cp "$bootstrap_source" "$bootstrap_builder"
          fi
          test -s "$bootstrap_builder"
          chmod +x "$bootstrap_builder"

          bootstrap_ninja="$TREE/out/soong/bootstrap.ninja"
          bootstrap_ninja_exe="$TREE/prebuilts/build-tools/linux-x86/bin/ninja"
          [ -x "$bootstrap_ninja_exe" ] || bootstrap_ninja_exe="$(command -v ninja)"
          test -s "$bootstrap_ninja"

          for tool in sbox soong_zip zipsync merge_zips ndkstubgen; do
            bootstrap_tool="$TREE/out/soong/host/linux-x86/bin/$tool"
            host_tool="$TREE/out/host/linux-x86/bin/$tool"
            if [ ! -s "$host_tool" ]; then
              (
                cd "$TREE"
                "$bootstrap_ninja_exe" -f out/soong/bootstrap.ninja "out/soong/host/linux-x86/bin/$tool"
              )
              test -s "$bootstrap_tool"
              mkdir -p "$(dirname "$host_tool")"
              cp "$bootstrap_tool" "$host_tool"
              chmod +x "$host_tool"
              echo "CODEC2_NARROW_PROMOTED_${tool^^}=1"
            fi
          done

          mkdir -p "$TREE/out/soong"
          cp "${GITHUB_WORKSPACE}/pitv-source-manifest.xml" "$TREE/out/soong/pitv-source-manifest.xml"
          echo "CODEC2_NARROW_LOCAL_BOOTSTRAP_READY=1"

      - name: Build isolated Python 2.7
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz \
            -o /tmp/Python-2.7.18.tgz
          mkdir -p /tmp/pitv-python27-src
          tar -xzf /tmp/Python-2.7.18.tgz -C /tmp/pitv-python27-src --strip-components=1
          (
            cd /tmp/pitv-python27-src
            ./configure --prefix=/tmp/pitv-python27 --without-ensurepip > /tmp/pitv-python27-configure.log
            make -j2 > /tmp/pitv-python27-build.log 2>&1
            make install > /tmp/pitv-python27-install.log 2>&1
          )
          echo "/tmp/pitv-python27/bin" >> "$GITHUB_PATH"
          /tmp/pitv-python27/bin/python2.7 --version

      - name: Build narrow V4L2 AVC service and capture diagnostics
        id: narrow
        shell: bash
        run: |
          python3 scripts/fetch-minimal-codec2-sources.py "$SOURCES"
          log="$RUNNER_TEMP/codec2-narrow.log"
          set +e
          PITV_CODEC2_PHASE=narrow-build bash scripts/build-minimal-codec2-modules.sh "$TREE" "$SOURCES" "$OUT" 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

          {
            echo "## Codec2 narrow diagnostic"
            echo
            echo "Exit code: $rc"
            echo
            echo '```text'
            grep -E 'FAILED:|(^|[[:space:]])error:|fatal error:|ninja:|missing and no known rule|missing dependencies|CODEC2_[A-Z0-9_]*(ISSUE|FAILED|RC|MISSING|NOT_FOUND)' "$log" | tail -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -ne 0 ]; then
            first="$(grep -E 'FAILED:|(^|[[:space:]])error:|fatal error:|ninja:|missing and no known rule|missing dependencies|CODEC2_[A-Z0-9_]*(ISSUE|FAILED|MISSING|NOT_FOUND)' "$log" | tail -n 1 || true)"
            first="${first//'%'/'%25'}"
            first="${first//$'\r'/'%0D'}"
            first="${first//$'\n'/'%0A'}"
            echo "::error title=Codec2 narrow build failed::$first"
          fi

      - name: Upload narrow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codec2-narrow-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/codec2-narrow.log
          if-no-files-found: warn
          retention-days: 3

      - name: Verify narrow build result
        if: always()
        shell: bash
        run: |
          rc='${{ steps.narrow.outputs.rc }}'
          if [ -z "$rc" ]; then
            echo "Missing narrow build exit code" >&2
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          test -s "$TREE/out/soong/pitv-codec2.ninja"
          find "$TREE/out" -type f -name 'android.hardware.media.c2@1.0-service-v4l2-64' -print -quit | grep -q .
          echo "CODEC2_NARROW_DIAGNOSTIC_READY=1"
