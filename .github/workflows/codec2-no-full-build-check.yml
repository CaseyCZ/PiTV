name: Codec2 No Full Build Check

on:
  push:
    branches: [experiment/rpi4-codec2-no-full-build, experiment/rpi4-codec2-runner24-test, experiment/rpi4-codec2-narrow-soong-graph]
  pull_request:
    paths:
      - 'scripts/*codec2*'
      - 'docs/experiments/*codec2*'
      - 'android/waydroid-rpi4/**'
      - '.github/workflows/codec2-no-full-build-check.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: codec2-no-full-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate no-full-build helpers
        run: bash scripts/check-codec2-no-full-build.sh


  codec2-reuse-diagnose:
    if: contains(github.event.head_commit.message, '[diagnose-codec2]')
    needs: [static]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TREE: ${{ github.workspace }}/android13
      SOURCES: ${{ github.workspace }}/codec2-sources
      OUT: ${{ github.workspace }}/codec2-payload
      PITV_CODEC2_LUNCH: aosp_rpi4_tv-userdebug
      PITV_CODEC2_JOBS: 2
      PITV_CODEC2_REQUIRED_GB: 10
      PITV_CODEC2_REQUIRE_BOOTSTRAP_REUSE: 1
      PITV_CODEC2_NORMALIZE_BOOTSTRAP_REUSE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h /
      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Sync exact Android tree for reuse diagnosis
        run: |
          mkdir -p "$TREE" && cd "$TREE"
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r75 --depth=1
          curl -fsSL --create-dirs -o .repo/local_manifests/manifest_brcm_rpi4.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/manifest_brcm_rpi4.xml
          curl -fsSL -o .repo/local_manifests/remove_projects.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/remove_projects.xml
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch --fail-fast -j8
          repo manifest -r > "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          df -h "$TREE"
      - name: Download known-good bootstrap checkpoint from run 411
        uses: actions/download-artifact@v4
        with:
          name: pitv-codec2-bootstrap-ceb7b7bfc756107cd2fb12423665112e58f16866
          path: codec2-bootstrap-checkpoint
          github-token: ${{ github.token }}
          repository: CaseyCZ/PiTV
          run-id: 35591736044
      - name: Restore and verify bootstrap checkpoint
        run: |
          test -f codec2-bootstrap-checkpoint/codec2-bootstrap-state.tar.zst
          tar --zstd -xf codec2-bootstrap-checkpoint/codec2-bootstrap-state.tar.zst -C "$TREE"
          test -f "$TREE/out/soong/pitv-source-manifest.xml"
          cmp "$TREE/out/soong/pitv-source-manifest.xml" "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          test -x "$TREE/out/host/linux-x86/bin/soong_build"
      - name: Explain dirty bootstrap edges without rebuilding
        run: |
          python3 scripts/fetch-minimal-codec2-sources.py "$SOURCES"
          PITV_CODEC2_PHASE=diagnose bash scripts/build-minimal-codec2-modules.sh "$TREE" "$SOURCES" "$OUT"

  codec2-bootstrap:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-codec2]')
    needs: [static]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TREE: ${{ github.workspace }}/android13
      SOURCES: ${{ github.workspace }}/codec2-sources
      OUT: ${{ github.workspace }}/codec2-payload
      PITV_CODEC2_LUNCH: aosp_rpi4_tv-userdebug
      PITV_CODEC2_JOBS: 2
      PITV_CODEC2_REQUIRED_GB: 10
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h /
      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Sync shallow Raspberry Vanilla Android 13 tree
        run: |
          mkdir -p "$TREE" && cd "$TREE"
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r75 --depth=1
          curl -fsSL --create-dirs -o .repo/local_manifests/manifest_brcm_rpi4.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/manifest_brcm_rpi4.xml
          curl -fsSL -o .repo/local_manifests/remove_projects.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/remove_projects.xml
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch --fail-fast -j8
          repo manifest -r > "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          df -h "$TREE"
      - name: Warm Soong bootstrap within runner budget
        run: |
          python3 scripts/fetch-minimal-codec2-sources.py "$SOURCES"
          set +e
          timeout --signal=TERM --kill-after=15s 90s env PITV_CODEC2_PHASE=graph bash scripts/build-minimal-codec2-modules.sh "$TREE" "$SOURCES" "$OUT"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi
          # Soong handles SIGTERM asynchronously. Do not archive a live out/ tree.
          for _ in $(seq 1 20); do
            if ! pgrep -x soong_ui >/dev/null 2>&1 && \
               ! pgrep -x ninja >/dev/null 2>&1 && \
               ! pgrep -x soong_build >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if pgrep -x soong_ui >/dev/null 2>&1 || \
             pgrep -x ninja >/dev/null 2>&1 || \
             pgrep -x soong_build >/dev/null 2>&1; then
            echo "Soong bootstrap processes still alive after timeout cleanup" >&2
            pkill -KILL -x soong_ui 2>/dev/null || true
            pkill -KILL -x ninja 2>/dev/null || true
            pkill -KILL -x soong_build 2>/dev/null || true
            sleep 1
          fi
          test -x "$TREE/out/host/linux-x86/bin/soong_build"
          mkdir -p "$TREE/out/soong"
          cp "${GITHUB_WORKSPACE}/pitv-source-manifest.xml" "$TREE/out/soong/pitv-source-manifest.xml"
          du -sh "$TREE/out"
          tar --exclude='out/.path_interposer_log' --zstd -cf "${GITHUB_WORKSPACE}/codec2-bootstrap-state.tar.zst" -C "$TREE" out
          ls -lh "${GITHUB_WORKSPACE}/codec2-bootstrap-state.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: pitv-codec2-bootstrap-${{ github.sha }}
          path: codec2-bootstrap-state.tar.zst
          if-no-files-found: error
          retention-days: 2

  codec2-graph:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-codec2]')
    needs: [static, codec2-bootstrap]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TREE: ${{ github.workspace }}/android13
      SOURCES: ${{ github.workspace }}/codec2-sources
      OUT: ${{ github.workspace }}/codec2-payload
      PITV_CODEC2_LUNCH: aosp_rpi4_tv-userdebug
      PITV_CODEC2_JOBS: 2
      PITV_CODEC2_REQUIRED_GB: 10
      PITV_CODEC2_REQUIRE_BOOTSTRAP_REUSE: 1
      PITV_CODEC2_NORMALIZE_BOOTSTRAP_REUSE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h /
      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Sync shallow Raspberry Vanilla Android 13 tree
        run: |
          mkdir -p "$TREE" && cd "$TREE"
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r75 --depth=1
          curl -fsSL --create-dirs -o .repo/local_manifests/manifest_brcm_rpi4.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/manifest_brcm_rpi4.xml
          curl -fsSL -o .repo/local_manifests/remove_projects.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/remove_projects.xml
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch --fail-fast -j8
          repo manifest -r > "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          df -h "$TREE"
      - uses: actions/download-artifact@v4
        with:
          name: pitv-codec2-bootstrap-${{ github.sha }}
          path: codec2-bootstrap-checkpoint
      - name: Restore warmed Soong bootstrap
        run: |
          test -f codec2-bootstrap-checkpoint/codec2-bootstrap-state.tar.zst
          tar --zstd -xf codec2-bootstrap-checkpoint/codec2-bootstrap-state.tar.zst -C "$TREE"
          test -x "$TREE/out/host/linux-x86/bin/soong_build"
          test -f "$TREE/out/soong/pitv-source-manifest.xml"
          test -f "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          cmp "$TREE/out/soong/pitv-source-manifest.xml" "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          du -sh "$TREE/out"
      - name: Generate resumable Soong graph checkpoint
        run: |
          python3 scripts/fetch-minimal-codec2-sources.py "$SOURCES"
          PITV_CODEC2_PHASE=graph bash scripts/build-minimal-codec2-modules.sh "$TREE" "$SOURCES" "$OUT"
          test -x "$TREE/out/host/linux-x86/bin/soong_build"
          du -sh "$TREE/out"
          tar --zstd -cf "${GITHUB_WORKSPACE}/codec2-graph-state.tar.zst" -C "$TREE" out
          ls -lh "${GITHUB_WORKSPACE}/codec2-graph-state.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: pitv-codec2-graph-${{ github.sha }}
          path: codec2-graph-state.tar.zst
          if-no-files-found: error
          retention-days: 2

  reduced-build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-codec2]')
    needs: [static, codec2-graph]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TREE: ${{ github.workspace }}/android13
      SOURCES: ${{ github.workspace }}/codec2-sources
      OUT: ${{ github.workspace }}/codec2-payload
      PITV_CODEC2_LUNCH: aosp_rpi4_tv-userdebug
      PITV_CODEC2_JOBS: 2
      PITV_CODEC2_REQUIRED_GB: 10
      PITV_CODEC2_REQUIRE_BOOTSTRAP_REUSE: 1
      PITV_CODEC2_NORMALIZE_BOOTSTRAP_REUSE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h /
      - name: Install reduced-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core flex bison build-essential curl zlib1g-dev libc6-dev-i386 libncurses-dev lib32z1-dev libxml2-utils xsltproc unzip python3 bc ninja-build pkg-config
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Sync shallow Raspberry Vanilla Android 13 tree
        run: |
          mkdir -p "$TREE" && cd "$TREE"
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r75 --depth=1
          curl -fsSL --create-dirs -o .repo/local_manifests/manifest_brcm_rpi4.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/manifest_brcm_rpi4.xml
          curl -fsSL -o .repo/local_manifests/remove_projects.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/remove_projects.xml
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch --fail-fast -j8
          repo manifest -r > "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          df -h "$TREE"
      - name: Fetch pinned Codec2 sources
        run: python3 scripts/fetch-minimal-codec2-sources.py "$SOURCES"
      - uses: actions/download-artifact@v4
        with:
          name: pitv-codec2-graph-${{ github.sha }}
          path: codec2-graph-checkpoint
      - name: Restore Soong graph checkpoint
        run: |
          test -f codec2-graph-checkpoint/codec2-graph-state.tar.zst
          tar --zstd -xf codec2-graph-checkpoint/codec2-graph-state.tar.zst -C "$TREE"
          test -x "$TREE/out/host/linux-x86/bin/soong_build"
          test -f "$TREE/out/soong/pitv-source-manifest.xml"
          test -f "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          cmp "$TREE/out/soong/pitv-source-manifest.xml" "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          du -sh "$TREE/out"
      - name: Build pinned Codec2 modules and payload
        run: |
          PITV_CODEC2_PHASE=modules bash scripts/build-minimal-codec2-modules.sh "$TREE" "$SOURCES" "$OUT"
          python3 scripts/codec2-payload-readiness.py "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pitv-rpi4-codec2-payload-${{ github.sha }}
          path: codec2-payload/
          if-no-files-found: error
          retention-days: 14
