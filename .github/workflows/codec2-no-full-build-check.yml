name: Codec2 No Full Build Check

on:
  push:
    branches: [experiment/rpi4-codec2-no-full-build, experiment/rpi4-codec2-runner24-test, experiment/rpi4-codec2-narrow-soong-graph]
  pull_request:
    paths:
      - 'scripts/*codec2*'
      - 'docs/experiments/*codec2*'
      - 'android/waydroid-rpi4/**'
      - '.github/workflows/codec2-no-full-build-check.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: codec2-no-full-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate no-full-build helpers
        run: bash scripts/check-codec2-no-full-build.sh


  codec2-reuse-diagnose:
    if: contains(github.event.head_commit.message, '[diagnose-codec2]')
    needs: [static]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TREE: ${{ github.workspace }}/android13
      SOURCES: ${{ github.workspace }}/codec2-sources
      OUT: ${{ github.workspace }}/codec2-payload
      PITV_CODEC2_LUNCH: aosp_rpi4_tv-userdebug
      PITV_CODEC2_JOBS: 2
      PITV_CODEC2_REQUIRED_GB: 10
      PITV_CODEC2_REQUIRE_BOOTSTRAP_REUSE: 1
      PITV_CODEC2_NORMALIZE_BOOTSTRAP_REUSE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h /
      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Sync exact Android tree for reuse diagnosis
        run: |
          mkdir -p "$TREE" && cd "$TREE"
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r75 --depth=1
          curl -fsSL --create-dirs -o .repo/local_manifests/manifest_brcm_rpi4.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/manifest_brcm_rpi4.xml
          curl -fsSL -o .repo/local_manifests/remove_projects.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/remove_projects.xml
          for attempt in 1 2 3; do
            echo "CODEC2_REPO_SYNC_ATTEMPT=$attempt"
            if repo sync -c --no-tags --no-clone-bundle --optimized-fetch --fail-fast -j8; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android repo sync failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          repo manifest -r > "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          df -h "$TREE"
      - name: Download known-good bootstrap checkpoint from run 411
        uses: actions/download-artifact@v4
        with:
          name: pitv-codec2-bootstrap-ceb7b7bfc756107cd2fb12423665112e58f16866
          path: codec2-bootstrap-checkpoint
          github-token: ${{ github.token }}
          repository: CaseyCZ/PiTV
          run-id: 35591736044
      - name: Restore and verify bootstrap checkpoint
        run: |
          test -f codec2-bootstrap-checkpoint/codec2-bootstrap-state.tar.zst
          tar --zstd -xf codec2-bootstrap-checkpoint/codec2-bootstrap-state.tar.zst -C "$TREE"
          test -f "$TREE/out/soong/pitv-source-manifest.xml"
          cmp "$TREE/out/soong/pitv-source-manifest.xml" "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          test -x "$TREE/out/host/linux-x86/bin/soong_build"
      - name: Explain dirty bootstrap edges without rebuilding
        run: |
          python3 scripts/fetch-minimal-codec2-sources.py "$SOURCES"
          PITV_CODEC2_PHASE=diagnose bash scripts/build-minimal-codec2-modules.sh "$TREE" "$SOURCES" "$OUT"


  codec2-narrow-probe:
    if: contains(github.event.head_commit.message, '[probe-codec2]')
    needs: [static]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TREE: ${{ github.workspace }}/android13
      SOURCES: ${{ github.workspace }}/codec2-sources
      OUT: ${{ github.workspace }}/codec2-payload
      PITV_CODEC2_LUNCH: aosp_rpi4_tv-userdebug
      PITV_CODEC2_JOBS: 2
      PITV_CODEC2_REQUIRED_GB: 10
      PITV_CODEC2_REQUIRE_BOOTSTRAP_REUSE: 1
      PITV_CODEC2_NORMALIZE_BOOTSTRAP_REUSE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h /
      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Sync exact Android tree for narrow probe
        run: |
          mkdir -p "$TREE" && cd "$TREE"
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r75 --depth=1
          curl -fsSL --create-dirs -o .repo/local_manifests/manifest_brcm_rpi4.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/manifest_brcm_rpi4.xml
          curl -fsSL -o .repo/local_manifests/remove_projects.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/remove_projects.xml
          for attempt in 1 2 3; do
            echo "CODEC2_REPO_SYNC_ATTEMPT=$attempt"
            if repo sync -c --no-tags --no-clone-bundle --optimized-fetch --fail-fast -j8; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android repo sync failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          repo manifest -r > "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
      - name: Warm local Soong bootstrap for narrow probe
        run: |
          python3 scripts/fetch-minimal-codec2-sources.py "$SOURCES"
          set +e
          timeout --signal=TERM --kill-after=15s 90s env PITV_CODEC2_REQUIRE_BOOTSTRAP_REUSE=0 PITV_CODEC2_PHASE=graph bash scripts/build-minimal-codec2-modules.sh "$TREE" "$SOURCES" "$OUT"
          rc=$?
          set -e
          echo "CODEC2_NARROW_LOCAL_BOOTSTRAP_RC=$rc"
          for _ in $(seq 1 20); do
            if ! pgrep -x soong_ui >/dev/null 2>&1 && \
               ! pgrep -x ninja >/dev/null 2>&1 && \
               ! pgrep -x soong_build >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if pgrep -x soong_ui >/dev/null 2>&1 || \
             pgrep -x ninja >/dev/null 2>&1 || \
             pgrep -x soong_build >/dev/null 2>&1; then
            pkill -KILL -x soong_ui 2>/dev/null || true
            pkill -KILL -x ninja 2>/dev/null || true
            pkill -KILL -x soong_build 2>/dev/null || true
            sleep 1
          fi
          bootstrap_builder="$TREE/out/host/linux-x86/bin/soong_build"
          bootstrap_source="$TREE/out/soong/host/linux-x86/bin/soong_build"
          if [ ! -s "$bootstrap_builder" ] && [ -s "$bootstrap_source" ]; then
            mkdir -p "$(dirname "$bootstrap_builder")"
            cp "$bootstrap_source" "$bootstrap_builder"
            echo "CODEC2_NARROW_PROMOTED_SOONG_BUILDER=1"
          fi
          test -s "$bootstrap_builder"
          chmod +x "$bootstrap_builder"
          ls -l "$bootstrap_builder"

          # HIDL code generation uses sbox as a host tool. The 90s warmup
          # intentionally stops after soong_build is ready, so build only the
          # bootstrap sbox target here and promote it to HOST_OUT for the
          # subsequent narrow Ninja graph.
          bootstrap_ninja="$TREE/out/soong/bootstrap.ninja"
          bootstrap_sbox="$TREE/out/soong/host/linux-x86/bin/sbox"
          host_sbox="$TREE/out/host/linux-x86/bin/sbox"
          if [ ! -s "$host_sbox" ]; then
            test -s "$bootstrap_ninja"
            bootstrap_ninja_exe="$TREE/prebuilts/build-tools/linux-x86/bin/ninja"
            [ -x "$bootstrap_ninja_exe" ] || bootstrap_ninja_exe="$(command -v ninja)"
            (
              cd "$TREE"
              "$bootstrap_ninja_exe" -f out/soong/bootstrap.ninja out/soong/host/linux-x86/bin/sbox
            )
            test -s "$bootstrap_sbox"
            mkdir -p "$(dirname "$host_sbox")"
            cp "$bootstrap_sbox" "$host_sbox"
            chmod +x "$host_sbox"
            echo "CODEC2_NARROW_PROMOTED_SBOX=1"
          fi
          test -x "$host_sbox"
          ls -l "$host_sbox"

          # libchrome generated headers use soong_zip. Build the single
          # bootstrap host tool and promote it to HOST_OUT just like sbox.
          bootstrap_soong_zip="$TREE/out/soong/host/linux-x86/bin/soong_zip"
          host_soong_zip="$TREE/out/host/linux-x86/bin/soong_zip"
          if [ ! -s "$host_soong_zip" ]; then
            (
              cd "$TREE"
              "$bootstrap_ninja_exe" -f out/soong/bootstrap.ninja out/soong/host/linux-x86/bin/soong_zip
            )
            test -s "$bootstrap_soong_zip"
            mkdir -p "$(dirname "$host_soong_zip")"
            cp "$bootstrap_soong_zip" "$host_soong_zip"
            chmod +x "$host_soong_zip"
            echo "CODEC2_NARROW_PROMOTED_SOONG_ZIP=1"
          fi
          test -x "$host_soong_zip"
          ls -l "$host_soong_zip"

          # libchrome header extraction also uses zipsync. Build only that
          # bootstrap host tool and promote it to the HOST_OUT path expected
          # by the narrow target graph.
          bootstrap_zipsync="$TREE/out/soong/host/linux-x86/bin/zipsync"
          host_zipsync="$TREE/out/host/linux-x86/bin/zipsync"
          if [ ! -s "$host_zipsync" ]; then
            (
              cd "$TREE"
              "$bootstrap_ninja_exe" -f out/soong/bootstrap.ninja out/soong/host/linux-x86/bin/zipsync
            )
            test -s "$bootstrap_zipsync"
            mkdir -p "$(dirname "$host_zipsync")"
            cp "$bootstrap_zipsync" "$host_zipsync"
            chmod +x "$host_zipsync"
            echo "CODEC2_NARROW_PROMOTED_ZIPSYNC=1"
          fi
          test -x "$host_zipsync"
          ls -l "$host_zipsync"

          # libchrome JNI generation uses merge_zips as another bootstrap host
          # tool. Build only that target and promote it to HOST_OUT.
          bootstrap_merge_zips="$TREE/out/soong/host/linux-x86/bin/merge_zips"
          host_merge_zips="$TREE/out/host/linux-x86/bin/merge_zips"
          if [ ! -s "$host_merge_zips" ]; then
            (
              cd "$TREE"
              "$bootstrap_ninja_exe" -f out/soong/bootstrap.ninja out/soong/host/linux-x86/bin/merge_zips
            )
            test -s "$bootstrap_merge_zips"
            mkdir -p "$(dirname "$host_merge_zips")"
            cp "$bootstrap_merge_zips" "$host_merge_zips"
            chmod +x "$host_merge_zips"
            echo "CODEC2_NARROW_PROMOTED_MERGE_ZIPS=1"
          fi
          test -x "$host_merge_zips"
          ls -l "$host_merge_zips"

          mkdir -p "$TREE/out/soong"
          cp "${GITHUB_WORKSPACE}/pitv-source-manifest.xml" "$TREE/out/soong/pitv-source-manifest.xml"
          echo "CODEC2_NARROW_LOCAL_BOOTSTRAP_READY=1"
      - name: Build narrow V4L2 AVC service
        run: |
          python3 scripts/fetch-minimal-codec2-sources.py "$SOURCES"
          PITV_CODEC2_PHASE=narrow-build bash scripts/build-minimal-codec2-modules.sh "$TREE" "$SOURCES" "$OUT"
          test -s "$TREE/out/soong/pitv-codec2.ninja"
          find "$TREE/out" -type f -name 'android.hardware.media.c2@1.0-service-v4l2-64' -print -quit | grep -q .
          echo "CODEC2_NARROW_WORKFLOW_READY=1"

  codec2-bootstrap:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-codec2]')
    needs: [static]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TREE: ${{ github.workspace }}/android13
      SOURCES: ${{ github.workspace }}/codec2-sources
      OUT: ${{ github.workspace }}/codec2-payload
      PITV_CODEC2_LUNCH: aosp_rpi4_tv-userdebug
      PITV_CODEC2_JOBS: 2
      PITV_CODEC2_REQUIRED_GB: 10
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h /
      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Sync shallow Raspberry Vanilla Android 13 tree
        run: |
          mkdir -p "$TREE" && cd "$TREE"
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r75 --depth=1
          curl -fsSL --create-dirs -o .repo/local_manifests/manifest_brcm_rpi4.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/manifest_brcm_rpi4.xml
          curl -fsSL -o .repo/local_manifests/remove_projects.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/remove_projects.xml
          for attempt in 1 2 3; do
            echo "CODEC2_REPO_SYNC_ATTEMPT=$attempt"
            if repo sync -c --no-tags --no-clone-bundle --optimized-fetch --fail-fast -j8; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android repo sync failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          repo manifest -r > "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          df -h "$TREE"
      - name: Warm Soong bootstrap within runner budget
        run: |
          python3 scripts/fetch-minimal-codec2-sources.py "$SOURCES"
          set +e
          timeout --signal=TERM --kill-after=15s 90s env PITV_CODEC2_PHASE=graph bash scripts/build-minimal-codec2-modules.sh "$TREE" "$SOURCES" "$OUT"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi
          # Soong handles SIGTERM asynchronously. Do not archive a live out/ tree.
          for _ in $(seq 1 20); do
            if ! pgrep -x soong_ui >/dev/null 2>&1 && \
               ! pgrep -x ninja >/dev/null 2>&1 && \
               ! pgrep -x soong_build >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if pgrep -x soong_ui >/dev/null 2>&1 || \
             pgrep -x ninja >/dev/null 2>&1 || \
             pgrep -x soong_build >/dev/null 2>&1; then
            echo "Soong bootstrap processes still alive after timeout cleanup" >&2
            pkill -KILL -x soong_ui 2>/dev/null || true
            pkill -KILL -x ninja 2>/dev/null || true
            pkill -KILL -x soong_build 2>/dev/null || true
            sleep 1
          fi
          test -x "$TREE/out/host/linux-x86/bin/soong_build"
          mkdir -p "$TREE/out/soong"
          cp "${GITHUB_WORKSPACE}/pitv-source-manifest.xml" "$TREE/out/soong/pitv-source-manifest.xml"
          du -sh "$TREE/out"
          tar --exclude='out/.path_interposer_log' --zstd -cf "${GITHUB_WORKSPACE}/codec2-bootstrap-state.tar.zst" -C "$TREE" out
          ls -lh "${GITHUB_WORKSPACE}/codec2-bootstrap-state.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: pitv-codec2-bootstrap-${{ github.sha }}
          path: codec2-bootstrap-state.tar.zst
          if-no-files-found: error
          retention-days: 2

  codec2-graph:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-codec2]')
    needs: [static, codec2-bootstrap]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TREE: ${{ github.workspace }}/android13
      SOURCES: ${{ github.workspace }}/codec2-sources
      OUT: ${{ github.workspace }}/codec2-payload
      PITV_CODEC2_LUNCH: aosp_rpi4_tv-userdebug
      PITV_CODEC2_JOBS: 2
      PITV_CODEC2_REQUIRED_GB: 10
      PITV_CODEC2_REQUIRE_BOOTSTRAP_REUSE: 1
      PITV_CODEC2_NORMALIZE_BOOTSTRAP_REUSE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h /
      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Sync shallow Raspberry Vanilla Android 13 tree
        run: |
          mkdir -p "$TREE" && cd "$TREE"
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r75 --depth=1
          curl -fsSL --create-dirs -o .repo/local_manifests/manifest_brcm_rpi4.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/manifest_brcm_rpi4.xml
          curl -fsSL -o .repo/local_manifests/remove_projects.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/remove_projects.xml
          for attempt in 1 2 3; do
            echo "CODEC2_REPO_SYNC_ATTEMPT=$attempt"
            if repo sync -c --no-tags --no-clone-bundle --optimized-fetch --fail-fast -j8; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android repo sync failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          repo manifest -r > "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          df -h "$TREE"
      - uses: actions/download-artifact@v4
        with:
          name: pitv-codec2-bootstrap-${{ github.sha }}
          path: codec2-bootstrap-checkpoint
      - name: Restore warmed Soong bootstrap
        run: |
          test -f codec2-bootstrap-checkpoint/codec2-bootstrap-state.tar.zst
          tar --zstd -xf codec2-bootstrap-checkpoint/codec2-bootstrap-state.tar.zst -C "$TREE"
          test -x "$TREE/out/host/linux-x86/bin/soong_build"
          test -f "$TREE/out/soong/pitv-source-manifest.xml"
          test -f "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          cmp "$TREE/out/soong/pitv-source-manifest.xml" "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          du -sh "$TREE/out"
      - name: Generate resumable Soong graph checkpoint
        run: |
          python3 scripts/fetch-minimal-codec2-sources.py "$SOURCES"
          PITV_CODEC2_PHASE=graph bash scripts/build-minimal-codec2-modules.sh "$TREE" "$SOURCES" "$OUT"
          test -x "$TREE/out/host/linux-x86/bin/soong_build"
          du -sh "$TREE/out"
          tar --zstd -cf "${GITHUB_WORKSPACE}/codec2-graph-state.tar.zst" -C "$TREE" out
          ls -lh "${GITHUB_WORKSPACE}/codec2-graph-state.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: pitv-codec2-graph-${{ github.sha }}
          path: codec2-graph-state.tar.zst
          if-no-files-found: error
          retention-days: 2

  reduced-build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-codec2]')
    needs: [static, codec2-graph]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TREE: ${{ github.workspace }}/android13
      SOURCES: ${{ github.workspace }}/codec2-sources
      OUT: ${{ github.workspace }}/codec2-payload
      PITV_CODEC2_LUNCH: aosp_rpi4_tv-userdebug
      PITV_CODEC2_JOBS: 2
      PITV_CODEC2_REQUIRED_GB: 10
      PITV_CODEC2_REQUIRE_BOOTSTRAP_REUSE: 1
      PITV_CODEC2_NORMALIZE_BOOTSTRAP_REUSE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h /
      - name: Install reduced-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core flex bison build-essential curl zlib1g-dev libc6-dev-i386 libncurses-dev lib32z1-dev libxml2-utils xsltproc unzip python3 bc ninja-build pkg-config
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Sync shallow Raspberry Vanilla Android 13 tree
        run: |
          mkdir -p "$TREE" && cd "$TREE"
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r75 --depth=1
          curl -fsSL --create-dirs -o .repo/local_manifests/manifest_brcm_rpi4.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/manifest_brcm_rpi4.xml
          curl -fsSL -o .repo/local_manifests/remove_projects.xml https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/remove_projects.xml
          for attempt in 1 2 3; do
            echo "CODEC2_REPO_SYNC_ATTEMPT=$attempt"
            if repo sync -c --no-tags --no-clone-bundle --optimized-fetch --fail-fast -j8; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android repo sync failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          repo manifest -r > "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          df -h "$TREE"
      - name: Fetch pinned Codec2 sources
        run: python3 scripts/fetch-minimal-codec2-sources.py "$SOURCES"
      - uses: actions/download-artifact@v4
        with:
          name: pitv-codec2-graph-${{ github.sha }}
          path: codec2-graph-checkpoint
      - name: Restore Soong graph checkpoint
        run: |
          test -f codec2-graph-checkpoint/codec2-graph-state.tar.zst
          tar --zstd -xf codec2-graph-checkpoint/codec2-graph-state.tar.zst -C "$TREE"
          test -x "$TREE/out/host/linux-x86/bin/soong_build"
          test -f "$TREE/out/soong/pitv-source-manifest.xml"
          test -f "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          cmp "$TREE/out/soong/pitv-source-manifest.xml" "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          du -sh "$TREE/out"
      - name: Build pinned Codec2 modules and payload
        run: |
          PITV_CODEC2_PHASE=modules bash scripts/build-minimal-codec2-modules.sh "$TREE" "$SOURCES" "$OUT"
          python3 scripts/codec2-payload-readiness.py "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pitv-rpi4-codec2-payload-${{ github.sha }}
          path: codec2-payload/
          if-no-files-found: error
          retention-days: 14
