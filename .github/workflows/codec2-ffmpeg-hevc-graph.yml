name: Codec2 Narrow FFmpeg HEVC Graph

on:
  push:
    branches: [experiment/rpi4-codec2-narrow-soong-graph]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: codec2-ffmpeg-hevc-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[probe-ffmpeg-hevc-graph]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TREE: ${{ github.workspace }}/android13
      SOURCES: ${{ github.workspace }}/codec2-sources
      PITV_CODEC2_NARROW_REQUIRED_MODULES: libdav1d,libdrm,libcutils
      PITV_CODEC2_NARROW_MAX_ATTEMPTS: 64
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync exact Raspberry Vanilla Android 13 tree
        run: |
          mkdir -p "$TREE" && cd "$TREE"
          repo init -u https://android.googlesource.com/platform/manifest -b android-13.0.0_r75 --depth=1
          curl -fsSL --create-dirs -o .repo/local_manifests/manifest_brcm_rpi4.xml \
            https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/manifest_brcm_rpi4.xml
          curl -fsSL -o .repo/local_manifests/remove_projects.xml \
            https://raw.githubusercontent.com/raspberry-vanilla/android_local_manifest/android-13.0/remove_projects.xml
          for attempt in 1 2 3; do
            echo "CODEC2_REPO_SYNC_ATTEMPT=$attempt"
            if repo sync -c --no-tags --no-clone-bundle --optimized-fetch --fail-fast -j8; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android repo sync failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          repo manifest -r > "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          rm -rf "$TREE/.repo"
          echo "CODEC2_FFMPEG_HEVC_DROP_REPO_METADATA=1"
          df -h "$TREE"

      - name: Fetch pinned Codec2 sources
        run: python3 scripts/fetch-minimal-codec2-sources.py "$SOURCES"

      - name: Download known-good staged bootstrap checkpoint
        uses: actions/download-artifact@v4
        with:
          name: pitv-codec2-staged-bootstrap-b05e1176f7f5e2d56f32f2f89f766bfdc5957e64
          path: codec2-bootstrap-checkpoint
          github-token: ${{ github.token }}
          repository: CaseyCZ/PiTV
          run-id: 38294055604

      - name: Restore and verify Soong bootstrap
        run: |
          test -f codec2-bootstrap-checkpoint/codec2-bootstrap-state.tar.zst
          tar --zstd -xf codec2-bootstrap-checkpoint/codec2-bootstrap-state.tar.zst -C "$TREE"
          test -x "$TREE/out/host/linux-x86/bin/soong_build"
          test -f "$TREE/out/soong/pitv-source-manifest.xml"
          cmp "$TREE/out/soong/pitv-source-manifest.xml" "${GITHUB_WORKSPACE}/pitv-source-manifest.xml"
          du -sh "$TREE/out"

      - name: Restore narrow bootstrap host tools
        run: |
          cd "$TREE"
          bootstrap_ninja="out/soong/bootstrap.ninja"
          test -s "$bootstrap_ninja"
          NINJA="$TREE/prebuilts/build-tools/linux-x86/bin/ninja"
          [ -x "$NINJA" ] || NINJA="$(command -v ninja)"

          # The narrow source fetch prepares lightweight wrappers in HOST_OUT.
          # Generated Soong edges reference the equivalent SOONG_HOST_OUT paths,
          # so promote the same wrappers there instead of expanding the graph.
          for wrapper in ndkstubgen aidl aidl_hash_gen; do
            host_tool="out/host/linux-x86/bin/$wrapper"
            soong_tool="out/soong/host/linux-x86/bin/$wrapper"
            test -x "$host_tool"
            mkdir -p "$(dirname "$soong_tool")"
            cp -f "$host_tool" "$soong_tool"
            chmod +x "$host_tool" "$soong_tool"
            echo "CODEC2_FFMPEG_HEVC_HOST_TOOL=$wrapper-wrapper"
          done

          for tool in sbox soong_zip zipsync merge_zips; do
            soong_tool="out/soong/host/linux-x86/bin/$tool"
            host_tool="out/host/linux-x86/bin/$tool"
            if [ ! -s "$soong_tool" ]; then
              "$NINJA" -f "$bootstrap_ninja" "$soong_tool"
            fi
            test -s "$soong_tool"
            mkdir -p "$(dirname "$host_tool")"
            cp -f "$soong_tool" "$host_tool"
            chmod +x "$soong_tool" "$host_tool"
            echo "CODEC2_FFMPEG_HEVC_HOST_TOOL=$tool"
          done

      - name: Prepare narrow FFmpeg HEVC tree
        run: |
          python3 scripts/prepare-narrow-ffmpeg-hevc.py \
            "$TREE" \
            "$SOURCES" \
            "$TREE/out/.module_paths/pitv-ffmpeg-hevc.Android.bp.list"

      - name: Generate narrow HEVC Soong graph
        run: |
          python3 scripts/probe-narrow-soong-graph.py \
            "$TREE" \
            "$TREE/out/.module_paths/pitv-ffmpeg-hevc.Android.bp.list"
          test -s "$TREE/out/soong/pitv-codec2.ninja"

      - name: Locate and dry-run FFmpeg HEVC service
        run: |
          cd "$TREE"
          NINJA="$TREE/prebuilts/build-tools/linux-x86/bin/ninja"
          [ -x "$NINJA" ] || NINJA="$(command -v ninja)"
          "$NINJA" -f out/soong/pitv-codec2.ninja -t targets all > /tmp/pitv-ffmpeg-hevc-targets.txt
          target_line="$(awk -v pat='(^|/)[^:]*android\.hardware\.media\.c2@1\.2-service-ffmpeg: ' '$0 ~ pat { print; exit }' /tmp/pitv-ffmpeg-hevc-targets.txt)"
          if [ -z "$target_line" ]; then
            echo "CODEC2_FFMPEG_HEVC_TARGET_CANDIDATES_BEGIN=1"
            grep -E 'ffmpeg|libavcodec|libffmpeg_utils' /tmp/pitv-ffmpeg-hevc-targets.txt | head -120 || true
            echo "CODEC2_FFMPEG_HEVC_TARGET_CANDIDATES_END=1"
            echo "narrow graph missing FFmpeg HEVC service target" >&2
            exit 13
          fi
          hevc_target="${target_line%%: *}"
          echo "CODEC2_FFMPEG_HEVC_TARGET=$hevc_target"
          set +e
          "$NINJA" -n -f out/soong/pitv-codec2.ninja -j2 "$hevc_target" \
            > /tmp/pitv-ffmpeg-hevc-dry-run.log 2>&1
          rc=$?
          set -e
          cat /tmp/pitv-ffmpeg-hevc-dry-run.log
          echo "CODEC2_FFMPEG_HEVC_DRY_RUN_RC=$rc"
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          echo "CODEC2_FFMPEG_HEVC_GRAPH_READY=1"

      - name: Upload HEVC graph diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitv-ffmpeg-hevc-graph-${{ github.sha }}
          path: |
            ${{ env.TREE }}/out/.module_paths/pitv-ffmpeg-hevc.Android.bp.list
            /tmp/pitv-ffmpeg-hevc-targets.txt
            /tmp/pitv-ffmpeg-hevc-dry-run.log
          if-no-files-found: warn
          retention-days: 3
