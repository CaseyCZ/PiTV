name: Build Waydroid RPi4 Hardware Decode Vendor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waydroid-rpi4-v4l2-build
  cancel-in-progress: false

jobs:
  build:
    # A full LineageOS/Waydroid checkout and build is too large for the normal
    # GitHub-hosted runner disk. Register a Linux x86-64 self-hosted runner with
    # the 'android-build' label and >= 300 GB free workspace.
    runs-on: [self-hosted, linux, x64, android-build]
    timeout-minutes: 720

    steps:
      - uses: actions/checkout@v4

      - name: Build RPi4 hardware-decode Waydroid vendor
        shell: bash
        env:
          PITV_ANDROID_JOBS: ${{ vars.PITV_ANDROID_JOBS || '8' }}
        run: |
          set -euo pipefail
          bash scripts/build-waydroid-rpi4-v4l2.sh "${RUNNER_WORKSPACE}/pitv-waydroid-lineage20"

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/waydroid-rpi4-v4l2/vendor.img.xz
          test -s dist/waydroid-rpi4-v4l2/build-info.env
          test -s dist/waydroid-rpi4-v4l2/SHA256SUMS
          grep -q '^ANDROID_RELEASE=13$' dist/waydroid-rpi4-v4l2/build-info.env
          grep -q '^HW_DECODER_AVC=c2.v4l2.avc.decoder            cd dist/waydroid-rpi4-v4l2
            sha256sum -c SHA256SUMS
          )

      - name: Upload RPi4 hardware-decode vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: pitv-waydroid-rpi4-avc-hevc-lineage20
          path: |
            dist/waydroid-rpi4-v4l2/vendor.img.xz
            dist/waydroid-rpi4-v4l2/build-info.env
            dist/waydroid-rpi4-v4l2/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
 dist/waydroid-rpi4-v4l2/build-info.env
          grep -q '^HW_DECODER_HEVC=c2.ffmpeg.hevc.decoder            cd dist/waydroid-rpi4-v4l2
            sha256sum -c SHA256SUMS
          )

      - name: Upload RPi4 hardware-decode vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: pitv-waydroid-rpi4-avc-hevc-lineage20
          path: |
            dist/waydroid-rpi4-v4l2/vendor.img.xz
            dist/waydroid-rpi4-v4l2/build-info.env
            dist/waydroid-rpi4-v4l2/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
 dist/waydroid-rpi4-v4l2/build-info.env
          grep -q '^HEVC_V4L2_REQUEST=compiled            cd dist/waydroid-rpi4-v4l2
            sha256sum -c SHA256SUMS
          )

      - name: Upload RPi4 hardware-decode vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: pitv-waydroid-rpi4-avc-hevc-lineage20
          path: |
            dist/waydroid-rpi4-v4l2/vendor.img.xz
            dist/waydroid-rpi4-v4l2/build-info.env
            dist/waydroid-rpi4-v4l2/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
 dist/waydroid-rpi4-v4l2/build-info.env
          (
            cd dist/waydroid-rpi4-v4l2
            sha256sum -c SHA256SUMS
          )

      - name: Upload RPi4 hardware-decode vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: pitv-waydroid-rpi4-avc-hevc-lineage20
          path: |
            dist/waydroid-rpi4-v4l2/vendor.img.xz
            dist/waydroid-rpi4-v4l2/build-info.env
            dist/waydroid-rpi4-v4l2/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
