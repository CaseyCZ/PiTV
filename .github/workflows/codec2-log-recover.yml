name: Codec2 Log Recovery

on:
  push:
    branches: [experiment/rpi4-codec2-narrow-soong-graph]
    paths:
      - '.github/workflows/codec2-log-recover.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover-log:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download failed narrow job log
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_JOB_ID: '114157626746'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" \
            -o "artifacts/job-${SOURCE_JOB_ID}.log"
          test -s "artifacts/job-${SOURCE_JOB_ID}.log"
          echo '=== FIRST LIKELY FAILURE LINES ==='
          grep -nE -m 80 'FAILED:|ninja: error:|(^|[^[:alpha:]])error:|CODEC2_.*(FAIL|ERROR|RC=[1-9])|missing and no known rule|missing dependencies' \
            "artifacts/job-${SOURCE_JOB_ID}.log" || true
          echo '=== LOG TAIL ==='
          tail -n 220 "artifacts/job-${SOURCE_JOB_ID}.log"

      - name: Upload recovered log
        uses: actions/upload-artifact@v4
        with:
          name: codec2-failed-job-114157626746
          path: artifacts/job-114157626746.log
          if-no-files-found: error
          retention-days: 2
