name: PiTV Alpha Release

on:
  workflow_dispatch:
  push:
    branches: [Master]
    paths:
      - ".github/workflows/release.yml"
      - "tools/windows/**"
      - "release-notes/alpha.md"

permissions:
  contents: write

concurrency:
  group: pitv-alpha-release
  cancel-in-progress: true

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Verify live Ubuntu catalog
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -SelfTestCatalog

      - name: Verify current Raspberry Pi Imager CLI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "rpi-imager.exe"
          Invoke-WebRequest -UseBasicParsing -Uri "https://downloads.raspberrypi.com/imager/imager_latest.exe" -OutFile $installer
          $p = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Raspberry Pi Imager installer failed with exit code $($p.ExitCode)" }
          $candidates = @(
            (Join-Path $env:ProgramFiles "Raspberry Pi Ltd\Imager\rpi-imager.exe"),
            (Join-Path $env:ProgramFiles "Raspberry Pi Imager\rpi-imager.exe")
          )
          $imager = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $imager) { throw "Installed rpi-imager.exe was not found." }
          $help = (& $imager --cli --help 2>&1 | Out-String)
          foreach ($required in @("--cloudinit-userdata","--cloudinit-networkconfig","--sha256")) {
            if ($help -notmatch [regex]::Escape($required)) { throw "Current Raspberry Pi Imager CLI is missing $required" }
          }
          $probe = (& $imager --cli --cloudinit-userdata (Join-Path $env:RUNNER_TEMP "missing-user-data") --cloudinit-networkconfig (Join-Path $env:RUNNER_TEMP "missing-network") --sha256 ("0" * 64) (Join-Path $env:RUNNER_TEMP "missing.img") "\\.\PhysicalDrive999" 2>&1 | Out-String)
          if ($probe -match "(?i)unknown option|unknown argument") { throw "PiTV CLI arguments are incompatible: $probe" }

  release:
    needs: validate-windows
    runs-on: ubuntu-24.04    steps:
      - uses: actions/checkout@v4

      - name: Release checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile pitv/*.py
          bash -n install.sh
          bash -n uninstall.sh
          bash -n scripts/install-waydroid.sh
          bash -n tools/pitv-flasher.sh
          bash tools/pitv-flasher.sh --dry-run
          pwsh -NoProfile -File tools/pitv-flasher.ps1 -DryRun
          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-SD-Installer.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'
          (
            cd vendor/waydroid/noble
            sha256sum -c SHA256SUMS
            for pkg in *.deb; do dpkg-deb --info "$pkg" >/dev/null; done
          )

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p "dist/PiTV-SD-Installer-Windows"

          cp tools/windows/Start-PiTV-SD-Installer.cmd "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-SD-Installer.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/README.md "dist/PiTV-SD-Installer-Windows/README.md"
          cp LICENSE "dist/PiTV-SD-Installer-Windows/LICENSE"

          (
            cd dist
            zip -9 -r "PiTV-SD-Installer-Windows.zip" "PiTV-SD-Installer-Windows" >/dev/null
          )

          ls -lh dist/PiTV-SD-Installer-Windows.zip

      - name: Publish rolling Alpha release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f alpha "$GITHUB_SHA"
          git push -f origin refs/tags/alpha

          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha \
              --title "PiTV Alpha" \
              --notes-file release-notes/alpha.md \
              --prerelease
          else
            gh release create alpha \
              --target "$GITHUB_SHA" \
              --title "PiTV Alpha" \
              --notes-file release-notes/alpha.md \
              --prerelease
          fi

          # Keep exactly one custom downloadable asset in the rolling Alpha.
          while IFS= read -r asset; do
            if [ -n "$asset" ] && [ "$asset" != "PiTV-SD-Installer-Windows.zip" ]; then
              gh release delete-asset alpha "$asset" -y
            fi
          done < <(gh release view alpha --json assets --jq '.assets[].name')

          gh release upload alpha dist/PiTV-SD-Installer-Windows.zip --clobber

          # Remove the temporary versioned releases created during early testing.
          for old in v1.3.0 v1.3.1 v1.3.2 v1.3.3; do
            if gh release view "$old" >/dev/null 2>&1; then
              gh release delete "$old" --cleanup-tag -y
            fi
          done

          gh release view alpha --json url,tagName,name,isDraft,isPrerelease,assets
