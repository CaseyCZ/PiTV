name: PiTV Alpha Release

on:
  push:
    branches: [Master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pitv-alpha-pipeline
  cancel-in-progress: true

jobs:
  pitv-check:
    name: PiTV Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m py_compile \
            pitv/pitv.py \
            pitv/apk_backend.py \
            pitv/store_backend.py \
            pitv/update_backend.py \
            system/pitv-helper \
            system/pitv-self-update

      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n system/pitv-session
          bash -n system/pitv-waydroid-launch
          bash -n scripts/install-waydroid.sh
          bash -n tools/pitv-flasher.sh

      - name: Flasher dry run
        shell: bash
        run: |
          bash tools/pitv-flasher.sh --dry-run
          pwsh -NoProfile -File tools/pitv-flasher.ps1 -DryRun

      - name: Waydroid fallback snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/waydroid/noble
          test -s packages.env
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          for pkg in *.deb; do
            dpkg-deb --info "$pkg" >/dev/null
          done

      - name: Store JSON
        run: |
          python3 - <<'PY'
          import json
          for path in (
              "store/catalog.json",
              "store/server_catalog.json",
              "config/config.json",
          ):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)
          PY

      - name: Runtime render with Ubuntu Pygame
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pygame
          PYTHONPATH=pitv SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            python3 - <<'PY'
          import pygame
          from pitv import PiTV, VERSION

          app = PiTV()
          pages = (
              "home", "settings", "appearance", "screensaver", "network",
              "audio", "cec", "apps", "store", "server_store", "android",
              "updates", "system", "power", "about",
          )
          for theme in ("apple_dark", "apple_light"):
              app.cfg["theme"] = theme
              for page in pages:
                  app.page = page
                  app.draw()
                  print("render OK", theme, page)

          assert len(app.SETTINGS) == 12
          pygame.quit()
          print("PiTV runtime render OK", VERSION)
          PY

  windows-check:
    name: PiTV SD Installer Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer and engine
        shell: powershell
        run: |
          foreach ($file in @(
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1",
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              exit 1
            }
            Write-Host ("PowerShell syntax OK: " + $file)
          }

      - name: Verify live Ubuntu catalog
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -SelfTestCatalog

      - name: Compile native raw disk helper
        shell: powershell
        run: |
          Add-Type -Path "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs"
          if (-not ("PiTVNativeDisk" -as [type])) {
            throw "PiTVNativeDisk.cs did not compile."
          }
          if (-not ([PiTVNativeDisk].GetMethod("LockAndDismount"))) {
            throw "PiTVNativeDisk LockAndDismount helper is missing."
          }
          Write-Host "PiTVNativeDisk C# helper compiles"

      - name: Build lightweight PiTV XZ decoder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:RUNNER_TEMP "pitv-xz-build"

          cmake -S "$env:GITHUB_WORKSPACE\tools\windows\native" -B $build -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure for PiTV-XZ failed." }

          cmake --build $build --config Release --target PiTV-XZ
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ build failed." }

          $exe = Get-ChildItem $build -Recurse -Filter "PiTV-XZ.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "PiTV-XZ.exe was not produced." }

          $bin = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"
          Copy-Item $exe.FullName $bin -Force
          Write-Host ("Built " + $bin + " (" + $exe.Length + " bytes)")

      - name: Verify PiTV XZ extraction
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "pitv-xz-release-test"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $src = Join-Path $dir "sample.img"
          $xz = Join-Path $dir "sample.img.xz"
          $out = Join-Path $dir "expanded.img"
          $decoder = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"

          python -c "import lzma, pathlib, sys; data=bytes(range(256))*16384; pathlib.Path(sys.argv[1]).write_bytes(data); pathlib.Path(sys.argv[2]).write_bytes(lzma.compress(data, format=lzma.FORMAT_XZ))" "$src" "$xz"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create XZ test fixture." }

          & $decoder $xz $out
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ failed to expand the test image." }

          if ((Get-FileHash -Algorithm SHA256 $src).Hash -ne (Get-FileHash -Algorithm SHA256 $out).Hash) {
            throw "PiTV-XZ output is not byte-identical."
          }
          Write-Host "PiTV-XZ raw XZ extraction OK"

      - name: Verify PiTV writer contract
        shell: powershell
        run: |
          $installer = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -Raw
          $engine = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1" -Raw
          $native = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs" -Raw

          if ($installer -match "Ensure-Imager|Assert-ImagerCliContract|Invoke-ImagerWrite") {
            throw "Legacy Raspberry Pi Imager dependency is still present."
          }

          foreach ($required in @(
            "Get-PiTVOnlineImageFile",
            "Prepare-PiTVRawImage",
            "Write-PiTVRawImageToDisk",
            "Install-PiTVCloudInitToBootPartition"
          )) {
            if ($installer -notmatch [regex]::Escape($required)) {
              throw "Installer write flow is missing $required"
            }
          }

          foreach ($required in @(
            "PiTVNativeDisk",
            "PhysicalDrive",
            "CACHE HIT",
            "image_download_sha256",
            "Get-PiTVDeviceSha256",
            "PiTV-XZ.exe",
            "LockAndDismount"
          )) {
            if ($engine -notmatch [regex]::Escape($required)) {
              throw "Image engine is missing contract item $required"
            }
          }

          foreach ($required in @(
            "FSCTL_LOCK_VOLUME",
            "FSCTL_DISMOUNT_VOLUME",
            "LockAndDismount"
          )) {
            if ($native -notmatch [regex]::Escape($required)) {
              throw "Native disk helper is missing $required"
            }
          }

          Write-Host "PiTV raw writer/cache/volume-lock contract OK"

      - name: Upload PiTV XZ decoder
        uses: actions/upload-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows/PiTV-XZ.exe
          if-no-files-found: error
          retention-days: 1

      - name: Verify launcher target
        shell: powershell
        run: |
          $launcher = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\Start-PiTV-SD-Installer.cmd" -Raw
          if ($launcher -notmatch "PiTV-SD-Installer\.ps1") {
            throw "Launcher does not reference PiTV-SD-Installer.ps1"
          }
          Write-Host "Launcher target OK"

  release:
    name: Publish Alpha
    needs:
      - pitv-check
      - windows-check
    if: ${{ needs.pitv-check.result == 'success' && needs.windows-check.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PiTV XZ decoder
        uses: actions/download-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows

      - name: Release checks
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/windows/PiTV-XZ.exe
          test -s tools/windows/THIRD-PARTY-NOTICES.txt

          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-SD-Installer.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'
          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-ImageEngine.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p "dist/PiTV-SD-Installer-Windows"
          cp tools/windows/Start-PiTV-SD-Installer.cmd "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-SD-Installer.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-ImageEngine.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTVNativeDisk.cs "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-XZ.exe "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/THIRD-PARTY-NOTICES.txt "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/README.md "dist/PiTV-SD-Installer-Windows/README.md"
          cp LICENSE "dist/PiTV-SD-Installer-Windows/LICENSE"
          (
            cd dist
            zip -9 -r "PiTV-SD-Installer-Windows.zip" "PiTV-SD-Installer-Windows" >/dev/null
          )
          test -s dist/PiTV-SD-Installer-Windows.zip
          ls -lh dist/PiTV-SD-Installer-Windows.zip

      - name: Publish rolling Alpha release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f alpha "$GITHUB_SHA"
          git push -f origin refs/tags/alpha

          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          else
            gh release create alpha --target "$GITHUB_SHA" --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          fi

          while IFS= read -r asset; do
            if [ -n "$asset" ] && [ "$asset" != "PiTV-SD-Installer-Windows.zip" ]; then
              gh release delete-asset alpha "$asset" -y
            fi
          done < <(gh release view alpha --json assets --jq '.assets[].name')

          gh release upload alpha dist/PiTV-SD-Installer-Windows.zip --clobber
          gh release view alpha --json url,tagName,name,isDraft,isPrerelease,assets
