          grep -q '<name>Stremio</name>' system/labwc/rc.xml
          grep -q '<name>Android</name>' system/labwc/rc.xml
          grep -q 'GoToDesktop" to="PiTV"' system/labwc/rc.xml
          grep -q '"127".*KEYCODE_MEDIA_PAUSE' system/pitv-helper
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          ET.parse("system/labwc/rc.xml")
          print("labwc rc.xml OK")
          PYXML
          grep -q 'flatpak-uninstall' system/pitv-helper
          grep -q 'apt-remove' system/pitv-helper
          grep -q 'pitv-session-run' install.sh
          grep -q 'DPkg::Lock::Timeout=' install.sh
          grep -q -- '--no-update universe' install.sh
          grep -q 'DPkg::Lock::Timeout=600' system/pitv-helper
          grep -q 'APT_LOCK_TIMEOUT' system/pitv-self-update
          grep -q 'stdout=subprocess.PIPE' system/pitv-self-update
          bash -n scripts/install-waydroid.sh
          grep -q 'getconf PAGESIZE' scripts/install-waydroid.sh
          grep -q '/proc/pressure' scripts/install-waydroid.sh
          bash -n tools/pitv-flasher.sh

      - name: Flasher dry run
        shell: bash
        run: |
          bash tools/pitv-flasher.sh --dry-run
          pwsh -NoProfile -File tools/pitv-flasher.ps1 -DryRun

      - name: Waydroid fallback snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/waydroid/noble
          test -s packages.env
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          for pkg in *.deb; do
            dpkg-deb --info "$pkg" >/dev/null
          done

      - name: Store JSON
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          for path in (
              "store/catalog.json",
              "store/server_catalog.json",
              "config/config.json",
          ):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)

          root = ET.parse("system/kodi/appliance.xml").getroot()
          values = {}
          for node in root.iter("setting"):
              default = node.find("default")
              if node.get("id") and default is not None:
                  values[node.get("id")] = (default.text or "").strip().lower()
          assert values["videoplayer.useprimedecoder"] == "true"
          assert values["videoplayer.useprimedecoderforhw"] == "true"
          print("Kodi DRM PRIME appliance defaults OK")
          PY

      - name: Runtime render with Ubuntu Pygame
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pygame
          PYTHONPATH=pitv SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            python3 - <<'PY'
          import time
          import pygame
          import pitv as pitv_module
          from queue import Queue
          from pitv import CECReader, LEGACY_ANDROID_PACKAGES, PiTV, VERSION

          assert VERSION == "1.5.0"

          # Regression: cec-ctl prints USER_CONTROL_PRESSED and ui-cmd on
          # separate lines. OK/Back must survive both decoded and raw formats.
          q = Queue()
          cec = CECReader(q)
          cec._handle_monitor_line("USER_CONTROL_PRESSED (0x44):\n")
          cec._handle_monitor_line("  ui-cmd: select (0x00)\n")
          assert q.get_nowait() == pygame.K_RETURN
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE

          # Back long-hold is a separate physical gesture from the raw-format
          # parser test above. Clear the prior gesture state first; otherwise
          # the deliberate 800 ms hold-continuity logic correctly treats this
          # next Back as the same held button and suppresses it.
          cec.clear_key_state()
          # The first Back is delivered once. Older TVs can repeat
          # press/release pairs while the button is held, so gesture duration
          # must survive a short release gap.
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          assert cec.gesture_key == pygame.K_ESCAPE
          cec.gesture_started_at = time.monotonic() - 3.1
          cec.gesture_last_seen_at = time.monotonic()
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.empty()
          assert cec.held_for(pygame.K_ESCAPE) >= 3.0
          cec.clear_key_state()
          assert cec.held_for(pygame.K_ESCAPE) == 0.0

          assert "com.stremio.one" in LEGACY_ANDROID_PACKAGES
          assert "com.plexapp.android" in LEGACY_ANDROID_PACKAGES

          # PiTV 1.4.10 regression contract: returning from an app must keep
          # one healthy CEC reader alive instead of replacing the kernel
          # monitor. The reader itself owns hotplug/reconnect recovery.
          class HealthyCEC:
              def __init__(self):
                  self.clears = 0
              def is_alive(self):
                  return True
              def is_ready(self):
                  return True
              def clear_key_state(self):
                  self.clears += 1

          probe = PiTV.__new__(PiTV)
          probe.cfg = {"cec_enabled": True}
          probe._cec_refreshing = False
          probe.cec_queue = Queue()
          healthy = HealthyCEC()
          probe.cec = healthy
          old_available = pitv_module.cec_available
          old_active_source = pitv_module.cec_active_source
          pitv_module.cec_available = lambda: True
          pitv_module.cec_active_source = lambda: (True, "test")
          try:
              probe._refresh_cec_after_return()
              deadline = time.monotonic() + 2.0
              while probe._cec_refreshing and time.monotonic() < deadline:
                  time.sleep(0.01)
              assert probe.cec is healthy
              assert healthy.clears == 1
              assert not probe._cec_refreshing
          finally:
              pitv_module.cec_available = old_available
              pitv_module.cec_active_source = old_active_source

          # Sencor/other TVs may expose the Home key as any CEC menu command.
          for raw_home in ("0a", "0c", "11"):
              cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
              cec._handle_monitor_line(f"> 01:44:{raw_home}\n")
              assert q.get_nowait() == pygame.K_HOME

          app = PiTV()

          # TV remote contract: Home remains optional multitasking on TVs that
          # have it, but 3-second Back is the universal EXIT for old remotes.
          demo_app = {"name": "Demo", "command": "demo-player"}
          demo_key = app._task_key(demo_app, "linux")
          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app.handle_key(pygame.K_HOME)
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key in app.background_tasks
          app.background_tasks.clear()

          # Every app exit converges on the same visible PiTV workspace.
          app.cfg["cec_enabled"] = False
          app.page = "settings"
          app._return_to_launcher("test", refresh_cec=False)
          assert app.page == "home"
          assert not app.sidebar_focus

          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app._keyboard_back_down_at = time.monotonic() - 3.1
          app._check_global_back_hold()
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key not in app.background_tasks

          # Regression: a legacy Android Stremio APK must stay removable and
          # must not be mistaken for today's native Linux Stremio Flatpak just
          # because both can share the same visible app name.
          legacy_stremio = {
              "name": "Stremio",
              "kind": "apk",
              "package": "com.stremio.legacy",
              "apk_path": "/home/pitv/PiTV/APKs/stremio-old.apk",
          }
          assert app.app_can_uninstall(legacy_stremio)
          assert app._store_item_for_app(legacy_stremio) is None
          native_stremio = {
              "name": "Stremio",
              "kind": "linux",
              "command": "flatpak run com.stremio.Stremio",
          }
          native_item = app._store_item_for_app(native_stremio)
          assert native_item
          assert native_item["installer"]["type"] == "flatpak"
          assert app.app_can_uninstall(native_stremio)

          # Built-in media runtimes have stable multitasking slots.
          kodi_app = {"name":"Kodi", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-launch"}
          plex_app = {"name":"Plex Player", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-addon run script.plexmod"}
          android_app = {"name":"SmartTube", "kind":"apk",
                         "package":"com.teamsmart.videomanager.tv"}
          assert app._task_key(kodi_app, "linux") == "kodi"
          assert app._task_key(plex_app, "linux") == "kodi"
          assert app._task_key(native_stremio, "linux") == "stremio"
          assert app._task_key(android_app, "apk") == (
              "android:com.teamsmart.videomanager.tv"
          )
          second_android = {
              "name": "Second APK", "kind": "apk",
              "package": "com.example.second",
          }
          assert app._task_key(second_android, "apk") != app._task_key(
              android_app, "apk"
          )
          assert app._workspace_for_app(kodi_app, "linux") == "Kodi"
          assert app._workspace_for_app(native_stremio, "linux") == "Stremio"
          assert app._workspace_for_app(android_app, "apk") == "Android"

          # Settings are OK-only: Right must not trigger a hidden
          # action. OK opens the visible list, then Up/Down + OK chooses.
          app.page = "appearance"
          app.sidebar_focus = False
          app.sub_selected = 2
          app.cfg["tile_scale"] = 1.15
          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.15) < 0.001
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Velikost dlaždic"
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.30) < 0.001

          # Theme selector exposes both values and can be cancelled with Back.
          app.sub_selected = 0
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # Regression: if a key relayed with wtype comes back into PiTV,
          # the external app no longer owns focus. Recover without wlrctl.
          app.external_kind = "linux"
          app.external_proc = None
          app._mark_relay_echo(pygame.K_LEFT)
          assert app._consume_relay_echo(pygame.K_LEFT)
          app._recover_external_focus()
          assert app.external_kind is None

          # Screensaver values use the same visible list model.
          app.page = "screensaver"
          app.sub_selected = 1
          app.cfg["screensaver_after_min"] = 1
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Spustit po"
          assert app.choice_options[app.choice_selected][1] == 1
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert app.cfg["screensaver_after_min"] == 2

          # PiTV 1.4.30: every section opened from Settings uses the
          # same three-column Settings list model; Updates exposes one
          # recommended action instead of a 10-card action grid.
          app.settings_context = True
          for detail_page in (
              "screensaver", "network", "audio", "cec", "apps",
              "server_store", "android", "updates", "system", "power", "about",
          ):
              app.page = detail_page
              app.draw()
              print("settings detail OK", detail_page)

          update_actions = app.update_items()
          assert len(update_actions) == 4
          assert update_actions[0][0] == "Aktualizovat vše"
          assert update_actions[1][0] == "Zkontrolovat aktualizace"
          assert update_actions[2][0] == "Pokročilé možnosti"
          assert app.system_items()[-1][0] == "Otevřít Aktualizace"
          assert hasattr(app, "_installed_store_flatpak_ids")
          assert hasattr(app, "_android_runtime_ready_file")
          assert hasattr(app, "android_key_queue")
          app.set_operation("Globální test", 42)
          app.page = "home"
          app.draw()
          assert app.operation_text == "Globální test"
          assert app.operation_progress == 42

          # PiTV 1.4.31 HDMI recovery contract. Dummy rendering must not try
          # to touch a real KMS/Wayland output, but the geometry helpers must
          # be present and safe.
          assert isinstance(app._desktop_size(), tuple)
          assert len(app._desktop_size()) == 2
          assert app._repair_fullscreen(force=True) is False
          assert hasattr(app, "android_pending_proc")
          assert app._android_ready_file().name == "pitv-waydroid-app-ready"

          # Application management is a fixed Settings menu. No Right
          # action is allowed; visibility and uninstall each open a list.
          app.apps = [dict(native_stremio), dict(legacy_stremio)]
          app.page = "apps"
          app.settings_context = True
          app.apps_selected = 1
          app_menu = app.app_items()
          assert [x["kind"] for x in app_menu] == [
              "store", "visibility", "uninstall", "refresh"
          ]
          assert app_menu[1]["name"] == "Zobrazení aplikací"
          assert app_menu[2]["name"] == "Odinstalovat aplikace"

          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active

          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Zobrazení aplikací"
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title in ("Stremio",)
          assert [x[1] for x in app.choice_options] == [True, False]
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          app.apps_selected = 2
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Odinstalovat aplikace"
          assert len(app.choice_options) >= 1
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # CEC and other configuration values must use a visible choice list,
          # not blind left/right toggling.
          app.page = "cec"
          app.open_cec_choice(1)
          assert app.choice_active
          assert app.choice_title == "Probudit TV při startu"
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active
          app.settings_context = False

          pages = (
              "home", "settings", "appearance", "screensaver", "network",
              "audio", "cec", "apps", "store", "server_store", "android",
              "updates", "system", "power", "about",
          )
          for theme in ("apple_dark", "apple_light"):
              app.cfg["theme"] = theme
              for page in pages:
                  app.page = page
                  app.draw()
                  print("render OK", theme, page)

          assert len(app.SETTINGS) == 12
          pygame.quit()
          print("PiTV runtime render OK", VERSION)
          PY

  windows-check:
    name: PiTV SD Installer Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer and engine
        shell: powershell
        run: |
          foreach ($file in @(
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1",
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              exit 1
            }
            Write-Host ("PowerShell syntax OK: " + $file)
          }

      - name: Verify live Ubuntu catalog
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -SelfTestCatalog

      - name: Compile native raw disk helper
        shell: powershell
        run: |
          Add-Type -Path "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs"
          if (-not ("PiTVNativeDisk" -as [type])) {
            throw "PiTVNativeDisk.cs did not compile."
          }
          if (-not ([PiTVNativeDisk].GetMethod("LockVolume"))) {
            throw "PiTVNativeDisk LockVolume helper is missing."
          }
          Write-Host "PiTVNativeDisk C# helper compiles"

      - name: Build lightweight PiTV XZ decoder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:RUNNER_TEMP "pitv-xz-build"

          cmake -S "$env:GITHUB_WORKSPACE\tools\windows\native" -B $build -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure for PiTV-XZ failed." }

          cmake --build $build --config Release --target PiTV-XZ
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ build failed." }

          $exe = Get-ChildItem $build -Recurse -Filter "PiTV-XZ.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "PiTV-XZ.exe was not produced." }

          $bin = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"
          Copy-Item $exe.FullName $bin -Force
          Write-Host ("Built " + $bin + " (" + $exe.Length + " bytes)")

      - name: Verify PiTV XZ extraction
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "pitv-xz-release-test"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $src = Join-Path $dir "sample.img"
          $xz = Join-Path $dir "sample.img.xz"
          $out = Join-Path $dir "expanded.img"
          $decoder = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"

          python -c "import lzma, pathlib, sys; data=bytes(range(256))*16384; pathlib.Path(sys.argv[1]).write_bytes(data); pathlib.Path(sys.argv[2]).write_bytes(lzma.compress(data, format=lzma.FORMAT_XZ))" "$src" "$xz"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create XZ test fixture." }

          & $decoder $xz $out
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ failed to expand the test image." }

          if ((Get-FileHash -Algorithm SHA256 $src).Hash -ne (Get-FileHash -Algorithm SHA256 $out).Hash) {
            throw "PiTV-XZ output is not byte-identical."
          }
          Write-Host "PiTV-XZ raw XZ extraction OK"

      - name: Verify PiTV writer contract
        shell: powershell
        run: |
          $installer = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -Raw
          $engine = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1" -Raw
          $native = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs" -Raw

          if ($installer -match "Ensure-Imager|Assert-ImagerCliContract|Invoke-ImagerWrite") {
            throw "Legacy Raspberry Pi Imager dependency is still present."
          }

          foreach ($required in @(
            "Get-PiTVOnlineImageFile",
            "Prepare-PiTVRawImage",
            "Write-PiTVRawImageToDisk",
            "Install-PiTVCloudInitToBootPartition"
          )) {
            if ($installer -notmatch [regex]::Escape($required)) {
              throw "Installer write flow is missing $required"
            }
          }

          foreach ($required in @(
            "PiTVNativeDisk",
            "PhysicalDrive",
            "CACHE HIT",
            "image_download_sha256",
            "Get-PiTVDeviceSha256",
            "Wait-PiTVTargetDiskReadyAfterRawWrite",
            "DiskPartRescan",
            "Write-PiTVBytesDurable",
            "FINALIZE RETRY",
            "PiTV-XZ.exe",
            "LockVolume"
          )) {
            if ($engine -notmatch [regex]::Escape($required)) {
              throw "Image engine is missing contract item $required"
            }
          }

          foreach ($required in @(
            "FSCTL_LOCK_VOLUME",
            "FSCTL_DISMOUNT_VOLUME",
            "LockAndDismount",
            "FlushFileBuffers",
            "FILE_FLAG_WRITE_THROUGH"
          )) {
            if ($native -notmatch [regex]::Escape($required)) {
              throw "Native disk helper is missing $required"
            }
          }

          Write-Host "PiTV raw writer/cache/volume-lock contract OK"

      - name: Upload PiTV XZ decoder
        uses: actions/upload-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows/PiTV-XZ.exe
          if-no-files-found: error
          retention-days: 1

      - name: Verify launcher target
        shell: powershell
        run: |
          $launcher = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\Start-PiTV-SD-Installer.cmd" -Raw
          if ($launcher -notmatch "PiTV-SD-Installer\.ps1") {
            throw "Launcher does not reference PiTV-SD-Installer.ps1"
          }
          Write-Host "Launcher target OK"

  release:
    name: Publish Alpha
    needs:
      - pitv-check
      - windows-check
    if: ${{ needs.pitv-check.result == 'success' && needs.windows-check.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PiTV XZ decoder
        uses: actions/download-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows

      - name: Release checks
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/windows/PiTV-XZ.exe
          test -s tools/windows/THIRD-PARTY-NOTICES.txt

          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-SD-Installer.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'
          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-ImageEngine.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p "dist/PiTV-SD-Installer-Windows"
          cp tools/windows/Start-PiTV-SD-Installer.cmd "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-SD-Installer.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-ImageEngine.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTVNativeDisk.cs "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-XZ.exe "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/THIRD-PARTY-NOTICES.txt "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/README.md "dist/PiTV-SD-Installer-Windows/README.md"
          cp LICENSE "dist/PiTV-SD-Installer-Windows/LICENSE"
          (
            cd dist
            zip -9 -r "PiTV-SD-Installer-Windows.zip" "PiTV-SD-Installer-Windows" >/dev/null
          )
          test -s dist/PiTV-SD-Installer-Windows.zip
          ls -lh dist/PiTV-SD-Installer-Windows.zip

      - name: Publish rolling Alpha release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f alpha "$GITHUB_SHA"
          git push -f origin refs/tags/alpha

          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          else
            gh release create alpha --target "$GITHUB_SHA" --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          fi

          while IFS= read -r asset; do
            if [ -n "$asset" ] && [ "$asset" != "PiTV-SD-Installer-Windows.zip" ]; then
              gh release delete-asset alpha "$asset" -y
            fi
          done < <(gh release view alpha --json assets --jq '.assets[].name')

          gh release upload alpha dist/PiTV-SD-Installer-Windows.zip --clobber
          gh release view alpha --json url,tagName,name,isDraft,isPrerelease,assets
 system/pitv-android-warm.service
          ! grep -q '^Requires=pitv-shell.service          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          ! grep -q 'start_android_warmer' system/pitv-launcher-run
          ! grep -q 'agetty --autologin' install.sh
          ! grep -q 'system/bash_profile /home/pitv/.bash_profile' install.sh
          grep -q 'systemctl set-default pitv.target' install.sh
          grep -q 'systemctl mask getty@tty1.service' install.sh
          ! grep -q '"waydroid", "shell", "input"' pitv/pitv.py
          grep -q 'waydroid show-full-ui' system/pitv-waydroid-launch
          test "$(grep -c 'waydroid show-full-ui' system/pitv-waydroid-launch)" -eq 1
          grep -q 'pitv-waydroid-app-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-runtime-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          grep -q 'waydroid-app-visible' system/pitv-waydroid-launch
          grep -q 'waydroid-app-visible' system/pitv-helper
          grep -q 'waydroid-app-stop' system/pitv-helper
          grep -q 'waydroid-app-stop' pitv/pitv.py
          ! grep -q '\["waydroid", "session", "stop"\]' pitv/pitv.py
          grep -q 'android_key_queue' pitv/pitv.py
          grep -q 'One global activity banner' pitv/pitv.py
          grep -q 'persist.waydroid.multi_windows false' system/pitv-waydroid-launch
          grep -q 'exec cage -d' system/pitv-waydroid-launch
          grep -q 'labwc cage wtype' install.sh
          grep -q 'pitv-launcher-run' install.sh
          grep -q 'pitv-launcher.service' install.sh
          grep -q 'ExecStart=/usr/bin/systemctl restart pitv-shell.service' install.sh
          grep -q 'legacy-android-media-v2.done' pitv/pitv.py
          grep -q 'DPkg::Lock::Timeout' scripts/install-waydroid.sh
          grep -q 'identifier="wlroots"' system/labwc/rc.xml
          grep -q 'title="PiTV \*"' system/labwc/rc.xml
          grep -q 'SendToDesktop" to="Android" follow="no"' system/labwc/rc.xml
          grep -q '<name>PiTV</name>' system/labwc/rc.xml
          grep -q '<name>Kodi</name>' system/labwc/rc.xml
          grep -q '<name>Stremio</name>' system/labwc/rc.xml
          grep -q '<name>Android</name>' system/labwc/rc.xml
          grep -q 'GoToDesktop" to="PiTV"' system/labwc/rc.xml
          grep -q '"127".*KEYCODE_MEDIA_PAUSE' system/pitv-helper
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          ET.parse("system/labwc/rc.xml")
          print("labwc rc.xml OK")
          PYXML
          grep -q 'flatpak-uninstall' system/pitv-helper
          grep -q 'apt-remove' system/pitv-helper
          grep -q 'pitv-session-run' install.sh
          grep -q 'DPkg::Lock::Timeout=' install.sh
          grep -q -- '--no-update universe' install.sh
          grep -q 'DPkg::Lock::Timeout=600' system/pitv-helper
          grep -q 'APT_LOCK_TIMEOUT' system/pitv-self-update
          grep -q 'stdout=subprocess.PIPE' system/pitv-self-update
          bash -n scripts/install-waydroid.sh
          grep -q 'getconf PAGESIZE' scripts/install-waydroid.sh
          grep -q '/proc/pressure' scripts/install-waydroid.sh
          bash -n tools/pitv-flasher.sh

      - name: Flasher dry run
        shell: bash
        run: |
          bash tools/pitv-flasher.sh --dry-run
          pwsh -NoProfile -File tools/pitv-flasher.ps1 -DryRun

      - name: Waydroid fallback snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/waydroid/noble
          test -s packages.env
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          for pkg in *.deb; do
            dpkg-deb --info "$pkg" >/dev/null
          done

      - name: Store JSON
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          for path in (
              "store/catalog.json",
              "store/server_catalog.json",
              "config/config.json",
          ):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)

          root = ET.parse("system/kodi/appliance.xml").getroot()
          values = {}
          for node in root.iter("setting"):
              default = node.find("default")
              if node.get("id") and default is not None:
                  values[node.get("id")] = (default.text or "").strip().lower()
          assert values["videoplayer.useprimedecoder"] == "true"
          assert values["videoplayer.useprimedecoderforhw"] == "true"
          print("Kodi DRM PRIME appliance defaults OK")
          PY

      - name: Runtime render with Ubuntu Pygame
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pygame
          PYTHONPATH=pitv SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            python3 - <<'PY'
          import time
          import pygame
          import pitv as pitv_module
          from queue import Queue
          from pitv import CECReader, LEGACY_ANDROID_PACKAGES, PiTV, VERSION

          assert VERSION == "1.5.0"

          # Regression: cec-ctl prints USER_CONTROL_PRESSED and ui-cmd on
          # separate lines. OK/Back must survive both decoded and raw formats.
          q = Queue()
          cec = CECReader(q)
          cec._handle_monitor_line("USER_CONTROL_PRESSED (0x44):\n")
          cec._handle_monitor_line("  ui-cmd: select (0x00)\n")
          assert q.get_nowait() == pygame.K_RETURN
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE

          # Back long-hold is a separate physical gesture from the raw-format
          # parser test above. Clear the prior gesture state first; otherwise
          # the deliberate 800 ms hold-continuity logic correctly treats this
          # next Back as the same held button and suppresses it.
          cec.clear_key_state()
          # The first Back is delivered once. Older TVs can repeat
          # press/release pairs while the button is held, so gesture duration
          # must survive a short release gap.
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          assert cec.gesture_key == pygame.K_ESCAPE
          cec.gesture_started_at = time.monotonic() - 3.1
          cec.gesture_last_seen_at = time.monotonic()
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.empty()
          assert cec.held_for(pygame.K_ESCAPE) >= 3.0
          cec.clear_key_state()
          assert cec.held_for(pygame.K_ESCAPE) == 0.0

          assert "com.stremio.one" in LEGACY_ANDROID_PACKAGES
          assert "com.plexapp.android" in LEGACY_ANDROID_PACKAGES

          # PiTV 1.4.10 regression contract: returning from an app must keep
          # one healthy CEC reader alive instead of replacing the kernel
          # monitor. The reader itself owns hotplug/reconnect recovery.
          class HealthyCEC:
              def __init__(self):
                  self.clears = 0
              def is_alive(self):
                  return True
              def is_ready(self):
                  return True
              def clear_key_state(self):
                  self.clears += 1

          probe = PiTV.__new__(PiTV)
          probe.cfg = {"cec_enabled": True}
          probe._cec_refreshing = False
          probe.cec_queue = Queue()
          healthy = HealthyCEC()
          probe.cec = healthy
          old_available = pitv_module.cec_available
          old_active_source = pitv_module.cec_active_source
          pitv_module.cec_available = lambda: True
          pitv_module.cec_active_source = lambda: (True, "test")
          try:
              probe._refresh_cec_after_return()
              deadline = time.monotonic() + 2.0
              while probe._cec_refreshing and time.monotonic() < deadline:
                  time.sleep(0.01)
              assert probe.cec is healthy
              assert healthy.clears == 1
              assert not probe._cec_refreshing
          finally:
              pitv_module.cec_available = old_available
              pitv_module.cec_active_source = old_active_source

          # Sencor/other TVs may expose the Home key as any CEC menu command.
          for raw_home in ("0a", "0c", "11"):
              cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
              cec._handle_monitor_line(f"> 01:44:{raw_home}\n")
              assert q.get_nowait() == pygame.K_HOME

          app = PiTV()

          # TV remote contract: Home remains optional multitasking on TVs that
          # have it, but 3-second Back is the universal EXIT for old remotes.
          demo_app = {"name": "Demo", "command": "demo-player"}
          demo_key = app._task_key(demo_app, "linux")
          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app.handle_key(pygame.K_HOME)
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key in app.background_tasks
          app.background_tasks.clear()

          # Every app exit converges on the same visible PiTV workspace.
          app.cfg["cec_enabled"] = False
          app.page = "settings"
          app._return_to_launcher("test", refresh_cec=False)
          assert app.page == "home"
          assert not app.sidebar_focus

          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app._keyboard_back_down_at = time.monotonic() - 3.1
          app._check_global_back_hold()
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key not in app.background_tasks

          # Regression: a legacy Android Stremio APK must stay removable and
          # must not be mistaken for today's native Linux Stremio Flatpak just
          # because both can share the same visible app name.
          legacy_stremio = {
              "name": "Stremio",
              "kind": "apk",
              "package": "com.stremio.legacy",
              "apk_path": "/home/pitv/PiTV/APKs/stremio-old.apk",
          }
          assert app.app_can_uninstall(legacy_stremio)
          assert app._store_item_for_app(legacy_stremio) is None
          native_stremio = {
              "name": "Stremio",
              "kind": "linux",
              "command": "flatpak run com.stremio.Stremio",
          }
          native_item = app._store_item_for_app(native_stremio)
          assert native_item
          assert native_item["installer"]["type"] == "flatpak"
          assert app.app_can_uninstall(native_stremio)

          # Built-in media runtimes have stable multitasking slots.
          kodi_app = {"name":"Kodi", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-launch"}
          plex_app = {"name":"Plex Player", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-addon run script.plexmod"}
          android_app = {"name":"SmartTube", "kind":"apk",
                         "package":"com.teamsmart.videomanager.tv"}
          assert app._task_key(kodi_app, "linux") == "kodi"
          assert app._task_key(plex_app, "linux") == "kodi"
          assert app._task_key(native_stremio, "linux") == "stremio"
          assert app._task_key(android_app, "apk") == (
              "android:com.teamsmart.videomanager.tv"
          )
          second_android = {
              "name": "Second APK", "kind": "apk",
              "package": "com.example.second",
          }
          assert app._task_key(second_android, "apk") != app._task_key(
              android_app, "apk"
          )
          assert app._workspace_for_app(kodi_app, "linux") == "Kodi"
          assert app._workspace_for_app(native_stremio, "linux") == "Stremio"
          assert app._workspace_for_app(android_app, "apk") == "Android"

          # Settings are OK-only: Right must not trigger a hidden
          # action. OK opens the visible list, then Up/Down + OK chooses.
          app.page = "appearance"
          app.sidebar_focus = False
          app.sub_selected = 2
          app.cfg["tile_scale"] = 1.15
          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.15) < 0.001
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Velikost dlaždic"
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.30) < 0.001

          # Theme selector exposes both values and can be cancelled with Back.
          app.sub_selected = 0
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # Regression: if a key relayed with wtype comes back into PiTV,
          # the external app no longer owns focus. Recover without wlrctl.
          app.external_kind = "linux"
          app.external_proc = None
          app._mark_relay_echo(pygame.K_LEFT)
          assert app._consume_relay_echo(pygame.K_LEFT)
          app._recover_external_focus()
          assert app.external_kind is None

          # Screensaver values use the same visible list model.
          app.page = "screensaver"
          app.sub_selected = 1
          app.cfg["screensaver_after_min"] = 1
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Spustit po"
          assert app.choice_options[app.choice_selected][1] == 1
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert app.cfg["screensaver_after_min"] == 2

          # PiTV 1.4.30: every section opened from Settings uses the
          # same three-column Settings list model; Updates exposes one
          # recommended action instead of a 10-card action grid.
          app.settings_context = True
          for detail_page in (
              "screensaver", "network", "audio", "cec", "apps",
              "server_store", "android", "updates", "system", "power", "about",
          ):
              app.page = detail_page
              app.draw()
              print("settings detail OK", detail_page)

          update_actions = app.update_items()
          assert len(update_actions) == 4
          assert update_actions[0][0] == "Aktualizovat vše"
          assert update_actions[1][0] == "Zkontrolovat aktualizace"
          assert update_actions[2][0] == "Pokročilé možnosti"
          assert app.system_items()[-1][0] == "Otevřít Aktualizace"
          assert hasattr(app, "_installed_store_flatpak_ids")
          assert hasattr(app, "_android_runtime_ready_file")
          assert hasattr(app, "android_key_queue")
          app.set_operation("Globální test", 42)
          app.page = "home"
          app.draw()
          assert app.operation_text == "Globální test"
          assert app.operation_progress == 42

          # PiTV 1.4.31 HDMI recovery contract. Dummy rendering must not try
          # to touch a real KMS/Wayland output, but the geometry helpers must
          # be present and safe.
          assert isinstance(app._desktop_size(), tuple)
          assert len(app._desktop_size()) == 2
          assert app._repair_fullscreen(force=True) is False
          assert hasattr(app, "android_pending_proc")
          assert app._android_ready_file().name == "pitv-waydroid-app-ready"

          # Application management is a fixed Settings menu. No Right
          # action is allowed; visibility and uninstall each open a list.
          app.apps = [dict(native_stremio), dict(legacy_stremio)]
          app.page = "apps"
          app.settings_context = True
          app.apps_selected = 1
          app_menu = app.app_items()
          assert [x["kind"] for x in app_menu] == [
              "store", "visibility", "uninstall", "refresh"
          ]
          assert app_menu[1]["name"] == "Zobrazení aplikací"
          assert app_menu[2]["name"] == "Odinstalovat aplikace"

          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active

          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Zobrazení aplikací"
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title in ("Stremio",)
          assert [x[1] for x in app.choice_options] == [True, False]
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          app.apps_selected = 2
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Odinstalovat aplikace"
          assert len(app.choice_options) >= 1
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # CEC and other configuration values must use a visible choice list,
          # not blind left/right toggling.
          app.page = "cec"
          app.open_cec_choice(1)
          assert app.choice_active
          assert app.choice_title == "Probudit TV při startu"
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active
          app.settings_context = False

          pages = (
              "home", "settings", "appearance", "screensaver", "network",
              "audio", "cec", "apps", "store", "server_store", "android",
              "updates", "system", "power", "about",
          )
          for theme in ("apple_dark", "apple_light"):
              app.cfg["theme"] = theme
              for page in pages:
                  app.page = page
                  app.draw()
                  print("render OK", theme, page)

          assert len(app.SETTINGS) == 12
          pygame.quit()
          print("PiTV runtime render OK", VERSION)
          PY

  windows-check:
    name: PiTV SD Installer Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer and engine
        shell: powershell
        run: |
          foreach ($file in @(
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1",
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              exit 1
            }
            Write-Host ("PowerShell syntax OK: " + $file)
          }

      - name: Verify live Ubuntu catalog
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -SelfTestCatalog

      - name: Compile native raw disk helper
        shell: powershell
        run: |
          Add-Type -Path "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs"
          if (-not ("PiTVNativeDisk" -as [type])) {
            throw "PiTVNativeDisk.cs did not compile."
          }
          if (-not ([PiTVNativeDisk].GetMethod("LockVolume"))) {
            throw "PiTVNativeDisk LockVolume helper is missing."
          }
          Write-Host "PiTVNativeDisk C# helper compiles"

      - name: Build lightweight PiTV XZ decoder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:RUNNER_TEMP "pitv-xz-build"

          cmake -S "$env:GITHUB_WORKSPACE\tools\windows\native" -B $build -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure for PiTV-XZ failed." }

          cmake --build $build --config Release --target PiTV-XZ
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ build failed." }

          $exe = Get-ChildItem $build -Recurse -Filter "PiTV-XZ.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "PiTV-XZ.exe was not produced." }

          $bin = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"
          Copy-Item $exe.FullName $bin -Force
          Write-Host ("Built " + $bin + " (" + $exe.Length + " bytes)")

      - name: Verify PiTV XZ extraction
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "pitv-xz-release-test"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $src = Join-Path $dir "sample.img"
          $xz = Join-Path $dir "sample.img.xz"
          $out = Join-Path $dir "expanded.img"
          $decoder = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"

          python -c "import lzma, pathlib, sys; data=bytes(range(256))*16384; pathlib.Path(sys.argv[1]).write_bytes(data); pathlib.Path(sys.argv[2]).write_bytes(lzma.compress(data, format=lzma.FORMAT_XZ))" "$src" "$xz"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create XZ test fixture." }

          & $decoder $xz $out
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ failed to expand the test image." }

          if ((Get-FileHash -Algorithm SHA256 $src).Hash -ne (Get-FileHash -Algorithm SHA256 $out).Hash) {
            throw "PiTV-XZ output is not byte-identical."
          }
          Write-Host "PiTV-XZ raw XZ extraction OK"

      - name: Verify PiTV writer contract
        shell: powershell
        run: |
          $installer = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -Raw
          $engine = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1" -Raw
          $native = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs" -Raw

          if ($installer -match "Ensure-Imager|Assert-ImagerCliContract|Invoke-ImagerWrite") {
            throw "Legacy Raspberry Pi Imager dependency is still present."
          }

          foreach ($required in @(
            "Get-PiTVOnlineImageFile",
            "Prepare-PiTVRawImage",
            "Write-PiTVRawImageToDisk",
            "Install-PiTVCloudInitToBootPartition"
          )) {
            if ($installer -notmatch [regex]::Escape($required)) {
              throw "Installer write flow is missing $required"
            }
          }

          foreach ($required in @(
            "PiTVNativeDisk",
            "PhysicalDrive",
            "CACHE HIT",
            "image_download_sha256",
            "Get-PiTVDeviceSha256",
            "Wait-PiTVTargetDiskReadyAfterRawWrite",
            "DiskPartRescan",
            "Write-PiTVBytesDurable",
            "FINALIZE RETRY",
            "PiTV-XZ.exe",
            "LockVolume"
          )) {
            if ($engine -notmatch [regex]::Escape($required)) {
              throw "Image engine is missing contract item $required"
            }
          }

          foreach ($required in @(
            "FSCTL_LOCK_VOLUME",
            "FSCTL_DISMOUNT_VOLUME",
            "LockAndDismount",
            "FlushFileBuffers",
            "FILE_FLAG_WRITE_THROUGH"
          )) {
            if ($native -notmatch [regex]::Escape($required)) {
              throw "Native disk helper is missing $required"
            }
          }

          Write-Host "PiTV raw writer/cache/volume-lock contract OK"

      - name: Upload PiTV XZ decoder
        uses: actions/upload-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows/PiTV-XZ.exe
          if-no-files-found: error
          retention-days: 1

      - name: Verify launcher target
        shell: powershell
        run: |
          $launcher = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\Start-PiTV-SD-Installer.cmd" -Raw
          if ($launcher -notmatch "PiTV-SD-Installer\.ps1") {
            throw "Launcher does not reference PiTV-SD-Installer.ps1"
          }
          Write-Host "Launcher target OK"

  release:
    name: Publish Alpha
    needs:
      - pitv-check
      - windows-check
    if: ${{ needs.pitv-check.result == 'success' && needs.windows-check.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PiTV XZ decoder
        uses: actions/download-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows

      - name: Release checks
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/windows/PiTV-XZ.exe
          test -s tools/windows/THIRD-PARTY-NOTICES.txt

          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-SD-Installer.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'
          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-ImageEngine.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p "dist/PiTV-SD-Installer-Windows"
          cp tools/windows/Start-PiTV-SD-Installer.cmd "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-SD-Installer.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-ImageEngine.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTVNativeDisk.cs "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-XZ.exe "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/THIRD-PARTY-NOTICES.txt "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/README.md "dist/PiTV-SD-Installer-Windows/README.md"
          cp LICENSE "dist/PiTV-SD-Installer-Windows/LICENSE"
          (
            cd dist
            zip -9 -r "PiTV-SD-Installer-Windows.zip" "PiTV-SD-Installer-Windows" >/dev/null
          )
          test -s dist/PiTV-SD-Installer-Windows.zip
          ls -lh dist/PiTV-SD-Installer-Windows.zip

      - name: Publish rolling Alpha release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f alpha "$GITHUB_SHA"
          git push -f origin refs/tags/alpha

          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          else
            gh release create alpha --target "$GITHUB_SHA" --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          fi

          while IFS= read -r asset; do
            if [ -n "$asset" ] && [ "$asset" != "PiTV-SD-Installer-Windows.zip" ]; then
              gh release delete-asset alpha "$asset" -y
            fi
          done < <(gh release view alpha --json assets --jq '.assets[].name')

          gh release upload alpha dist/PiTV-SD-Installer-Windows.zip --clobber
          gh release view alpha --json url,tagName,name,isDraft,isPrerelease,assets
 system/pitv-launcher-run
          ! grep -q 'while .*STOPPING' system/pitv-launcher-run
          ! grep -q 'pitv-launcher-run' system/labwc/autostart
          grep -q '^Requires=multi-user.target pitv-shell.service$' system/pitv.target
          grep -q '^AllowIsolate=yes$' system/pitv.target
          grep -q '^PAMName=login$' system/pitv-shell.service
          grep -q '^TTYPath=/dev/tty1$' system/pitv-shell.service
          grep -q '^Restart=always$' system/pitv-shell.service
          grep -q '^WantedBy=pitv.target$' system/pitv-shell.service
          grep -q '^Restart=always$' system/pitv-android-warm.service
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          ! grep -q 'start_android_warmer' system/pitv-launcher-run
          ! grep -q 'agetty --autologin' install.sh
          ! grep -q 'system/bash_profile /home/pitv/.bash_profile' install.sh
          grep -q 'systemctl set-default pitv.target' install.sh
          grep -q 'systemctl mask getty@tty1.service' install.sh
          ! grep -q '"waydroid", "shell", "input"' pitv/pitv.py
          grep -q 'waydroid show-full-ui' system/pitv-waydroid-launch
          test "$(grep -c 'waydroid show-full-ui' system/pitv-waydroid-launch)" -eq 1
          grep -q 'pitv-waydroid-app-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-runtime-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          grep -q 'waydroid-app-visible' system/pitv-waydroid-launch
          grep -q 'waydroid-app-visible' system/pitv-helper
          grep -q 'waydroid-app-stop' system/pitv-helper
          grep -q 'waydroid-app-stop' pitv/pitv.py
          ! grep -q '\["waydroid", "session", "stop"\]' pitv/pitv.py
          grep -q 'android_key_queue' pitv/pitv.py
          grep -q 'One global activity banner' pitv/pitv.py
          grep -q 'persist.waydroid.multi_windows false' system/pitv-waydroid-launch
          grep -q 'exec cage -d' system/pitv-waydroid-launch
          grep -q 'labwc cage wtype' install.sh
          grep -q 'pitv-launcher-run' install.sh
          grep -q 'pitv-launcher.service' install.sh
          grep -q 'ExecStart=/usr/bin/systemctl restart pitv-shell.service' install.sh
          grep -q 'legacy-android-media-v2.done' pitv/pitv.py
          grep -q 'DPkg::Lock::Timeout' scripts/install-waydroid.sh
          grep -q 'identifier="wlroots"' system/labwc/rc.xml
          grep -q 'title="PiTV \*"' system/labwc/rc.xml
          grep -q 'SendToDesktop" to="Android" follow="no"' system/labwc/rc.xml
          grep -q '<name>PiTV</name>' system/labwc/rc.xml
          grep -q '<name>Kodi</name>' system/labwc/rc.xml
          grep -q '<name>Stremio</name>' system/labwc/rc.xml
          grep -q '<name>Android</name>' system/labwc/rc.xml
          grep -q 'GoToDesktop" to="PiTV"' system/labwc/rc.xml
          grep -q '"127".*KEYCODE_MEDIA_PAUSE' system/pitv-helper
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          ET.parse("system/labwc/rc.xml")
          print("labwc rc.xml OK")
          PYXML
          grep -q 'flatpak-uninstall' system/pitv-helper
          grep -q 'apt-remove' system/pitv-helper
          grep -q 'pitv-session-run' install.sh
          grep -q 'DPkg::Lock::Timeout=' install.sh
          grep -q -- '--no-update universe' install.sh
          grep -q 'DPkg::Lock::Timeout=600' system/pitv-helper
          grep -q 'APT_LOCK_TIMEOUT' system/pitv-self-update
          grep -q 'stdout=subprocess.PIPE' system/pitv-self-update
          bash -n scripts/install-waydroid.sh
          grep -q 'getconf PAGESIZE' scripts/install-waydroid.sh
          grep -q '/proc/pressure' scripts/install-waydroid.sh
          bash -n tools/pitv-flasher.sh

      - name: Flasher dry run
        shell: bash
        run: |
          bash tools/pitv-flasher.sh --dry-run
          pwsh -NoProfile -File tools/pitv-flasher.ps1 -DryRun

      - name: Waydroid fallback snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/waydroid/noble
          test -s packages.env
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          for pkg in *.deb; do
            dpkg-deb --info "$pkg" >/dev/null
          done

      - name: Store JSON
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          for path in (
              "store/catalog.json",
              "store/server_catalog.json",
              "config/config.json",
          ):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)

          root = ET.parse("system/kodi/appliance.xml").getroot()
          values = {}
          for node in root.iter("setting"):
              default = node.find("default")
              if node.get("id") and default is not None:
                  values[node.get("id")] = (default.text or "").strip().lower()
          assert values["videoplayer.useprimedecoder"] == "true"
          assert values["videoplayer.useprimedecoderforhw"] == "true"
          print("Kodi DRM PRIME appliance defaults OK")
          PY

      - name: Runtime render with Ubuntu Pygame
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pygame
          PYTHONPATH=pitv SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            python3 - <<'PY'
          import time
          import pygame
          import pitv as pitv_module
          from queue import Queue
          from pitv import CECReader, LEGACY_ANDROID_PACKAGES, PiTV, VERSION

          assert VERSION == "1.5.0"

          # Regression: cec-ctl prints USER_CONTROL_PRESSED and ui-cmd on
          # separate lines. OK/Back must survive both decoded and raw formats.
          q = Queue()
          cec = CECReader(q)
          cec._handle_monitor_line("USER_CONTROL_PRESSED (0x44):\n")
          cec._handle_monitor_line("  ui-cmd: select (0x00)\n")
          assert q.get_nowait() == pygame.K_RETURN
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE

          # Back long-hold is a separate physical gesture from the raw-format
          # parser test above. Clear the prior gesture state first; otherwise
          # the deliberate 800 ms hold-continuity logic correctly treats this
          # next Back as the same held button and suppresses it.
          cec.clear_key_state()
          # The first Back is delivered once. Older TVs can repeat
          # press/release pairs while the button is held, so gesture duration
          # must survive a short release gap.
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          assert cec.gesture_key == pygame.K_ESCAPE
          cec.gesture_started_at = time.monotonic() - 3.1
          cec.gesture_last_seen_at = time.monotonic()
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.empty()
          assert cec.held_for(pygame.K_ESCAPE) >= 3.0
          cec.clear_key_state()
          assert cec.held_for(pygame.K_ESCAPE) == 0.0

          assert "com.stremio.one" in LEGACY_ANDROID_PACKAGES
          assert "com.plexapp.android" in LEGACY_ANDROID_PACKAGES

          # PiTV 1.4.10 regression contract: returning from an app must keep
          # one healthy CEC reader alive instead of replacing the kernel
          # monitor. The reader itself owns hotplug/reconnect recovery.
          class HealthyCEC:
              def __init__(self):
                  self.clears = 0
              def is_alive(self):
                  return True
              def is_ready(self):
                  return True
              def clear_key_state(self):
                  self.clears += 1

          probe = PiTV.__new__(PiTV)
          probe.cfg = {"cec_enabled": True}
          probe._cec_refreshing = False
          probe.cec_queue = Queue()
          healthy = HealthyCEC()
          probe.cec = healthy
          old_available = pitv_module.cec_available
          old_active_source = pitv_module.cec_active_source
          pitv_module.cec_available = lambda: True
          pitv_module.cec_active_source = lambda: (True, "test")
          try:
              probe._refresh_cec_after_return()
              deadline = time.monotonic() + 2.0
              while probe._cec_refreshing and time.monotonic() < deadline:
                  time.sleep(0.01)
              assert probe.cec is healthy
              assert healthy.clears == 1
              assert not probe._cec_refreshing
          finally:
              pitv_module.cec_available = old_available
              pitv_module.cec_active_source = old_active_source

          # Sencor/other TVs may expose the Home key as any CEC menu command.
          for raw_home in ("0a", "0c", "11"):
              cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
              cec._handle_monitor_line(f"> 01:44:{raw_home}\n")
              assert q.get_nowait() == pygame.K_HOME

          app = PiTV()

          # TV remote contract: Home remains optional multitasking on TVs that
          # have it, but 3-second Back is the universal EXIT for old remotes.
          demo_app = {"name": "Demo", "command": "demo-player"}
          demo_key = app._task_key(demo_app, "linux")
          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app.handle_key(pygame.K_HOME)
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key in app.background_tasks
          app.background_tasks.clear()

          # Every app exit converges on the same visible PiTV workspace.
          app.cfg["cec_enabled"] = False
          app.page = "settings"
          app._return_to_launcher("test", refresh_cec=False)
          assert app.page == "home"
          assert not app.sidebar_focus

          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app._keyboard_back_down_at = time.monotonic() - 3.1
          app._check_global_back_hold()
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key not in app.background_tasks

          # Regression: a legacy Android Stremio APK must stay removable and
          # must not be mistaken for today's native Linux Stremio Flatpak just
          # because both can share the same visible app name.
          legacy_stremio = {
              "name": "Stremio",
              "kind": "apk",
              "package": "com.stremio.legacy",
              "apk_path": "/home/pitv/PiTV/APKs/stremio-old.apk",
          }
          assert app.app_can_uninstall(legacy_stremio)
          assert app._store_item_for_app(legacy_stremio) is None
          native_stremio = {
              "name": "Stremio",
              "kind": "linux",
              "command": "flatpak run com.stremio.Stremio",
          }
          native_item = app._store_item_for_app(native_stremio)
          assert native_item
          assert native_item["installer"]["type"] == "flatpak"
          assert app.app_can_uninstall(native_stremio)

          # Built-in media runtimes have stable multitasking slots.
          kodi_app = {"name":"Kodi", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-launch"}
          plex_app = {"name":"Plex Player", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-addon run script.plexmod"}
          android_app = {"name":"SmartTube", "kind":"apk",
                         "package":"com.teamsmart.videomanager.tv"}
          assert app._task_key(kodi_app, "linux") == "kodi"
          assert app._task_key(plex_app, "linux") == "kodi"
          assert app._task_key(native_stremio, "linux") == "stremio"
          assert app._task_key(android_app, "apk") == (
              "android:com.teamsmart.videomanager.tv"
          )
          second_android = {
              "name": "Second APK", "kind": "apk",
              "package": "com.example.second",
          }
          assert app._task_key(second_android, "apk") != app._task_key(
              android_app, "apk"
          )
          assert app._workspace_for_app(kodi_app, "linux") == "Kodi"
          assert app._workspace_for_app(native_stremio, "linux") == "Stremio"
          assert app._workspace_for_app(android_app, "apk") == "Android"

          # Settings are OK-only: Right must not trigger a hidden
          # action. OK opens the visible list, then Up/Down + OK chooses.
          app.page = "appearance"
          app.sidebar_focus = False
          app.sub_selected = 2
          app.cfg["tile_scale"] = 1.15
          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.15) < 0.001
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Velikost dlaždic"
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.30) < 0.001

          # Theme selector exposes both values and can be cancelled with Back.
          app.sub_selected = 0
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # Regression: if a key relayed with wtype comes back into PiTV,
          # the external app no longer owns focus. Recover without wlrctl.
          app.external_kind = "linux"
          app.external_proc = None
          app._mark_relay_echo(pygame.K_LEFT)
          assert app._consume_relay_echo(pygame.K_LEFT)
          app._recover_external_focus()
          assert app.external_kind is None

          # Screensaver values use the same visible list model.
          app.page = "screensaver"
          app.sub_selected = 1
          app.cfg["screensaver_after_min"] = 1
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Spustit po"
          assert app.choice_options[app.choice_selected][1] == 1
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert app.cfg["screensaver_after_min"] == 2

          # PiTV 1.4.30: every section opened from Settings uses the
          # same three-column Settings list model; Updates exposes one
          # recommended action instead of a 10-card action grid.
          app.settings_context = True
          for detail_page in (
              "screensaver", "network", "audio", "cec", "apps",
              "server_store", "android", "updates", "system", "power", "about",
          ):
              app.page = detail_page
              app.draw()
              print("settings detail OK", detail_page)

          update_actions = app.update_items()
          assert len(update_actions) == 4
          assert update_actions[0][0] == "Aktualizovat vše"
          assert update_actions[1][0] == "Zkontrolovat aktualizace"
          assert update_actions[2][0] == "Pokročilé možnosti"
          assert app.system_items()[-1][0] == "Otevřít Aktualizace"
          assert hasattr(app, "_installed_store_flatpak_ids")
          assert hasattr(app, "_android_runtime_ready_file")
          assert hasattr(app, "android_key_queue")
          app.set_operation("Globální test", 42)
          app.page = "home"
          app.draw()
          assert app.operation_text == "Globální test"
          assert app.operation_progress == 42

          # PiTV 1.4.31 HDMI recovery contract. Dummy rendering must not try
          # to touch a real KMS/Wayland output, but the geometry helpers must
          # be present and safe.
          assert isinstance(app._desktop_size(), tuple)
          assert len(app._desktop_size()) == 2
          assert app._repair_fullscreen(force=True) is False
          assert hasattr(app, "android_pending_proc")
          assert app._android_ready_file().name == "pitv-waydroid-app-ready"

          # Application management is a fixed Settings menu. No Right
          # action is allowed; visibility and uninstall each open a list.
          app.apps = [dict(native_stremio), dict(legacy_stremio)]
          app.page = "apps"
          app.settings_context = True
          app.apps_selected = 1
          app_menu = app.app_items()
          assert [x["kind"] for x in app_menu] == [
              "store", "visibility", "uninstall", "refresh"
          ]
          assert app_menu[1]["name"] == "Zobrazení aplikací"
          assert app_menu[2]["name"] == "Odinstalovat aplikace"

          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active

          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Zobrazení aplikací"
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title in ("Stremio",)
          assert [x[1] for x in app.choice_options] == [True, False]
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          app.apps_selected = 2
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Odinstalovat aplikace"
          assert len(app.choice_options) >= 1
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # CEC and other configuration values must use a visible choice list,
          # not blind left/right toggling.
          app.page = "cec"
          app.open_cec_choice(1)
          assert app.choice_active
          assert app.choice_title == "Probudit TV při startu"
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active
          app.settings_context = False

          pages = (
              "home", "settings", "appearance", "screensaver", "network",
              "audio", "cec", "apps", "store", "server_store", "android",
              "updates", "system", "power", "about",
          )
          for theme in ("apple_dark", "apple_light"):
              app.cfg["theme"] = theme
              for page in pages:
                  app.page = page
                  app.draw()
                  print("render OK", theme, page)

          assert len(app.SETTINGS) == 12
          pygame.quit()
          print("PiTV runtime render OK", VERSION)
          PY

  windows-check:
    name: PiTV SD Installer Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer and engine
        shell: powershell
        run: |
          foreach ($file in @(
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1",
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              exit 1
            }
            Write-Host ("PowerShell syntax OK: " + $file)
          }

      - name: Verify live Ubuntu catalog
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -SelfTestCatalog

      - name: Compile native raw disk helper
        shell: powershell
        run: |
          Add-Type -Path "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs"
          if (-not ("PiTVNativeDisk" -as [type])) {
            throw "PiTVNativeDisk.cs did not compile."
          }
          if (-not ([PiTVNativeDisk].GetMethod("LockVolume"))) {
            throw "PiTVNativeDisk LockVolume helper is missing."
          }
          Write-Host "PiTVNativeDisk C# helper compiles"

      - name: Build lightweight PiTV XZ decoder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:RUNNER_TEMP "pitv-xz-build"

          cmake -S "$env:GITHUB_WORKSPACE\tools\windows\native" -B $build -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure for PiTV-XZ failed." }

          cmake --build $build --config Release --target PiTV-XZ
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ build failed." }

          $exe = Get-ChildItem $build -Recurse -Filter "PiTV-XZ.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "PiTV-XZ.exe was not produced." }

          $bin = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"
          Copy-Item $exe.FullName $bin -Force
          Write-Host ("Built " + $bin + " (" + $exe.Length + " bytes)")

      - name: Verify PiTV XZ extraction
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "pitv-xz-release-test"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $src = Join-Path $dir "sample.img"
          $xz = Join-Path $dir "sample.img.xz"
          $out = Join-Path $dir "expanded.img"
          $decoder = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"

          python -c "import lzma, pathlib, sys; data=bytes(range(256))*16384; pathlib.Path(sys.argv[1]).write_bytes(data); pathlib.Path(sys.argv[2]).write_bytes(lzma.compress(data, format=lzma.FORMAT_XZ))" "$src" "$xz"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create XZ test fixture." }

          & $decoder $xz $out
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ failed to expand the test image." }

          if ((Get-FileHash -Algorithm SHA256 $src).Hash -ne (Get-FileHash -Algorithm SHA256 $out).Hash) {
            throw "PiTV-XZ output is not byte-identical."
          }
          Write-Host "PiTV-XZ raw XZ extraction OK"

      - name: Verify PiTV writer contract
        shell: powershell
        run: |
          $installer = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -Raw
          $engine = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1" -Raw
          $native = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs" -Raw

          if ($installer -match "Ensure-Imager|Assert-ImagerCliContract|Invoke-ImagerWrite") {
            throw "Legacy Raspberry Pi Imager dependency is still present."
          }

          foreach ($required in @(
            "Get-PiTVOnlineImageFile",
            "Prepare-PiTVRawImage",
            "Write-PiTVRawImageToDisk",
            "Install-PiTVCloudInitToBootPartition"
          )) {
            if ($installer -notmatch [regex]::Escape($required)) {
              throw "Installer write flow is missing $required"
            }
          }

          foreach ($required in @(
            "PiTVNativeDisk",
            "PhysicalDrive",
            "CACHE HIT",
            "image_download_sha256",
            "Get-PiTVDeviceSha256",
            "Wait-PiTVTargetDiskReadyAfterRawWrite",
            "DiskPartRescan",
            "Write-PiTVBytesDurable",
            "FINALIZE RETRY",
            "PiTV-XZ.exe",
            "LockVolume"
          )) {
            if ($engine -notmatch [regex]::Escape($required)) {
              throw "Image engine is missing contract item $required"
            }
          }

          foreach ($required in @(
            "FSCTL_LOCK_VOLUME",
            "FSCTL_DISMOUNT_VOLUME",
            "LockAndDismount",
            "FlushFileBuffers",
            "FILE_FLAG_WRITE_THROUGH"
          )) {
            if ($native -notmatch [regex]::Escape($required)) {
              throw "Native disk helper is missing $required"
            }
          }

          Write-Host "PiTV raw writer/cache/volume-lock contract OK"

      - name: Upload PiTV XZ decoder
        uses: actions/upload-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows/PiTV-XZ.exe
          if-no-files-found: error
          retention-days: 1

      - name: Verify launcher target
        shell: powershell
        run: |
          $launcher = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\Start-PiTV-SD-Installer.cmd" -Raw
          if ($launcher -notmatch "PiTV-SD-Installer\.ps1") {
            throw "Launcher does not reference PiTV-SD-Installer.ps1"
          }
          Write-Host "Launcher target OK"

  release:
    name: Publish Alpha
    needs:
      - pitv-check
      - windows-check
    if: ${{ needs.pitv-check.result == 'success' && needs.windows-check.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PiTV XZ decoder
        uses: actions/download-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows

      - name: Release checks
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/windows/PiTV-XZ.exe
          test -s tools/windows/THIRD-PARTY-NOTICES.txt

          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-SD-Installer.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'
          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-ImageEngine.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p "dist/PiTV-SD-Installer-Windows"
          cp tools/windows/Start-PiTV-SD-Installer.cmd "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-SD-Installer.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-ImageEngine.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTVNativeDisk.cs "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-XZ.exe "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/THIRD-PARTY-NOTICES.txt "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/README.md "dist/PiTV-SD-Installer-Windows/README.md"
          cp LICENSE "dist/PiTV-SD-Installer-Windows/LICENSE"
          (
            cd dist
            zip -9 -r "PiTV-SD-Installer-Windows.zip" "PiTV-SD-Installer-Windows" >/dev/null
          )
          test -s dist/PiTV-SD-Installer-Windows.zip
          ls -lh dist/PiTV-SD-Installer-Windows.zip

      - name: Publish rolling Alpha release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f alpha "$GITHUB_SHA"
          git push -f origin refs/tags/alpha

          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          else
            gh release create alpha --target "$GITHUB_SHA" --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          fi

          while IFS= read -r asset; do
            if [ -n "$asset" ] && [ "$asset" != "PiTV-SD-Installer-Windows.zip" ]; then
              gh release delete-asset alpha "$asset" -y
            fi
          done < <(gh release view alpha --json assets --jq '.assets[].name')

          gh release upload alpha dist/PiTV-SD-Installer-Windows.zip --clobber
          gh release view alpha --json url,tagName,name,isDraft,isPrerelease,assets
 system/pitv-android-warm.service
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          ! grep -q 'start_android_warmer' system/pitv-launcher-run
          ! grep -q 'agetty --autologin' install.sh
          ! grep -q 'system/bash_profile /home/pitv/.bash_profile' install.sh
          grep -q 'systemctl set-default pitv.target' install.sh
          grep -q 'systemctl mask getty@tty1.service' install.sh
          ! grep -q '"waydroid", "shell", "input"' pitv/pitv.py
          grep -q 'waydroid show-full-ui' system/pitv-waydroid-launch
          test "$(grep -c 'waydroid show-full-ui' system/pitv-waydroid-launch)" -eq 1
          grep -q 'pitv-waydroid-app-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-runtime-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          grep -q 'waydroid-app-visible' system/pitv-waydroid-launch
          grep -q 'waydroid-app-visible' system/pitv-helper
          grep -q 'waydroid-app-stop' system/pitv-helper
          grep -q 'waydroid-app-stop' pitv/pitv.py
          ! grep -q '\["waydroid", "session", "stop"\]' pitv/pitv.py
          grep -q 'android_key_queue' pitv/pitv.py
          grep -q 'One global activity banner' pitv/pitv.py
          grep -q 'persist.waydroid.multi_windows false' system/pitv-waydroid-launch
          grep -q 'exec cage -d' system/pitv-waydroid-launch
          grep -q 'labwc cage wtype' install.sh
          grep -q 'pitv-launcher-run' install.sh
          grep -q 'pitv-launcher.service' install.sh
          grep -q 'ExecStart=/usr/bin/systemctl restart pitv-shell.service' install.sh
          grep -q 'legacy-android-media-v2.done' pitv/pitv.py
          grep -q 'DPkg::Lock::Timeout' scripts/install-waydroid.sh
          grep -q 'identifier="wlroots"' system/labwc/rc.xml
          grep -q 'title="PiTV \*"' system/labwc/rc.xml
          grep -q 'SendToDesktop" to="Android" follow="no"' system/labwc/rc.xml
          grep -q '<name>PiTV</name>' system/labwc/rc.xml
          grep -q '<name>Kodi</name>' system/labwc/rc.xml
          grep -q '<name>Stremio</name>' system/labwc/rc.xml
          grep -q '<name>Android</name>' system/labwc/rc.xml
          grep -q 'GoToDesktop" to="PiTV"' system/labwc/rc.xml
          grep -q '"127".*KEYCODE_MEDIA_PAUSE' system/pitv-helper
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          ET.parse("system/labwc/rc.xml")
          print("labwc rc.xml OK")
          PYXML
          grep -q 'flatpak-uninstall' system/pitv-helper
          grep -q 'apt-remove' system/pitv-helper
          grep -q 'pitv-session-run' install.sh
          grep -q 'DPkg::Lock::Timeout=' install.sh
          grep -q -- '--no-update universe' install.sh
          grep -q 'DPkg::Lock::Timeout=600' system/pitv-helper
          grep -q 'APT_LOCK_TIMEOUT' system/pitv-self-update
          grep -q 'stdout=subprocess.PIPE' system/pitv-self-update
          bash -n scripts/install-waydroid.sh
          grep -q 'getconf PAGESIZE' scripts/install-waydroid.sh
          grep -q '/proc/pressure' scripts/install-waydroid.sh
          bash -n tools/pitv-flasher.sh

      - name: Flasher dry run
        shell: bash
        run: |
          bash tools/pitv-flasher.sh --dry-run
          pwsh -NoProfile -File tools/pitv-flasher.ps1 -DryRun

      - name: Waydroid fallback snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/waydroid/noble
          test -s packages.env
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          for pkg in *.deb; do
            dpkg-deb --info "$pkg" >/dev/null
          done

      - name: Store JSON
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          for path in (
              "store/catalog.json",
              "store/server_catalog.json",
              "config/config.json",
          ):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)

          root = ET.parse("system/kodi/appliance.xml").getroot()
          values = {}
          for node in root.iter("setting"):
              default = node.find("default")
              if node.get("id") and default is not None:
                  values[node.get("id")] = (default.text or "").strip().lower()
          assert values["videoplayer.useprimedecoder"] == "true"
          assert values["videoplayer.useprimedecoderforhw"] == "true"
          print("Kodi DRM PRIME appliance defaults OK")
          PY

      - name: Runtime render with Ubuntu Pygame
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pygame
          PYTHONPATH=pitv SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            python3 - <<'PY'
          import time
          import pygame
          import pitv as pitv_module
          from queue import Queue
          from pitv import CECReader, LEGACY_ANDROID_PACKAGES, PiTV, VERSION

          assert VERSION == "1.5.0"

          # Regression: cec-ctl prints USER_CONTROL_PRESSED and ui-cmd on
          # separate lines. OK/Back must survive both decoded and raw formats.
          q = Queue()
          cec = CECReader(q)
          cec._handle_monitor_line("USER_CONTROL_PRESSED (0x44):\n")
          cec._handle_monitor_line("  ui-cmd: select (0x00)\n")
          assert q.get_nowait() == pygame.K_RETURN
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE

          # Back long-hold is a separate physical gesture from the raw-format
          # parser test above. Clear the prior gesture state first; otherwise
          # the deliberate 800 ms hold-continuity logic correctly treats this
          # next Back as the same held button and suppresses it.
          cec.clear_key_state()
          # The first Back is delivered once. Older TVs can repeat
          # press/release pairs while the button is held, so gesture duration
          # must survive a short release gap.
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          assert cec.gesture_key == pygame.K_ESCAPE
          cec.gesture_started_at = time.monotonic() - 3.1
          cec.gesture_last_seen_at = time.monotonic()
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.empty()
          assert cec.held_for(pygame.K_ESCAPE) >= 3.0
          cec.clear_key_state()
          assert cec.held_for(pygame.K_ESCAPE) == 0.0

          assert "com.stremio.one" in LEGACY_ANDROID_PACKAGES
          assert "com.plexapp.android" in LEGACY_ANDROID_PACKAGES

          # PiTV 1.4.10 regression contract: returning from an app must keep
          # one healthy CEC reader alive instead of replacing the kernel
          # monitor. The reader itself owns hotplug/reconnect recovery.
          class HealthyCEC:
              def __init__(self):
                  self.clears = 0
              def is_alive(self):
                  return True
              def is_ready(self):
                  return True
              def clear_key_state(self):
                  self.clears += 1

          probe = PiTV.__new__(PiTV)
          probe.cfg = {"cec_enabled": True}
          probe._cec_refreshing = False
          probe.cec_queue = Queue()
          healthy = HealthyCEC()
          probe.cec = healthy
          old_available = pitv_module.cec_available
          old_active_source = pitv_module.cec_active_source
          pitv_module.cec_available = lambda: True
          pitv_module.cec_active_source = lambda: (True, "test")
          try:
              probe._refresh_cec_after_return()
              deadline = time.monotonic() + 2.0
              while probe._cec_refreshing and time.monotonic() < deadline:
                  time.sleep(0.01)
              assert probe.cec is healthy
              assert healthy.clears == 1
              assert not probe._cec_refreshing
          finally:
              pitv_module.cec_available = old_available
              pitv_module.cec_active_source = old_active_source

          # Sencor/other TVs may expose the Home key as any CEC menu command.
          for raw_home in ("0a", "0c", "11"):
              cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
              cec._handle_monitor_line(f"> 01:44:{raw_home}\n")
              assert q.get_nowait() == pygame.K_HOME

          app = PiTV()

          # TV remote contract: Home remains optional multitasking on TVs that
          # have it, but 3-second Back is the universal EXIT for old remotes.
          demo_app = {"name": "Demo", "command": "demo-player"}
          demo_key = app._task_key(demo_app, "linux")
          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app.handle_key(pygame.K_HOME)
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key in app.background_tasks
          app.background_tasks.clear()

          # Every app exit converges on the same visible PiTV workspace.
          app.cfg["cec_enabled"] = False
          app.page = "settings"
          app._return_to_launcher("test", refresh_cec=False)
          assert app.page == "home"
          assert not app.sidebar_focus

          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app._keyboard_back_down_at = time.monotonic() - 3.1
          app._check_global_back_hold()
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key not in app.background_tasks

          # Regression: a legacy Android Stremio APK must stay removable and
          # must not be mistaken for today's native Linux Stremio Flatpak just
          # because both can share the same visible app name.
          legacy_stremio = {
              "name": "Stremio",
              "kind": "apk",
              "package": "com.stremio.legacy",
              "apk_path": "/home/pitv/PiTV/APKs/stremio-old.apk",
          }
          assert app.app_can_uninstall(legacy_stremio)
          assert app._store_item_for_app(legacy_stremio) is None
          native_stremio = {
              "name": "Stremio",
              "kind": "linux",
              "command": "flatpak run com.stremio.Stremio",
          }
          native_item = app._store_item_for_app(native_stremio)
          assert native_item
          assert native_item["installer"]["type"] == "flatpak"
          assert app.app_can_uninstall(native_stremio)

          # Built-in media runtimes have stable multitasking slots.
          kodi_app = {"name":"Kodi", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-launch"}
          plex_app = {"name":"Plex Player", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-addon run script.plexmod"}
          android_app = {"name":"SmartTube", "kind":"apk",
                         "package":"com.teamsmart.videomanager.tv"}
          assert app._task_key(kodi_app, "linux") == "kodi"
          assert app._task_key(plex_app, "linux") == "kodi"
          assert app._task_key(native_stremio, "linux") == "stremio"
          assert app._task_key(android_app, "apk") == (
              "android:com.teamsmart.videomanager.tv"
          )
          second_android = {
              "name": "Second APK", "kind": "apk",
              "package": "com.example.second",
          }
          assert app._task_key(second_android, "apk") != app._task_key(
              android_app, "apk"
          )
          assert app._workspace_for_app(kodi_app, "linux") == "Kodi"
          assert app._workspace_for_app(native_stremio, "linux") == "Stremio"
          assert app._workspace_for_app(android_app, "apk") == "Android"

          # Settings are OK-only: Right must not trigger a hidden
          # action. OK opens the visible list, then Up/Down + OK chooses.
          app.page = "appearance"
          app.sidebar_focus = False
          app.sub_selected = 2
          app.cfg["tile_scale"] = 1.15
          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.15) < 0.001
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Velikost dlaždic"
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.30) < 0.001

          # Theme selector exposes both values and can be cancelled with Back.
          app.sub_selected = 0
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # Regression: if a key relayed with wtype comes back into PiTV,
          # the external app no longer owns focus. Recover without wlrctl.
          app.external_kind = "linux"
          app.external_proc = None
          app._mark_relay_echo(pygame.K_LEFT)
          assert app._consume_relay_echo(pygame.K_LEFT)
          app._recover_external_focus()
          assert app.external_kind is None

          # Screensaver values use the same visible list model.
          app.page = "screensaver"
          app.sub_selected = 1
          app.cfg["screensaver_after_min"] = 1
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Spustit po"
          assert app.choice_options[app.choice_selected][1] == 1
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert app.cfg["screensaver_after_min"] == 2

          # PiTV 1.4.30: every section opened from Settings uses the
          # same three-column Settings list model; Updates exposes one
          # recommended action instead of a 10-card action grid.
          app.settings_context = True
          for detail_page in (
              "screensaver", "network", "audio", "cec", "apps",
              "server_store", "android", "updates", "system", "power", "about",
          ):
              app.page = detail_page
              app.draw()
              print("settings detail OK", detail_page)

          update_actions = app.update_items()
          assert len(update_actions) == 4
          assert update_actions[0][0] == "Aktualizovat vše"
          assert update_actions[1][0] == "Zkontrolovat aktualizace"
          assert update_actions[2][0] == "Pokročilé možnosti"
          assert app.system_items()[-1][0] == "Otevřít Aktualizace"
          assert hasattr(app, "_installed_store_flatpak_ids")
          assert hasattr(app, "_android_runtime_ready_file")
          assert hasattr(app, "android_key_queue")
          app.set_operation("Globální test", 42)
          app.page = "home"
          app.draw()
          assert app.operation_text == "Globální test"
          assert app.operation_progress == 42

          # PiTV 1.4.31 HDMI recovery contract. Dummy rendering must not try
          # to touch a real KMS/Wayland output, but the geometry helpers must
          # be present and safe.
          assert isinstance(app._desktop_size(), tuple)
          assert len(app._desktop_size()) == 2
          assert app._repair_fullscreen(force=True) is False
          assert hasattr(app, "android_pending_proc")
          assert app._android_ready_file().name == "pitv-waydroid-app-ready"

          # Application management is a fixed Settings menu. No Right
          # action is allowed; visibility and uninstall each open a list.
          app.apps = [dict(native_stremio), dict(legacy_stremio)]
          app.page = "apps"
          app.settings_context = True
          app.apps_selected = 1
          app_menu = app.app_items()
          assert [x["kind"] for x in app_menu] == [
              "store", "visibility", "uninstall", "refresh"
          ]
          assert app_menu[1]["name"] == "Zobrazení aplikací"
          assert app_menu[2]["name"] == "Odinstalovat aplikace"

          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active

          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Zobrazení aplikací"
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title in ("Stremio",)
          assert [x[1] for x in app.choice_options] == [True, False]
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          app.apps_selected = 2
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Odinstalovat aplikace"
          assert len(app.choice_options) >= 1
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # CEC and other configuration values must use a visible choice list,
          # not blind left/right toggling.
          app.page = "cec"
          app.open_cec_choice(1)
          assert app.choice_active
          assert app.choice_title == "Probudit TV při startu"
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active
          app.settings_context = False

          pages = (
              "home", "settings", "appearance", "screensaver", "network",
              "audio", "cec", "apps", "store", "server_store", "android",
              "updates", "system", "power", "about",
          )
          for theme in ("apple_dark", "apple_light"):
              app.cfg["theme"] = theme
              for page in pages:
                  app.page = page
                  app.draw()
                  print("render OK", theme, page)

          assert len(app.SETTINGS) == 12
          pygame.quit()
          print("PiTV runtime render OK", VERSION)
          PY

  windows-check:
    name: PiTV SD Installer Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer and engine
        shell: powershell
        run: |
          foreach ($file in @(
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1",
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              exit 1
            }
            Write-Host ("PowerShell syntax OK: " + $file)
          }

      - name: Verify live Ubuntu catalog
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -SelfTestCatalog

      - name: Compile native raw disk helper
        shell: powershell
        run: |
          Add-Type -Path "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs"
          if (-not ("PiTVNativeDisk" -as [type])) {
            throw "PiTVNativeDisk.cs did not compile."
          }
          if (-not ([PiTVNativeDisk].GetMethod("LockVolume"))) {
            throw "PiTVNativeDisk LockVolume helper is missing."
          }
          Write-Host "PiTVNativeDisk C# helper compiles"

      - name: Build lightweight PiTV XZ decoder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:RUNNER_TEMP "pitv-xz-build"

          cmake -S "$env:GITHUB_WORKSPACE\tools\windows\native" -B $build -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure for PiTV-XZ failed." }

          cmake --build $build --config Release --target PiTV-XZ
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ build failed." }

          $exe = Get-ChildItem $build -Recurse -Filter "PiTV-XZ.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "PiTV-XZ.exe was not produced." }

          $bin = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"
          Copy-Item $exe.FullName $bin -Force
          Write-Host ("Built " + $bin + " (" + $exe.Length + " bytes)")

      - name: Verify PiTV XZ extraction
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "pitv-xz-release-test"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $src = Join-Path $dir "sample.img"
          $xz = Join-Path $dir "sample.img.xz"
          $out = Join-Path $dir "expanded.img"
          $decoder = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"

          python -c "import lzma, pathlib, sys; data=bytes(range(256))*16384; pathlib.Path(sys.argv[1]).write_bytes(data); pathlib.Path(sys.argv[2]).write_bytes(lzma.compress(data, format=lzma.FORMAT_XZ))" "$src" "$xz"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create XZ test fixture." }

          & $decoder $xz $out
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ failed to expand the test image." }

          if ((Get-FileHash -Algorithm SHA256 $src).Hash -ne (Get-FileHash -Algorithm SHA256 $out).Hash) {
            throw "PiTV-XZ output is not byte-identical."
          }
          Write-Host "PiTV-XZ raw XZ extraction OK"

      - name: Verify PiTV writer contract
        shell: powershell
        run: |
          $installer = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -Raw
          $engine = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1" -Raw
          $native = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs" -Raw

          if ($installer -match "Ensure-Imager|Assert-ImagerCliContract|Invoke-ImagerWrite") {
            throw "Legacy Raspberry Pi Imager dependency is still present."
          }

          foreach ($required in @(
            "Get-PiTVOnlineImageFile",
            "Prepare-PiTVRawImage",
            "Write-PiTVRawImageToDisk",
            "Install-PiTVCloudInitToBootPartition"
          )) {
            if ($installer -notmatch [regex]::Escape($required)) {
              throw "Installer write flow is missing $required"
            }
          }

          foreach ($required in @(
            "PiTVNativeDisk",
            "PhysicalDrive",
            "CACHE HIT",
            "image_download_sha256",
            "Get-PiTVDeviceSha256",
            "Wait-PiTVTargetDiskReadyAfterRawWrite",
            "DiskPartRescan",
            "Write-PiTVBytesDurable",
            "FINALIZE RETRY",
            "PiTV-XZ.exe",
            "LockVolume"
          )) {
            if ($engine -notmatch [regex]::Escape($required)) {
              throw "Image engine is missing contract item $required"
            }
          }

          foreach ($required in @(
            "FSCTL_LOCK_VOLUME",
            "FSCTL_DISMOUNT_VOLUME",
            "LockAndDismount",
            "FlushFileBuffers",
            "FILE_FLAG_WRITE_THROUGH"
          )) {
            if ($native -notmatch [regex]::Escape($required)) {
              throw "Native disk helper is missing $required"
            }
          }

          Write-Host "PiTV raw writer/cache/volume-lock contract OK"

      - name: Upload PiTV XZ decoder
        uses: actions/upload-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows/PiTV-XZ.exe
          if-no-files-found: error
          retention-days: 1

      - name: Verify launcher target
        shell: powershell
        run: |
          $launcher = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\Start-PiTV-SD-Installer.cmd" -Raw
          if ($launcher -notmatch "PiTV-SD-Installer\.ps1") {
            throw "Launcher does not reference PiTV-SD-Installer.ps1"
          }
          Write-Host "Launcher target OK"

  release:
    name: Publish Alpha
    needs:
      - pitv-check
      - windows-check
    if: ${{ needs.pitv-check.result == 'success' && needs.windows-check.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PiTV XZ decoder
        uses: actions/download-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows

      - name: Release checks
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/windows/PiTV-XZ.exe
          test -s tools/windows/THIRD-PARTY-NOTICES.txt

          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-SD-Installer.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'
          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-ImageEngine.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p "dist/PiTV-SD-Installer-Windows"
          cp tools/windows/Start-PiTV-SD-Installer.cmd "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-SD-Installer.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-ImageEngine.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTVNativeDisk.cs "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-XZ.exe "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/THIRD-PARTY-NOTICES.txt "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/README.md "dist/PiTV-SD-Installer-Windows/README.md"
          cp LICENSE "dist/PiTV-SD-Installer-Windows/LICENSE"
          (
            cd dist
            zip -9 -r "PiTV-SD-Installer-Windows.zip" "PiTV-SD-Installer-Windows" >/dev/null
          )
          test -s dist/PiTV-SD-Installer-Windows.zip
          ls -lh dist/PiTV-SD-Installer-Windows.zip

      - name: Publish rolling Alpha release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f alpha "$GITHUB_SHA"
          git push -f origin refs/tags/alpha

          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          else
            gh release create alpha --target "$GITHUB_SHA" --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          fi

          while IFS= read -r asset; do
            if [ -n "$asset" ] && [ "$asset" != "PiTV-SD-Installer-Windows.zip" ]; then
              gh release delete-asset alpha "$asset" -y
            fi
          done < <(gh release view alpha --json assets --jq '.assets[].name')

          gh release upload alpha dist/PiTV-SD-Installer-Windows.zip --clobber
          gh release view alpha --json url,tagName,name,isDraft,isPrerelease,assets
 system/pitv-launcher-run
          ! grep -q 'while .*STOPPING' system/pitv-launcher-run
          ! grep -q 'pitv-launcher-run' system/labwc/autostart
          grep -q '^Requires=multi-user.target pitv-shell.service$' system/pitv.target
          grep -q '^AllowIsolate=yes$' system/pitv.target
          grep -q '^PAMName=login$' system/pitv-shell.service
          grep -q '^TTYPath=/dev/tty1$' system/pitv-shell.service
          grep -q '^Restart=always$' system/pitv-shell.service
          grep -q '^WantedBy=pitv.target$' system/pitv-shell.service
          grep -q '^Restart=always$' system/pitv-android-warm.service
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          ! grep -q 'start_android_warmer' system/pitv-launcher-run
          ! grep -q 'agetty --autologin' install.sh
          ! grep -q 'system/bash_profile /home/pitv/.bash_profile' install.sh
          grep -q 'systemctl set-default pitv.target' install.sh
          grep -q 'systemctl mask getty@tty1.service' install.sh
          ! grep -q '"waydroid", "shell", "input"' pitv/pitv.py
          grep -q 'waydroid show-full-ui' system/pitv-waydroid-launch
          test "$(grep -c 'waydroid show-full-ui' system/pitv-waydroid-launch)" -eq 1
          grep -q 'pitv-waydroid-app-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-runtime-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          grep -q 'waydroid-app-visible' system/pitv-waydroid-launch
          grep -q 'waydroid-app-visible' system/pitv-helper
          grep -q 'waydroid-app-stop' system/pitv-helper
          grep -q 'waydroid-app-stop' pitv/pitv.py
          ! grep -q '\["waydroid", "session", "stop"\]' pitv/pitv.py
          grep -q 'android_key_queue' pitv/pitv.py
          grep -q 'One global activity banner' pitv/pitv.py
          grep -q 'persist.waydroid.multi_windows false' system/pitv-waydroid-launch
          grep -q 'exec cage -d' system/pitv-waydroid-launch
          grep -q 'labwc cage wtype' install.sh
          grep -q 'pitv-launcher-run' install.sh
          grep -q 'pitv-launcher.service' install.sh
          grep -q 'ExecStart=/usr/bin/systemctl restart pitv-shell.service' install.sh
          grep -q 'legacy-android-media-v2.done' pitv/pitv.py
          grep -q 'DPkg::Lock::Timeout' scripts/install-waydroid.sh
          grep -q 'identifier="wlroots"' system/labwc/rc.xml
          grep -q 'title="PiTV \*"' system/labwc/rc.xml
          grep -q 'SendToDesktop" to="Android" follow="no"' system/labwc/rc.xml
          grep -q '<name>PiTV</name>' system/labwc/rc.xml
          grep -q '<name>Kodi</name>' system/labwc/rc.xml
          grep -q '<name>Stremio</name>' system/labwc/rc.xml
          grep -q '<name>Android</name>' system/labwc/rc.xml
          grep -q 'GoToDesktop" to="PiTV"' system/labwc/rc.xml
          grep -q '"127".*KEYCODE_MEDIA_PAUSE' system/pitv-helper
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          ET.parse("system/labwc/rc.xml")
          print("labwc rc.xml OK")
          PYXML
          grep -q 'flatpak-uninstall' system/pitv-helper
          grep -q 'apt-remove' system/pitv-helper
          grep -q 'pitv-session-run' install.sh
          grep -q 'DPkg::Lock::Timeout=' install.sh
          grep -q -- '--no-update universe' install.sh
          grep -q 'DPkg::Lock::Timeout=600' system/pitv-helper
          grep -q 'APT_LOCK_TIMEOUT' system/pitv-self-update
          grep -q 'stdout=subprocess.PIPE' system/pitv-self-update
          bash -n scripts/install-waydroid.sh
          grep -q 'getconf PAGESIZE' scripts/install-waydroid.sh
          grep -q '/proc/pressure' scripts/install-waydroid.sh
          bash -n tools/pitv-flasher.sh

      - name: Flasher dry run
        shell: bash
        run: |
          bash tools/pitv-flasher.sh --dry-run
          pwsh -NoProfile -File tools/pitv-flasher.ps1 -DryRun

      - name: Waydroid fallback snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/waydroid/noble
          test -s packages.env
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          for pkg in *.deb; do
            dpkg-deb --info "$pkg" >/dev/null
          done

      - name: Store JSON
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          for path in (
              "store/catalog.json",
              "store/server_catalog.json",
              "config/config.json",
          ):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)

          root = ET.parse("system/kodi/appliance.xml").getroot()
          values = {}
          for node in root.iter("setting"):
              default = node.find("default")
              if node.get("id") and default is not None:
                  values[node.get("id")] = (default.text or "").strip().lower()
          assert values["videoplayer.useprimedecoder"] == "true"
          assert values["videoplayer.useprimedecoderforhw"] == "true"
          print("Kodi DRM PRIME appliance defaults OK")
          PY

      - name: Runtime render with Ubuntu Pygame
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pygame
          PYTHONPATH=pitv SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            python3 - <<'PY'
          import time
          import pygame
          import pitv as pitv_module
          from queue import Queue
          from pitv import CECReader, LEGACY_ANDROID_PACKAGES, PiTV, VERSION

          assert VERSION == "1.5.0"

          # Regression: cec-ctl prints USER_CONTROL_PRESSED and ui-cmd on
          # separate lines. OK/Back must survive both decoded and raw formats.
          q = Queue()
          cec = CECReader(q)
          cec._handle_monitor_line("USER_CONTROL_PRESSED (0x44):\n")
          cec._handle_monitor_line("  ui-cmd: select (0x00)\n")
          assert q.get_nowait() == pygame.K_RETURN
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE

          # Back long-hold is a separate physical gesture from the raw-format
          # parser test above. Clear the prior gesture state first; otherwise
          # the deliberate 800 ms hold-continuity logic correctly treats this
          # next Back as the same held button and suppresses it.
          cec.clear_key_state()
          # The first Back is delivered once. Older TVs can repeat
          # press/release pairs while the button is held, so gesture duration
          # must survive a short release gap.
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          assert cec.gesture_key == pygame.K_ESCAPE
          cec.gesture_started_at = time.monotonic() - 3.1
          cec.gesture_last_seen_at = time.monotonic()
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.empty()
          assert cec.held_for(pygame.K_ESCAPE) >= 3.0
          cec.clear_key_state()
          assert cec.held_for(pygame.K_ESCAPE) == 0.0

          assert "com.stremio.one" in LEGACY_ANDROID_PACKAGES
          assert "com.plexapp.android" in LEGACY_ANDROID_PACKAGES

          # PiTV 1.4.10 regression contract: returning from an app must keep
          # one healthy CEC reader alive instead of replacing the kernel
          # monitor. The reader itself owns hotplug/reconnect recovery.
          class HealthyCEC:
              def __init__(self):
                  self.clears = 0
              def is_alive(self):
                  return True
              def is_ready(self):
                  return True
              def clear_key_state(self):
                  self.clears += 1

          probe = PiTV.__new__(PiTV)
          probe.cfg = {"cec_enabled": True}
          probe._cec_refreshing = False
          probe.cec_queue = Queue()
          healthy = HealthyCEC()
          probe.cec = healthy
          old_available = pitv_module.cec_available
          old_active_source = pitv_module.cec_active_source
          pitv_module.cec_available = lambda: True
          pitv_module.cec_active_source = lambda: (True, "test")
          try:
              probe._refresh_cec_after_return()
              deadline = time.monotonic() + 2.0
              while probe._cec_refreshing and time.monotonic() < deadline:
                  time.sleep(0.01)
              assert probe.cec is healthy
              assert healthy.clears == 1
              assert not probe._cec_refreshing
          finally:
              pitv_module.cec_available = old_available
              pitv_module.cec_active_source = old_active_source

          # Sencor/other TVs may expose the Home key as any CEC menu command.
          for raw_home in ("0a", "0c", "11"):
              cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
              cec._handle_monitor_line(f"> 01:44:{raw_home}\n")
              assert q.get_nowait() == pygame.K_HOME

          app = PiTV()

          # TV remote contract: Home remains optional multitasking on TVs that
          # have it, but 3-second Back is the universal EXIT for old remotes.
          demo_app = {"name": "Demo", "command": "demo-player"}
          demo_key = app._task_key(demo_app, "linux")
          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app.handle_key(pygame.K_HOME)
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key in app.background_tasks
          app.background_tasks.clear()

          # Every app exit converges on the same visible PiTV workspace.
          app.cfg["cec_enabled"] = False
          app.page = "settings"
          app._return_to_launcher("test", refresh_cec=False)
          assert app.page == "home"
          assert not app.sidebar_focus

          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app._keyboard_back_down_at = time.monotonic() - 3.1
          app._check_global_back_hold()
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key not in app.background_tasks

          # Regression: a legacy Android Stremio APK must stay removable and
          # must not be mistaken for today's native Linux Stremio Flatpak just
          # because both can share the same visible app name.
          legacy_stremio = {
              "name": "Stremio",
              "kind": "apk",
              "package": "com.stremio.legacy",
              "apk_path": "/home/pitv/PiTV/APKs/stremio-old.apk",
          }
          assert app.app_can_uninstall(legacy_stremio)
          assert app._store_item_for_app(legacy_stremio) is None
          native_stremio = {
              "name": "Stremio",
              "kind": "linux",
              "command": "flatpak run com.stremio.Stremio",
          }
          native_item = app._store_item_for_app(native_stremio)
          assert native_item
          assert native_item["installer"]["type"] == "flatpak"
          assert app.app_can_uninstall(native_stremio)

          # Built-in media runtimes have stable multitasking slots.
          kodi_app = {"name":"Kodi", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-launch"}
          plex_app = {"name":"Plex Player", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-addon run script.plexmod"}
          android_app = {"name":"SmartTube", "kind":"apk",
                         "package":"com.teamsmart.videomanager.tv"}
          assert app._task_key(kodi_app, "linux") == "kodi"
          assert app._task_key(plex_app, "linux") == "kodi"
          assert app._task_key(native_stremio, "linux") == "stremio"
          assert app._task_key(android_app, "apk") == (
              "android:com.teamsmart.videomanager.tv"
          )
          second_android = {
              "name": "Second APK", "kind": "apk",
              "package": "com.example.second",
          }
          assert app._task_key(second_android, "apk") != app._task_key(
              android_app, "apk"
          )
          assert app._workspace_for_app(kodi_app, "linux") == "Kodi"
          assert app._workspace_for_app(native_stremio, "linux") == "Stremio"
          assert app._workspace_for_app(android_app, "apk") == "Android"

          # Settings are OK-only: Right must not trigger a hidden
          # action. OK opens the visible list, then Up/Down + OK chooses.
          app.page = "appearance"
          app.sidebar_focus = False
          app.sub_selected = 2
          app.cfg["tile_scale"] = 1.15
          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.15) < 0.001
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Velikost dlaždic"
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.30) < 0.001

          # Theme selector exposes both values and can be cancelled with Back.
          app.sub_selected = 0
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # Regression: if a key relayed with wtype comes back into PiTV,
          # the external app no longer owns focus. Recover without wlrctl.
          app.external_kind = "linux"
          app.external_proc = None
          app._mark_relay_echo(pygame.K_LEFT)
          assert app._consume_relay_echo(pygame.K_LEFT)
          app._recover_external_focus()
          assert app.external_kind is None

          # Screensaver values use the same visible list model.
          app.page = "screensaver"
          app.sub_selected = 1
          app.cfg["screensaver_after_min"] = 1
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Spustit po"
          assert app.choice_options[app.choice_selected][1] == 1
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert app.cfg["screensaver_after_min"] == 2

          # PiTV 1.4.30: every section opened from Settings uses the
          # same three-column Settings list model; Updates exposes one
          # recommended action instead of a 10-card action grid.
          app.settings_context = True
          for detail_page in (
              "screensaver", "network", "audio", "cec", "apps",
              "server_store", "android", "updates", "system", "power", "about",
          ):
              app.page = detail_page
              app.draw()
              print("settings detail OK", detail_page)

          update_actions = app.update_items()
          assert len(update_actions) == 4
          assert update_actions[0][0] == "Aktualizovat vše"
          assert update_actions[1][0] == "Zkontrolovat aktualizace"
          assert update_actions[2][0] == "Pokročilé možnosti"
          assert app.system_items()[-1][0] == "Otevřít Aktualizace"
          assert hasattr(app, "_installed_store_flatpak_ids")
          assert hasattr(app, "_android_runtime_ready_file")
          assert hasattr(app, "android_key_queue")
          app.set_operation("Globální test", 42)
          app.page = "home"
          app.draw()
          assert app.operation_text == "Globální test"
          assert app.operation_progress == 42

          # PiTV 1.4.31 HDMI recovery contract. Dummy rendering must not try
          # to touch a real KMS/Wayland output, but the geometry helpers must
          # be present and safe.
          assert isinstance(app._desktop_size(), tuple)
          assert len(app._desktop_size()) == 2
          assert app._repair_fullscreen(force=True) is False
          assert hasattr(app, "android_pending_proc")
          assert app._android_ready_file().name == "pitv-waydroid-app-ready"

          # Application management is a fixed Settings menu. No Right
          # action is allowed; visibility and uninstall each open a list.
          app.apps = [dict(native_stremio), dict(legacy_stremio)]
          app.page = "apps"
          app.settings_context = True
          app.apps_selected = 1
          app_menu = app.app_items()
          assert [x["kind"] for x in app_menu] == [
              "store", "visibility", "uninstall", "refresh"
          ]
          assert app_menu[1]["name"] == "Zobrazení aplikací"
          assert app_menu[2]["name"] == "Odinstalovat aplikace"

          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active

          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Zobrazení aplikací"
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title in ("Stremio",)
          assert [x[1] for x in app.choice_options] == [True, False]
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          app.apps_selected = 2
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Odinstalovat aplikace"
          assert len(app.choice_options) >= 1
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # CEC and other configuration values must use a visible choice list,
          # not blind left/right toggling.
          app.page = "cec"
          app.open_cec_choice(1)
          assert app.choice_active
          assert app.choice_title == "Probudit TV při startu"
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active
          app.settings_context = False

          pages = (
              "home", "settings", "appearance", "screensaver", "network",
              "audio", "cec", "apps", "store", "server_store", "android",
              "updates", "system", "power", "about",
          )
          for theme in ("apple_dark", "apple_light"):
              app.cfg["theme"] = theme
              for page in pages:
                  app.page = page
                  app.draw()
                  print("render OK", theme, page)

          assert len(app.SETTINGS) == 12
          pygame.quit()
          print("PiTV runtime render OK", VERSION)
          PY

  windows-check:
    name: PiTV SD Installer Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer and engine
        shell: powershell
        run: |
          foreach ($file in @(
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1",
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              exit 1
            }
            Write-Host ("PowerShell syntax OK: " + $file)
          }

      - name: Verify live Ubuntu catalog
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -SelfTestCatalog

      - name: Compile native raw disk helper
        shell: powershell
        run: |
          Add-Type -Path "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs"
          if (-not ("PiTVNativeDisk" -as [type])) {
            throw "PiTVNativeDisk.cs did not compile."
          }
          if (-not ([PiTVNativeDisk].GetMethod("LockVolume"))) {
            throw "PiTVNativeDisk LockVolume helper is missing."
          }
          Write-Host "PiTVNativeDisk C# helper compiles"

      - name: Build lightweight PiTV XZ decoder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:RUNNER_TEMP "pitv-xz-build"

          cmake -S "$env:GITHUB_WORKSPACE\tools\windows\native" -B $build -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure for PiTV-XZ failed." }

          cmake --build $build --config Release --target PiTV-XZ
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ build failed." }

          $exe = Get-ChildItem $build -Recurse -Filter "PiTV-XZ.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "PiTV-XZ.exe was not produced." }

          $bin = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"
          Copy-Item $exe.FullName $bin -Force
          Write-Host ("Built " + $bin + " (" + $exe.Length + " bytes)")

      - name: Verify PiTV XZ extraction
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "pitv-xz-release-test"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $src = Join-Path $dir "sample.img"
          $xz = Join-Path $dir "sample.img.xz"
          $out = Join-Path $dir "expanded.img"
          $decoder = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"

          python -c "import lzma, pathlib, sys; data=bytes(range(256))*16384; pathlib.Path(sys.argv[1]).write_bytes(data); pathlib.Path(sys.argv[2]).write_bytes(lzma.compress(data, format=lzma.FORMAT_XZ))" "$src" "$xz"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create XZ test fixture." }

          & $decoder $xz $out
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ failed to expand the test image." }

          if ((Get-FileHash -Algorithm SHA256 $src).Hash -ne (Get-FileHash -Algorithm SHA256 $out).Hash) {
            throw "PiTV-XZ output is not byte-identical."
          }
          Write-Host "PiTV-XZ raw XZ extraction OK"

      - name: Verify PiTV writer contract
        shell: powershell
        run: |
          $installer = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -Raw
          $engine = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1" -Raw
          $native = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs" -Raw

          if ($installer -match "Ensure-Imager|Assert-ImagerCliContract|Invoke-ImagerWrite") {
            throw "Legacy Raspberry Pi Imager dependency is still present."
          }

          foreach ($required in @(
            "Get-PiTVOnlineImageFile",
            "Prepare-PiTVRawImage",
            "Write-PiTVRawImageToDisk",
            "Install-PiTVCloudInitToBootPartition"
          )) {
            if ($installer -notmatch [regex]::Escape($required)) {
              throw "Installer write flow is missing $required"
            }
          }

          foreach ($required in @(
            "PiTVNativeDisk",
            "PhysicalDrive",
            "CACHE HIT",
            "image_download_sha256",
            "Get-PiTVDeviceSha256",
            "Wait-PiTVTargetDiskReadyAfterRawWrite",
            "DiskPartRescan",
            "Write-PiTVBytesDurable",
            "FINALIZE RETRY",
            "PiTV-XZ.exe",
            "LockVolume"
          )) {
            if ($engine -notmatch [regex]::Escape($required)) {
              throw "Image engine is missing contract item $required"
            }
          }

          foreach ($required in @(
            "FSCTL_LOCK_VOLUME",
            "FSCTL_DISMOUNT_VOLUME",
            "LockAndDismount",
            "FlushFileBuffers",
            "FILE_FLAG_WRITE_THROUGH"
          )) {
            if ($native -notmatch [regex]::Escape($required)) {
              throw "Native disk helper is missing $required"
            }
          }

          Write-Host "PiTV raw writer/cache/volume-lock contract OK"

      - name: Upload PiTV XZ decoder
        uses: actions/upload-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows/PiTV-XZ.exe
          if-no-files-found: error
          retention-days: 1

      - name: Verify launcher target
        shell: powershell
        run: |
          $launcher = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\Start-PiTV-SD-Installer.cmd" -Raw
          if ($launcher -notmatch "PiTV-SD-Installer\.ps1") {
            throw "Launcher does not reference PiTV-SD-Installer.ps1"
          }
          Write-Host "Launcher target OK"

  release:
    name: Publish Alpha
    needs:
      - pitv-check
      - windows-check
    if: ${{ needs.pitv-check.result == 'success' && needs.windows-check.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PiTV XZ decoder
        uses: actions/download-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows

      - name: Release checks
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/windows/PiTV-XZ.exe
          test -s tools/windows/THIRD-PARTY-NOTICES.txt

          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-SD-Installer.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'
          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-ImageEngine.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p "dist/PiTV-SD-Installer-Windows"
          cp tools/windows/Start-PiTV-SD-Installer.cmd "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-SD-Installer.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-ImageEngine.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTVNativeDisk.cs "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-XZ.exe "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/THIRD-PARTY-NOTICES.txt "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/README.md "dist/PiTV-SD-Installer-Windows/README.md"
          cp LICENSE "dist/PiTV-SD-Installer-Windows/LICENSE"
          (
            cd dist
            zip -9 -r "PiTV-SD-Installer-Windows.zip" "PiTV-SD-Installer-Windows" >/dev/null
          )
          test -s dist/PiTV-SD-Installer-Windows.zip
          ls -lh dist/PiTV-SD-Installer-Windows.zip

      - name: Publish rolling Alpha release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f alpha "$GITHUB_SHA"
          git push -f origin refs/tags/alpha

          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          else
            gh release create alpha --target "$GITHUB_SHA" --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          fi

          while IFS= read -r asset; do
            if [ -n "$asset" ] && [ "$asset" != "PiTV-SD-Installer-Windows.zip" ]; then
              gh release delete-asset alpha "$asset" -y
            fi
          done < <(gh release view alpha --json assets --jq '.assets[].name')

          gh release upload alpha dist/PiTV-SD-Installer-Windows.zip --clobber
          gh release view alpha --json url,tagName,name,isDraft,isPrerelease,assets
 system/pitv-session
          ! grep -q 'wait -n' system/pitv-session
          ! grep -q 'for socket in.*wayland-' system/pitv-session
          grep -q 'pitv-wayland-display' system/pitv-session
          grep -q 'pitv-wayland-display' system/pitv-launcher-run
          grep -q 'pitv-wayland-display' system/pitv-android-warm
          ! grep -q 'for socket in.*wayland-' system/pitv-android-warm
          grep -q '^exec /usr/bin/python3 /opt/pitv/pitv/pitv.py          grep -q '^Requires=multi-user.target pitv-shell.service$' system/pitv.target
          grep -q '^AllowIsolate=yes$' system/pitv.target
          grep -q '^PAMName=login$' system/pitv-shell.service
          grep -q '^TTYPath=/dev/tty1$' system/pitv-shell.service
          grep -q '^Restart=always$' system/pitv-shell.service
          grep -q '^WantedBy=pitv.target$' system/pitv-shell.service
          grep -q '^Restart=always          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          ! grep -q 'start_android_warmer' system/pitv-launcher-run
          ! grep -q 'agetty --autologin' install.sh
          ! grep -q 'system/bash_profile /home/pitv/.bash_profile' install.sh
          grep -q 'systemctl set-default pitv.target' install.sh
          grep -q 'loginctl enable-linger pitv' install.sh
          grep -q 'systemctl mask getty@tty1.service' install.sh
          ! grep -q '"waydroid", "shell", "input"' pitv/pitv.py
          grep -q 'waydroid show-full-ui' system/pitv-waydroid-launch
          test "$(grep -c 'waydroid show-full-ui' system/pitv-waydroid-launch)" -eq 1
          grep -q 'pitv-waydroid-app-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-runtime-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          grep -q 'waydroid-app-visible' system/pitv-waydroid-launch
          grep -q 'waydroid-app-visible' system/pitv-helper
          grep -q 'waydroid-app-stop' system/pitv-helper
          grep -q 'waydroid-app-stop' pitv/pitv.py
          ! grep -q '\["waydroid", "session", "stop"\]' pitv/pitv.py
          grep -q 'android_key_queue' pitv/pitv.py
          grep -q 'One global activity banner' pitv/pitv.py
          grep -q 'persist.waydroid.multi_windows false' system/pitv-waydroid-launch
          grep -q 'exec cage -d' system/pitv-waydroid-launch
          grep -q 'labwc cage wtype' install.sh
          grep -q 'pitv-launcher-run' install.sh
          grep -q 'pitv-launcher.service' install.sh
          grep -q 'ExecStart=/usr/bin/systemctl restart pitv-shell.service' install.sh
          grep -q 'legacy-android-media-v2.done' pitv/pitv.py
          grep -q 'DPkg::Lock::Timeout' scripts/install-waydroid.sh
          grep -q 'identifier="wlroots"' system/labwc/rc.xml
          grep -q 'title="PiTV \*"' system/labwc/rc.xml
          grep -q 'SendToDesktop" to="Android" follow="no"' system/labwc/rc.xml
          grep -q '<name>PiTV</name>' system/labwc/rc.xml
          grep -q '<name>Kodi</name>' system/labwc/rc.xml
          grep -q '<name>Stremio</name>' system/labwc/rc.xml
          grep -q '<name>Android</name>' system/labwc/rc.xml
          grep -q 'GoToDesktop" to="PiTV"' system/labwc/rc.xml
          grep -q '"127".*KEYCODE_MEDIA_PAUSE' system/pitv-helper
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          ET.parse("system/labwc/rc.xml")
          print("labwc rc.xml OK")
          PYXML
          grep -q 'flatpak-uninstall' system/pitv-helper
          grep -q 'apt-remove' system/pitv-helper
          grep -q 'pitv-session-run' install.sh
          grep -q 'DPkg::Lock::Timeout=' install.sh
          grep -q -- '--no-update universe' install.sh
          grep -q 'DPkg::Lock::Timeout=600' system/pitv-helper
          grep -q 'APT_LOCK_TIMEOUT' system/pitv-self-update
          grep -q 'stdout=subprocess.PIPE' system/pitv-self-update
          bash -n scripts/install-waydroid.sh
          grep -q 'getconf PAGESIZE' scripts/install-waydroid.sh
          grep -q '/proc/pressure' scripts/install-waydroid.sh
          bash -n tools/pitv-flasher.sh

      - name: Flasher dry run
        shell: bash
        run: |
          bash tools/pitv-flasher.sh --dry-run
          pwsh -NoProfile -File tools/pitv-flasher.ps1 -DryRun

      - name: Waydroid fallback snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/waydroid/noble
          test -s packages.env
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          for pkg in *.deb; do
            dpkg-deb --info "$pkg" >/dev/null
          done

      - name: Store JSON
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          for path in (
              "store/catalog.json",
              "store/server_catalog.json",
              "config/config.json",
          ):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)

          root = ET.parse("system/kodi/appliance.xml").getroot()
          values = {}
          for node in root.iter("setting"):
              default = node.find("default")
              if node.get("id") and default is not None:
                  values[node.get("id")] = (default.text or "").strip().lower()
          assert values["videoplayer.useprimedecoder"] == "true"
          assert values["videoplayer.useprimedecoderforhw"] == "true"
          print("Kodi DRM PRIME appliance defaults OK")
          PY

      - name: Runtime render with Ubuntu Pygame
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pygame
          PYTHONPATH=pitv SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            python3 - <<'PY'
          import time
          import pygame
          import pitv as pitv_module
          from queue import Queue
          from pitv import CECReader, LEGACY_ANDROID_PACKAGES, PiTV, VERSION

          assert VERSION == "1.5.0"

          # Regression: cec-ctl prints USER_CONTROL_PRESSED and ui-cmd on
          # separate lines. OK/Back must survive both decoded and raw formats.
          q = Queue()
          cec = CECReader(q)
          cec._handle_monitor_line("USER_CONTROL_PRESSED (0x44):\n")
          cec._handle_monitor_line("  ui-cmd: select (0x00)\n")
          assert q.get_nowait() == pygame.K_RETURN
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE

          # Back long-hold is a separate physical gesture from the raw-format
          # parser test above. Clear the prior gesture state first; otherwise
          # the deliberate 800 ms hold-continuity logic correctly treats this
          # next Back as the same held button and suppresses it.
          cec.clear_key_state()
          # The first Back is delivered once. Older TVs can repeat
          # press/release pairs while the button is held, so gesture duration
          # must survive a short release gap.
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          assert cec.gesture_key == pygame.K_ESCAPE
          cec.gesture_started_at = time.monotonic() - 3.1
          cec.gesture_last_seen_at = time.monotonic()
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.empty()
          assert cec.held_for(pygame.K_ESCAPE) >= 3.0
          cec.clear_key_state()
          assert cec.held_for(pygame.K_ESCAPE) == 0.0

          assert "com.stremio.one" in LEGACY_ANDROID_PACKAGES
          assert "com.plexapp.android" in LEGACY_ANDROID_PACKAGES

          # PiTV 1.4.10 regression contract: returning from an app must keep
          # one healthy CEC reader alive instead of replacing the kernel
          # monitor. The reader itself owns hotplug/reconnect recovery.
          class HealthyCEC:
              def __init__(self):
                  self.clears = 0
              def is_alive(self):
                  return True
              def is_ready(self):
                  return True
              def clear_key_state(self):
                  self.clears += 1

          probe = PiTV.__new__(PiTV)
          probe.cfg = {"cec_enabled": True}
          probe._cec_refreshing = False
          probe.cec_queue = Queue()
          healthy = HealthyCEC()
          probe.cec = healthy
          old_available = pitv_module.cec_available
          old_active_source = pitv_module.cec_active_source
          pitv_module.cec_available = lambda: True
          pitv_module.cec_active_source = lambda: (True, "test")
          try:
              probe._refresh_cec_after_return()
              deadline = time.monotonic() + 2.0
              while probe._cec_refreshing and time.monotonic() < deadline:
                  time.sleep(0.01)
              assert probe.cec is healthy
              assert healthy.clears == 1
              assert not probe._cec_refreshing
          finally:
              pitv_module.cec_available = old_available
              pitv_module.cec_active_source = old_active_source

          # Sencor/other TVs may expose the Home key as any CEC menu command.
          for raw_home in ("0a", "0c", "11"):
              cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
              cec._handle_monitor_line(f"> 01:44:{raw_home}\n")
              assert q.get_nowait() == pygame.K_HOME

          app = PiTV()

          # TV remote contract: Home remains optional multitasking on TVs that
          # have it, but 3-second Back is the universal EXIT for old remotes.
          demo_app = {"name": "Demo", "command": "demo-player"}
          demo_key = app._task_key(demo_app, "linux")
          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app.handle_key(pygame.K_HOME)
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key in app.background_tasks
          app.background_tasks.clear()

          # Every app exit converges on the same visible PiTV workspace.
          app.cfg["cec_enabled"] = False
          app.page = "settings"
          app._return_to_launcher("test", refresh_cec=False)
          assert app.page == "home"
          assert not app.sidebar_focus

          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app._keyboard_back_down_at = time.monotonic() - 3.1
          app._check_global_back_hold()
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key not in app.background_tasks

          # Regression: a legacy Android Stremio APK must stay removable and
          # must not be mistaken for today's native Linux Stremio Flatpak just
          # because both can share the same visible app name.
          legacy_stremio = {
              "name": "Stremio",
              "kind": "apk",
              "package": "com.stremio.legacy",
              "apk_path": "/home/pitv/PiTV/APKs/stremio-old.apk",
          }
          assert app.app_can_uninstall(legacy_stremio)
          assert app._store_item_for_app(legacy_stremio) is None
          native_stremio = {
              "name": "Stremio",
              "kind": "linux",
              "command": "flatpak run com.stremio.Stremio",
          }
          native_item = app._store_item_for_app(native_stremio)
          assert native_item
          assert native_item["installer"]["type"] == "flatpak"
          assert app.app_can_uninstall(native_stremio)

          # Built-in media runtimes have stable multitasking slots.
          kodi_app = {"name":"Kodi", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-launch"}
          plex_app = {"name":"Plex Player", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-addon run script.plexmod"}
          android_app = {"name":"SmartTube", "kind":"apk",
                         "package":"com.teamsmart.videomanager.tv"}
          assert app._task_key(kodi_app, "linux") == "kodi"
          assert app._task_key(plex_app, "linux") == "kodi"
          assert app._task_key(native_stremio, "linux") == "stremio"
          assert app._task_key(android_app, "apk") == (
              "android:com.teamsmart.videomanager.tv"
          )
          second_android = {
              "name": "Second APK", "kind": "apk",
              "package": "com.example.second",
          }
          assert app._task_key(second_android, "apk") != app._task_key(
              android_app, "apk"
          )
          assert app._workspace_for_app(kodi_app, "linux") == "Kodi"
          assert app._workspace_for_app(native_stremio, "linux") == "Stremio"
          assert app._workspace_for_app(android_app, "apk") == "Android"

          # Settings are OK-only: Right must not trigger a hidden
          # action. OK opens the visible list, then Up/Down + OK chooses.
          app.page = "appearance"
          app.sidebar_focus = False
          app.sub_selected = 2
          app.cfg["tile_scale"] = 1.15
          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.15) < 0.001
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Velikost dlaždic"
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.30) < 0.001

          # Theme selector exposes both values and can be cancelled with Back.
          app.sub_selected = 0
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # Regression: if a key relayed with wtype comes back into PiTV,
          # the external app no longer owns focus. Recover without wlrctl.
          app.external_kind = "linux"
          app.external_proc = None
          app._mark_relay_echo(pygame.K_LEFT)
          assert app._consume_relay_echo(pygame.K_LEFT)
          app._recover_external_focus()
          assert app.external_kind is None

          # Screensaver values use the same visible list model.
          app.page = "screensaver"
          app.sub_selected = 1
          app.cfg["screensaver_after_min"] = 1
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Spustit po"
          assert app.choice_options[app.choice_selected][1] == 1
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert app.cfg["screensaver_after_min"] == 2

          # PiTV 1.4.30: every section opened from Settings uses the
          # same three-column Settings list model; Updates exposes one
          # recommended action instead of a 10-card action grid.
          app.settings_context = True
          for detail_page in (
              "screensaver", "network", "audio", "cec", "apps",
              "server_store", "android", "updates", "system", "power", "about",
          ):
              app.page = detail_page
              app.draw()
              print("settings detail OK", detail_page)

          update_actions = app.update_items()
          assert len(update_actions) == 4
          assert update_actions[0][0] == "Aktualizovat vše"
          assert update_actions[1][0] == "Zkontrolovat aktualizace"
          assert update_actions[2][0] == "Pokročilé možnosti"
          assert app.system_items()[-1][0] == "Otevřít Aktualizace"
          assert hasattr(app, "_installed_store_flatpak_ids")
          assert hasattr(app, "_android_runtime_ready_file")
          assert hasattr(app, "android_key_queue")
          app.set_operation("Globální test", 42)
          app.page = "home"
          app.draw()
          assert app.operation_text == "Globální test"
          assert app.operation_progress == 42

          # PiTV 1.4.31 HDMI recovery contract. Dummy rendering must not try
          # to touch a real KMS/Wayland output, but the geometry helpers must
          # be present and safe.
          assert isinstance(app._desktop_size(), tuple)
          assert len(app._desktop_size()) == 2
          assert app._repair_fullscreen(force=True) is False
          assert hasattr(app, "android_pending_proc")
          assert app._android_ready_file().name == "pitv-waydroid-app-ready"

          # Application management is a fixed Settings menu. No Right
          # action is allowed; visibility and uninstall each open a list.
          app.apps = [dict(native_stremio), dict(legacy_stremio)]
          app.page = "apps"
          app.settings_context = True
          app.apps_selected = 1
          app_menu = app.app_items()
          assert [x["kind"] for x in app_menu] == [
              "store", "visibility", "uninstall", "refresh"
          ]
          assert app_menu[1]["name"] == "Zobrazení aplikací"
          assert app_menu[2]["name"] == "Odinstalovat aplikace"

          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active

          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Zobrazení aplikací"
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title in ("Stremio",)
          assert [x[1] for x in app.choice_options] == [True, False]
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          app.apps_selected = 2
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Odinstalovat aplikace"
          assert len(app.choice_options) >= 1
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # CEC and other configuration values must use a visible choice list,
          # not blind left/right toggling.
          app.page = "cec"
          app.open_cec_choice(1)
          assert app.choice_active
          assert app.choice_title == "Probudit TV při startu"
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active
          app.settings_context = False

          pages = (
              "home", "settings", "appearance", "screensaver", "network",
              "audio", "cec", "apps", "store", "server_store", "android",
              "updates", "system", "power", "about",
          )
          for theme in ("apple_dark", "apple_light"):
              app.cfg["theme"] = theme
              for page in pages:
                  app.page = page
                  app.draw()
                  print("render OK", theme, page)

          assert len(app.SETTINGS) == 12
          pygame.quit()
          print("PiTV runtime render OK", VERSION)
          PY

  windows-check:
    name: PiTV SD Installer Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer and engine
        shell: powershell
        run: |
          foreach ($file in @(
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1",
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              exit 1
            }
            Write-Host ("PowerShell syntax OK: " + $file)
          }

      - name: Verify live Ubuntu catalog
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -SelfTestCatalog

      - name: Compile native raw disk helper
        shell: powershell
        run: |
          Add-Type -Path "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs"
          if (-not ("PiTVNativeDisk" -as [type])) {
            throw "PiTVNativeDisk.cs did not compile."
          }
          if (-not ([PiTVNativeDisk].GetMethod("LockVolume"))) {
            throw "PiTVNativeDisk LockVolume helper is missing."
          }
          Write-Host "PiTVNativeDisk C# helper compiles"

      - name: Build lightweight PiTV XZ decoder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:RUNNER_TEMP "pitv-xz-build"

          cmake -S "$env:GITHUB_WORKSPACE\tools\windows\native" -B $build -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure for PiTV-XZ failed." }

          cmake --build $build --config Release --target PiTV-XZ
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ build failed." }

          $exe = Get-ChildItem $build -Recurse -Filter "PiTV-XZ.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "PiTV-XZ.exe was not produced." }

          $bin = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"
          Copy-Item $exe.FullName $bin -Force
          Write-Host ("Built " + $bin + " (" + $exe.Length + " bytes)")

      - name: Verify PiTV XZ extraction
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "pitv-xz-release-test"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $src = Join-Path $dir "sample.img"
          $xz = Join-Path $dir "sample.img.xz"
          $out = Join-Path $dir "expanded.img"
          $decoder = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"

          python -c "import lzma, pathlib, sys; data=bytes(range(256))*16384; pathlib.Path(sys.argv[1]).write_bytes(data); pathlib.Path(sys.argv[2]).write_bytes(lzma.compress(data, format=lzma.FORMAT_XZ))" "$src" "$xz"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create XZ test fixture." }

          & $decoder $xz $out
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ failed to expand the test image." }

          if ((Get-FileHash -Algorithm SHA256 $src).Hash -ne (Get-FileHash -Algorithm SHA256 $out).Hash) {
            throw "PiTV-XZ output is not byte-identical."
          }
          Write-Host "PiTV-XZ raw XZ extraction OK"

      - name: Verify PiTV writer contract
        shell: powershell
        run: |
          $installer = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -Raw
          $engine = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1" -Raw
          $native = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs" -Raw

          if ($installer -match "Ensure-Imager|Assert-ImagerCliContract|Invoke-ImagerWrite") {
            throw "Legacy Raspberry Pi Imager dependency is still present."
          }

          foreach ($required in @(
            "Get-PiTVOnlineImageFile",
            "Prepare-PiTVRawImage",
            "Write-PiTVRawImageToDisk",
            "Install-PiTVCloudInitToBootPartition"
          )) {
            if ($installer -notmatch [regex]::Escape($required)) {
              throw "Installer write flow is missing $required"
            }
          }

          foreach ($required in @(
            "PiTVNativeDisk",
            "PhysicalDrive",
            "CACHE HIT",
            "image_download_sha256",
            "Get-PiTVDeviceSha256",
            "Wait-PiTVTargetDiskReadyAfterRawWrite",
            "DiskPartRescan",
            "Write-PiTVBytesDurable",
            "FINALIZE RETRY",
            "PiTV-XZ.exe",
            "LockVolume"
          )) {
            if ($engine -notmatch [regex]::Escape($required)) {
              throw "Image engine is missing contract item $required"
            }
          }

          foreach ($required in @(
            "FSCTL_LOCK_VOLUME",
            "FSCTL_DISMOUNT_VOLUME",
            "LockAndDismount",
            "FlushFileBuffers",
            "FILE_FLAG_WRITE_THROUGH"
          )) {
            if ($native -notmatch [regex]::Escape($required)) {
              throw "Native disk helper is missing $required"
            }
          }

          Write-Host "PiTV raw writer/cache/volume-lock contract OK"

      - name: Upload PiTV XZ decoder
        uses: actions/upload-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows/PiTV-XZ.exe
          if-no-files-found: error
          retention-days: 1

      - name: Verify launcher target
        shell: powershell
        run: |
          $launcher = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\Start-PiTV-SD-Installer.cmd" -Raw
          if ($launcher -notmatch "PiTV-SD-Installer\.ps1") {
            throw "Launcher does not reference PiTV-SD-Installer.ps1"
          }
          Write-Host "Launcher target OK"

  release:
    name: Publish Alpha
    needs:
      - pitv-check
      - windows-check
    if: ${{ needs.pitv-check.result == 'success' && needs.windows-check.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PiTV XZ decoder
        uses: actions/download-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows

      - name: Release checks
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/windows/PiTV-XZ.exe
          test -s tools/windows/THIRD-PARTY-NOTICES.txt

          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-SD-Installer.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'
          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-ImageEngine.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p "dist/PiTV-SD-Installer-Windows"
          cp tools/windows/Start-PiTV-SD-Installer.cmd "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-SD-Installer.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-ImageEngine.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTVNativeDisk.cs "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-XZ.exe "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/THIRD-PARTY-NOTICES.txt "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/README.md "dist/PiTV-SD-Installer-Windows/README.md"
          cp LICENSE "dist/PiTV-SD-Installer-Windows/LICENSE"
          (
            cd dist
            zip -9 -r "PiTV-SD-Installer-Windows.zip" "PiTV-SD-Installer-Windows" >/dev/null
          )
          test -s dist/PiTV-SD-Installer-Windows.zip
          ls -lh dist/PiTV-SD-Installer-Windows.zip

      - name: Publish rolling Alpha release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f alpha "$GITHUB_SHA"
          git push -f origin refs/tags/alpha

          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          else
            gh release create alpha --target "$GITHUB_SHA" --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          fi

          while IFS= read -r asset; do
            if [ -n "$asset" ] && [ "$asset" != "PiTV-SD-Installer-Windows.zip" ]; then
              gh release delete-asset alpha "$asset" -y
            fi
          done < <(gh release view alpha --json assets --jq '.assets[].name')

          gh release upload alpha dist/PiTV-SD-Installer-Windows.zip --clobber
          gh release view alpha --json url,tagName,name,isDraft,isPrerelease,assets
 system/pitv-launcher-run
          ! grep -q 'while .*STOPPING' system/pitv-launcher-run
          ! grep -q 'pitv-launcher-run' system/labwc/autostart
          grep -q '^Requires=multi-user.target pitv-shell.service$' system/pitv.target
          grep -q '^AllowIsolate=yes$' system/pitv.target
          grep -q '^PAMName=login$' system/pitv-shell.service
          grep -q '^TTYPath=/dev/tty1$' system/pitv-shell.service
          grep -q '^Restart=always$' system/pitv-shell.service
          grep -q '^WantedBy=pitv.target$' system/pitv-shell.service
          grep -q '^Restart=always$' system/pitv-android-warm.service
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          ! grep -q 'start_android_warmer' system/pitv-launcher-run
          ! grep -q 'agetty --autologin' install.sh
          ! grep -q 'system/bash_profile /home/pitv/.bash_profile' install.sh
          grep -q 'systemctl set-default pitv.target' install.sh
          grep -q 'systemctl mask getty@tty1.service' install.sh
          ! grep -q '"waydroid", "shell", "input"' pitv/pitv.py
          grep -q 'waydroid show-full-ui' system/pitv-waydroid-launch
          test "$(grep -c 'waydroid show-full-ui' system/pitv-waydroid-launch)" -eq 1
          grep -q 'pitv-waydroid-app-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-runtime-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          grep -q 'waydroid-app-visible' system/pitv-waydroid-launch
          grep -q 'waydroid-app-visible' system/pitv-helper
          grep -q 'waydroid-app-stop' system/pitv-helper
          grep -q 'waydroid-app-stop' pitv/pitv.py
          ! grep -q '\["waydroid", "session", "stop"\]' pitv/pitv.py
          grep -q 'android_key_queue' pitv/pitv.py
          grep -q 'One global activity banner' pitv/pitv.py
          grep -q 'persist.waydroid.multi_windows false' system/pitv-waydroid-launch
          grep -q 'exec cage -d' system/pitv-waydroid-launch
          grep -q 'labwc cage wtype' install.sh
          grep -q 'pitv-launcher-run' install.sh
          grep -q 'pitv-launcher.service' install.sh
          grep -q 'ExecStart=/usr/bin/systemctl restart pitv-shell.service' install.sh
          grep -q 'legacy-android-media-v2.done' pitv/pitv.py
          grep -q 'DPkg::Lock::Timeout' scripts/install-waydroid.sh
          grep -q 'identifier="wlroots"' system/labwc/rc.xml
          grep -q 'title="PiTV \*"' system/labwc/rc.xml
          grep -q 'SendToDesktop" to="Android" follow="no"' system/labwc/rc.xml
          grep -q '<name>PiTV</name>' system/labwc/rc.xml
          grep -q '<name>Kodi</name>' system/labwc/rc.xml
          grep -q '<name>Stremio</name>' system/labwc/rc.xml
          grep -q '<name>Android</name>' system/labwc/rc.xml
          grep -q 'GoToDesktop" to="PiTV"' system/labwc/rc.xml
          grep -q '"127".*KEYCODE_MEDIA_PAUSE' system/pitv-helper
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          ET.parse("system/labwc/rc.xml")
          print("labwc rc.xml OK")
          PYXML
          grep -q 'flatpak-uninstall' system/pitv-helper
          grep -q 'apt-remove' system/pitv-helper
          grep -q 'pitv-session-run' install.sh
          grep -q 'DPkg::Lock::Timeout=' install.sh
          grep -q -- '--no-update universe' install.sh
          grep -q 'DPkg::Lock::Timeout=600' system/pitv-helper
          grep -q 'APT_LOCK_TIMEOUT' system/pitv-self-update
          grep -q 'stdout=subprocess.PIPE' system/pitv-self-update
          bash -n scripts/install-waydroid.sh
          grep -q 'getconf PAGESIZE' scripts/install-waydroid.sh
          grep -q '/proc/pressure' scripts/install-waydroid.sh
          bash -n tools/pitv-flasher.sh

      - name: Flasher dry run
        shell: bash
        run: |
          bash tools/pitv-flasher.sh --dry-run
          pwsh -NoProfile -File tools/pitv-flasher.ps1 -DryRun

      - name: Waydroid fallback snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/waydroid/noble
          test -s packages.env
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          for pkg in *.deb; do
            dpkg-deb --info "$pkg" >/dev/null
          done

      - name: Store JSON
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          for path in (
              "store/catalog.json",
              "store/server_catalog.json",
              "config/config.json",
          ):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)

          root = ET.parse("system/kodi/appliance.xml").getroot()
          values = {}
          for node in root.iter("setting"):
              default = node.find("default")
              if node.get("id") and default is not None:
                  values[node.get("id")] = (default.text or "").strip().lower()
          assert values["videoplayer.useprimedecoder"] == "true"
          assert values["videoplayer.useprimedecoderforhw"] == "true"
          print("Kodi DRM PRIME appliance defaults OK")
          PY

      - name: Runtime render with Ubuntu Pygame
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pygame
          PYTHONPATH=pitv SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            python3 - <<'PY'
          import time
          import pygame
          import pitv as pitv_module
          from queue import Queue
          from pitv import CECReader, LEGACY_ANDROID_PACKAGES, PiTV, VERSION

          assert VERSION == "1.5.0"

          # Regression: cec-ctl prints USER_CONTROL_PRESSED and ui-cmd on
          # separate lines. OK/Back must survive both decoded and raw formats.
          q = Queue()
          cec = CECReader(q)
          cec._handle_monitor_line("USER_CONTROL_PRESSED (0x44):\n")
          cec._handle_monitor_line("  ui-cmd: select (0x00)\n")
          assert q.get_nowait() == pygame.K_RETURN
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE

          # Back long-hold is a separate physical gesture from the raw-format
          # parser test above. Clear the prior gesture state first; otherwise
          # the deliberate 800 ms hold-continuity logic correctly treats this
          # next Back as the same held button and suppresses it.
          cec.clear_key_state()
          # The first Back is delivered once. Older TVs can repeat
          # press/release pairs while the button is held, so gesture duration
          # must survive a short release gap.
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          assert cec.gesture_key == pygame.K_ESCAPE
          cec.gesture_started_at = time.monotonic() - 3.1
          cec.gesture_last_seen_at = time.monotonic()
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.empty()
          assert cec.held_for(pygame.K_ESCAPE) >= 3.0
          cec.clear_key_state()
          assert cec.held_for(pygame.K_ESCAPE) == 0.0

          assert "com.stremio.one" in LEGACY_ANDROID_PACKAGES
          assert "com.plexapp.android" in LEGACY_ANDROID_PACKAGES

          # PiTV 1.4.10 regression contract: returning from an app must keep
          # one healthy CEC reader alive instead of replacing the kernel
          # monitor. The reader itself owns hotplug/reconnect recovery.
          class HealthyCEC:
              def __init__(self):
                  self.clears = 0
              def is_alive(self):
                  return True
              def is_ready(self):
                  return True
              def clear_key_state(self):
                  self.clears += 1

          probe = PiTV.__new__(PiTV)
          probe.cfg = {"cec_enabled": True}
          probe._cec_refreshing = False
          probe.cec_queue = Queue()
          healthy = HealthyCEC()
          probe.cec = healthy
          old_available = pitv_module.cec_available
          old_active_source = pitv_module.cec_active_source
          pitv_module.cec_available = lambda: True
          pitv_module.cec_active_source = lambda: (True, "test")
          try:
              probe._refresh_cec_after_return()
              deadline = time.monotonic() + 2.0
              while probe._cec_refreshing and time.monotonic() < deadline:
                  time.sleep(0.01)
              assert probe.cec is healthy
              assert healthy.clears == 1
              assert not probe._cec_refreshing
          finally:
              pitv_module.cec_available = old_available
              pitv_module.cec_active_source = old_active_source

          # Sencor/other TVs may expose the Home key as any CEC menu command.
          for raw_home in ("0a", "0c", "11"):
              cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
              cec._handle_monitor_line(f"> 01:44:{raw_home}\n")
              assert q.get_nowait() == pygame.K_HOME

          app = PiTV()

          # TV remote contract: Home remains optional multitasking on TVs that
          # have it, but 3-second Back is the universal EXIT for old remotes.
          demo_app = {"name": "Demo", "command": "demo-player"}
          demo_key = app._task_key(demo_app, "linux")
          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app.handle_key(pygame.K_HOME)
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key in app.background_tasks
          app.background_tasks.clear()

          # Every app exit converges on the same visible PiTV workspace.
          app.cfg["cec_enabled"] = False
          app.page = "settings"
          app._return_to_launcher("test", refresh_cec=False)
          assert app.page == "home"
          assert not app.sidebar_focus

          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app._keyboard_back_down_at = time.monotonic() - 3.1
          app._check_global_back_hold()
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key not in app.background_tasks

          # Regression: a legacy Android Stremio APK must stay removable and
          # must not be mistaken for today's native Linux Stremio Flatpak just
          # because both can share the same visible app name.
          legacy_stremio = {
              "name": "Stremio",
              "kind": "apk",
              "package": "com.stremio.legacy",
              "apk_path": "/home/pitv/PiTV/APKs/stremio-old.apk",
          }
          assert app.app_can_uninstall(legacy_stremio)
          assert app._store_item_for_app(legacy_stremio) is None
          native_stremio = {
              "name": "Stremio",
              "kind": "linux",
              "command": "flatpak run com.stremio.Stremio",
          }
          native_item = app._store_item_for_app(native_stremio)
          assert native_item
          assert native_item["installer"]["type"] == "flatpak"
          assert app.app_can_uninstall(native_stremio)

          # Built-in media runtimes have stable multitasking slots.
          kodi_app = {"name":"Kodi", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-launch"}
          plex_app = {"name":"Plex Player", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-addon run script.plexmod"}
          android_app = {"name":"SmartTube", "kind":"apk",
                         "package":"com.teamsmart.videomanager.tv"}
          assert app._task_key(kodi_app, "linux") == "kodi"
          assert app._task_key(plex_app, "linux") == "kodi"
          assert app._task_key(native_stremio, "linux") == "stremio"
          assert app._task_key(android_app, "apk") == (
              "android:com.teamsmart.videomanager.tv"
          )
          second_android = {
              "name": "Second APK", "kind": "apk",
              "package": "com.example.second",
          }
          assert app._task_key(second_android, "apk") != app._task_key(
              android_app, "apk"
          )
          assert app._workspace_for_app(kodi_app, "linux") == "Kodi"
          assert app._workspace_for_app(native_stremio, "linux") == "Stremio"
          assert app._workspace_for_app(android_app, "apk") == "Android"

          # Settings are OK-only: Right must not trigger a hidden
          # action. OK opens the visible list, then Up/Down + OK chooses.
          app.page = "appearance"
          app.sidebar_focus = False
          app.sub_selected = 2
          app.cfg["tile_scale"] = 1.15
          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.15) < 0.001
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Velikost dlaždic"
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.30) < 0.001

          # Theme selector exposes both values and can be cancelled with Back.
          app.sub_selected = 0
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # Regression: if a key relayed with wtype comes back into PiTV,
          # the external app no longer owns focus. Recover without wlrctl.
          app.external_kind = "linux"
          app.external_proc = None
          app._mark_relay_echo(pygame.K_LEFT)
          assert app._consume_relay_echo(pygame.K_LEFT)
          app._recover_external_focus()
          assert app.external_kind is None

          # Screensaver values use the same visible list model.
          app.page = "screensaver"
          app.sub_selected = 1
          app.cfg["screensaver_after_min"] = 1
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Spustit po"
          assert app.choice_options[app.choice_selected][1] == 1
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert app.cfg["screensaver_after_min"] == 2

          # PiTV 1.4.30: every section opened from Settings uses the
          # same three-column Settings list model; Updates exposes one
          # recommended action instead of a 10-card action grid.
          app.settings_context = True
          for detail_page in (
              "screensaver", "network", "audio", "cec", "apps",
              "server_store", "android", "updates", "system", "power", "about",
          ):
              app.page = detail_page
              app.draw()
              print("settings detail OK", detail_page)

          update_actions = app.update_items()
          assert len(update_actions) == 4
          assert update_actions[0][0] == "Aktualizovat vše"
          assert update_actions[1][0] == "Zkontrolovat aktualizace"
          assert update_actions[2][0] == "Pokročilé možnosti"
          assert app.system_items()[-1][0] == "Otevřít Aktualizace"
          assert hasattr(app, "_installed_store_flatpak_ids")
          assert hasattr(app, "_android_runtime_ready_file")
          assert hasattr(app, "android_key_queue")
          app.set_operation("Globální test", 42)
          app.page = "home"
          app.draw()
          assert app.operation_text == "Globální test"
          assert app.operation_progress == 42

          # PiTV 1.4.31 HDMI recovery contract. Dummy rendering must not try
          # to touch a real KMS/Wayland output, but the geometry helpers must
          # be present and safe.
          assert isinstance(app._desktop_size(), tuple)
          assert len(app._desktop_size()) == 2
          assert app._repair_fullscreen(force=True) is False
          assert hasattr(app, "android_pending_proc")
          assert app._android_ready_file().name == "pitv-waydroid-app-ready"

          # Application management is a fixed Settings menu. No Right
          # action is allowed; visibility and uninstall each open a list.
          app.apps = [dict(native_stremio), dict(legacy_stremio)]
          app.page = "apps"
          app.settings_context = True
          app.apps_selected = 1
          app_menu = app.app_items()
          assert [x["kind"] for x in app_menu] == [
              "store", "visibility", "uninstall", "refresh"
          ]
          assert app_menu[1]["name"] == "Zobrazení aplikací"
          assert app_menu[2]["name"] == "Odinstalovat aplikace"

          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active

          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Zobrazení aplikací"
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title in ("Stremio",)
          assert [x[1] for x in app.choice_options] == [True, False]
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          app.apps_selected = 2
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Odinstalovat aplikace"
          assert len(app.choice_options) >= 1
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # CEC and other configuration values must use a visible choice list,
          # not blind left/right toggling.
          app.page = "cec"
          app.open_cec_choice(1)
          assert app.choice_active
          assert app.choice_title == "Probudit TV při startu"
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active
          app.settings_context = False

          pages = (
              "home", "settings", "appearance", "screensaver", "network",
              "audio", "cec", "apps", "store", "server_store", "android",
              "updates", "system", "power", "about",
          )
          for theme in ("apple_dark", "apple_light"):
              app.cfg["theme"] = theme
              for page in pages:
                  app.page = page
                  app.draw()
                  print("render OK", theme, page)

          assert len(app.SETTINGS) == 12
          pygame.quit()
          print("PiTV runtime render OK", VERSION)
          PY

  windows-check:
    name: PiTV SD Installer Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer and engine
        shell: powershell
        run: |
          foreach ($file in @(
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1",
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              exit 1
            }
            Write-Host ("PowerShell syntax OK: " + $file)
          }

      - name: Verify live Ubuntu catalog
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -SelfTestCatalog

      - name: Compile native raw disk helper
        shell: powershell
        run: |
          Add-Type -Path "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs"
          if (-not ("PiTVNativeDisk" -as [type])) {
            throw "PiTVNativeDisk.cs did not compile."
          }
          if (-not ([PiTVNativeDisk].GetMethod("LockVolume"))) {
            throw "PiTVNativeDisk LockVolume helper is missing."
          }
          Write-Host "PiTVNativeDisk C# helper compiles"

      - name: Build lightweight PiTV XZ decoder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:RUNNER_TEMP "pitv-xz-build"

          cmake -S "$env:GITHUB_WORKSPACE\tools\windows\native" -B $build -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure for PiTV-XZ failed." }

          cmake --build $build --config Release --target PiTV-XZ
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ build failed." }

          $exe = Get-ChildItem $build -Recurse -Filter "PiTV-XZ.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "PiTV-XZ.exe was not produced." }

          $bin = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"
          Copy-Item $exe.FullName $bin -Force
          Write-Host ("Built " + $bin + " (" + $exe.Length + " bytes)")

      - name: Verify PiTV XZ extraction
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "pitv-xz-release-test"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $src = Join-Path $dir "sample.img"
          $xz = Join-Path $dir "sample.img.xz"
          $out = Join-Path $dir "expanded.img"
          $decoder = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"

          python -c "import lzma, pathlib, sys; data=bytes(range(256))*16384; pathlib.Path(sys.argv[1]).write_bytes(data); pathlib.Path(sys.argv[2]).write_bytes(lzma.compress(data, format=lzma.FORMAT_XZ))" "$src" "$xz"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create XZ test fixture." }

          & $decoder $xz $out
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ failed to expand the test image." }

          if ((Get-FileHash -Algorithm SHA256 $src).Hash -ne (Get-FileHash -Algorithm SHA256 $out).Hash) {
            throw "PiTV-XZ output is not byte-identical."
          }
          Write-Host "PiTV-XZ raw XZ extraction OK"

      - name: Verify PiTV writer contract
        shell: powershell
        run: |
          $installer = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -Raw
          $engine = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1" -Raw
          $native = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs" -Raw

          if ($installer -match "Ensure-Imager|Assert-ImagerCliContract|Invoke-ImagerWrite") {
            throw "Legacy Raspberry Pi Imager dependency is still present."
          }

          foreach ($required in @(
            "Get-PiTVOnlineImageFile",
            "Prepare-PiTVRawImage",
            "Write-PiTVRawImageToDisk",
            "Install-PiTVCloudInitToBootPartition"
          )) {
            if ($installer -notmatch [regex]::Escape($required)) {
              throw "Installer write flow is missing $required"
            }
          }

          foreach ($required in @(
            "PiTVNativeDisk",
            "PhysicalDrive",
            "CACHE HIT",
            "image_download_sha256",
            "Get-PiTVDeviceSha256",
            "Wait-PiTVTargetDiskReadyAfterRawWrite",
            "DiskPartRescan",
            "Write-PiTVBytesDurable",
            "FINALIZE RETRY",
            "PiTV-XZ.exe",
            "LockVolume"
          )) {
            if ($engine -notmatch [regex]::Escape($required)) {
              throw "Image engine is missing contract item $required"
            }
          }

          foreach ($required in @(
            "FSCTL_LOCK_VOLUME",
            "FSCTL_DISMOUNT_VOLUME",
            "LockAndDismount",
            "FlushFileBuffers",
            "FILE_FLAG_WRITE_THROUGH"
          )) {
            if ($native -notmatch [regex]::Escape($required)) {
              throw "Native disk helper is missing $required"
            }
          }

          Write-Host "PiTV raw writer/cache/volume-lock contract OK"

      - name: Upload PiTV XZ decoder
        uses: actions/upload-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows/PiTV-XZ.exe
          if-no-files-found: error
          retention-days: 1

      - name: Verify launcher target
        shell: powershell
        run: |
          $launcher = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\Start-PiTV-SD-Installer.cmd" -Raw
          if ($launcher -notmatch "PiTV-SD-Installer\.ps1") {
            throw "Launcher does not reference PiTV-SD-Installer.ps1"
          }
          Write-Host "Launcher target OK"

  release:
    name: Publish Alpha
    needs:
      - pitv-check
      - windows-check
    if: ${{ needs.pitv-check.result == 'success' && needs.windows-check.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PiTV XZ decoder
        uses: actions/download-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows

      - name: Release checks
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/windows/PiTV-XZ.exe
          test -s tools/windows/THIRD-PARTY-NOTICES.txt

          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-SD-Installer.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'
          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-ImageEngine.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p "dist/PiTV-SD-Installer-Windows"
          cp tools/windows/Start-PiTV-SD-Installer.cmd "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-SD-Installer.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-ImageEngine.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTVNativeDisk.cs "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-XZ.exe "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/THIRD-PARTY-NOTICES.txt "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/README.md "dist/PiTV-SD-Installer-Windows/README.md"
          cp LICENSE "dist/PiTV-SD-Installer-Windows/LICENSE"
          (
            cd dist
            zip -9 -r "PiTV-SD-Installer-Windows.zip" "PiTV-SD-Installer-Windows" >/dev/null
          )
          test -s dist/PiTV-SD-Installer-Windows.zip
          ls -lh dist/PiTV-SD-Installer-Windows.zip

      - name: Publish rolling Alpha release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f alpha "$GITHUB_SHA"
          git push -f origin refs/tags/alpha

          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          else
            gh release create alpha --target "$GITHUB_SHA" --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          fi

          while IFS= read -r asset; do
            if [ -n "$asset" ] && [ "$asset" != "PiTV-SD-Installer-Windows.zip" ]; then
              gh release delete-asset alpha "$asset" -y
            fi
          done < <(gh release view alpha --json assets --jq '.assets[].name')

          gh release upload alpha dist/PiTV-SD-Installer-Windows.zip --clobber
          gh release view alpha --json url,tagName,name,isDraft,isPrerelease,assets
 system/pitv-android-warm.service
          grep -q '^Wants=pitv-shell.service          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          ! grep -q 'start_android_warmer' system/pitv-launcher-run
          ! grep -q 'agetty --autologin' install.sh
          ! grep -q 'system/bash_profile /home/pitv/.bash_profile' install.sh
          grep -q 'systemctl set-default pitv.target' install.sh
          grep -q 'systemctl mask getty@tty1.service' install.sh
          ! grep -q '"waydroid", "shell", "input"' pitv/pitv.py
          grep -q 'waydroid show-full-ui' system/pitv-waydroid-launch
          test "$(grep -c 'waydroid show-full-ui' system/pitv-waydroid-launch)" -eq 1
          grep -q 'pitv-waydroid-app-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-runtime-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          grep -q 'waydroid-app-visible' system/pitv-waydroid-launch
          grep -q 'waydroid-app-visible' system/pitv-helper
          grep -q 'waydroid-app-stop' system/pitv-helper
          grep -q 'waydroid-app-stop' pitv/pitv.py
          ! grep -q '\["waydroid", "session", "stop"\]' pitv/pitv.py
          grep -q 'android_key_queue' pitv/pitv.py
          grep -q 'One global activity banner' pitv/pitv.py
          grep -q 'persist.waydroid.multi_windows false' system/pitv-waydroid-launch
          grep -q 'exec cage -d' system/pitv-waydroid-launch
          grep -q 'labwc cage wtype' install.sh
          grep -q 'pitv-launcher-run' install.sh
          grep -q 'pitv-launcher.service' install.sh
          grep -q 'ExecStart=/usr/bin/systemctl restart pitv-shell.service' install.sh
          grep -q 'legacy-android-media-v2.done' pitv/pitv.py
          grep -q 'DPkg::Lock::Timeout' scripts/install-waydroid.sh
          grep -q 'identifier="wlroots"' system/labwc/rc.xml
          grep -q 'title="PiTV \*"' system/labwc/rc.xml
          grep -q 'SendToDesktop" to="Android" follow="no"' system/labwc/rc.xml
          grep -q '<name>PiTV</name>' system/labwc/rc.xml
          grep -q '<name>Kodi</name>' system/labwc/rc.xml
          grep -q '<name>Stremio</name>' system/labwc/rc.xml
          grep -q '<name>Android</name>' system/labwc/rc.xml
          grep -q 'GoToDesktop" to="PiTV"' system/labwc/rc.xml
          grep -q '"127".*KEYCODE_MEDIA_PAUSE' system/pitv-helper
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          ET.parse("system/labwc/rc.xml")
          print("labwc rc.xml OK")
          PYXML
          grep -q 'flatpak-uninstall' system/pitv-helper
          grep -q 'apt-remove' system/pitv-helper
          grep -q 'pitv-session-run' install.sh
          grep -q 'DPkg::Lock::Timeout=' install.sh
          grep -q -- '--no-update universe' install.sh
          grep -q 'DPkg::Lock::Timeout=600' system/pitv-helper
          grep -q 'APT_LOCK_TIMEOUT' system/pitv-self-update
          grep -q 'stdout=subprocess.PIPE' system/pitv-self-update
          bash -n scripts/install-waydroid.sh
          grep -q 'getconf PAGESIZE' scripts/install-waydroid.sh
          grep -q '/proc/pressure' scripts/install-waydroid.sh
          bash -n tools/pitv-flasher.sh

      - name: Flasher dry run
        shell: bash
        run: |
          bash tools/pitv-flasher.sh --dry-run
          pwsh -NoProfile -File tools/pitv-flasher.ps1 -DryRun

      - name: Waydroid fallback snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/waydroid/noble
          test -s packages.env
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          for pkg in *.deb; do
            dpkg-deb --info "$pkg" >/dev/null
          done

      - name: Store JSON
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          for path in (
              "store/catalog.json",
              "store/server_catalog.json",
              "config/config.json",
          ):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)

          root = ET.parse("system/kodi/appliance.xml").getroot()
          values = {}
          for node in root.iter("setting"):
              default = node.find("default")
              if node.get("id") and default is not None:
                  values[node.get("id")] = (default.text or "").strip().lower()
          assert values["videoplayer.useprimedecoder"] == "true"
          assert values["videoplayer.useprimedecoderforhw"] == "true"
          print("Kodi DRM PRIME appliance defaults OK")
          PY

      - name: Runtime render with Ubuntu Pygame
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pygame
          PYTHONPATH=pitv SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            python3 - <<'PY'
          import time
          import pygame
          import pitv as pitv_module
          from queue import Queue
          from pitv import CECReader, LEGACY_ANDROID_PACKAGES, PiTV, VERSION

          assert VERSION == "1.5.0"

          # Regression: cec-ctl prints USER_CONTROL_PRESSED and ui-cmd on
          # separate lines. OK/Back must survive both decoded and raw formats.
          q = Queue()
          cec = CECReader(q)
          cec._handle_monitor_line("USER_CONTROL_PRESSED (0x44):\n")
          cec._handle_monitor_line("  ui-cmd: select (0x00)\n")
          assert q.get_nowait() == pygame.K_RETURN
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE

          # Back long-hold is a separate physical gesture from the raw-format
          # parser test above. Clear the prior gesture state first; otherwise
          # the deliberate 800 ms hold-continuity logic correctly treats this
          # next Back as the same held button and suppresses it.
          cec.clear_key_state()
          # The first Back is delivered once. Older TVs can repeat
          # press/release pairs while the button is held, so gesture duration
          # must survive a short release gap.
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          assert cec.gesture_key == pygame.K_ESCAPE
          cec.gesture_started_at = time.monotonic() - 3.1
          cec.gesture_last_seen_at = time.monotonic()
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.empty()
          assert cec.held_for(pygame.K_ESCAPE) >= 3.0
          cec.clear_key_state()
          assert cec.held_for(pygame.K_ESCAPE) == 0.0

          assert "com.stremio.one" in LEGACY_ANDROID_PACKAGES
          assert "com.plexapp.android" in LEGACY_ANDROID_PACKAGES

          # PiTV 1.4.10 regression contract: returning from an app must keep
          # one healthy CEC reader alive instead of replacing the kernel
          # monitor. The reader itself owns hotplug/reconnect recovery.
          class HealthyCEC:
              def __init__(self):
                  self.clears = 0
              def is_alive(self):
                  return True
              def is_ready(self):
                  return True
              def clear_key_state(self):
                  self.clears += 1

          probe = PiTV.__new__(PiTV)
          probe.cfg = {"cec_enabled": True}
          probe._cec_refreshing = False
          probe.cec_queue = Queue()
          healthy = HealthyCEC()
          probe.cec = healthy
          old_available = pitv_module.cec_available
          old_active_source = pitv_module.cec_active_source
          pitv_module.cec_available = lambda: True
          pitv_module.cec_active_source = lambda: (True, "test")
          try:
              probe._refresh_cec_after_return()
              deadline = time.monotonic() + 2.0
              while probe._cec_refreshing and time.monotonic() < deadline:
                  time.sleep(0.01)
              assert probe.cec is healthy
              assert healthy.clears == 1
              assert not probe._cec_refreshing
          finally:
              pitv_module.cec_available = old_available
              pitv_module.cec_active_source = old_active_source

          # Sencor/other TVs may expose the Home key as any CEC menu command.
          for raw_home in ("0a", "0c", "11"):
              cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
              cec._handle_monitor_line(f"> 01:44:{raw_home}\n")
              assert q.get_nowait() == pygame.K_HOME

          app = PiTV()

          # TV remote contract: Home remains optional multitasking on TVs that
          # have it, but 3-second Back is the universal EXIT for old remotes.
          demo_app = {"name": "Demo", "command": "demo-player"}
          demo_key = app._task_key(demo_app, "linux")
          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app.handle_key(pygame.K_HOME)
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key in app.background_tasks
          app.background_tasks.clear()

          # Every app exit converges on the same visible PiTV workspace.
          app.cfg["cec_enabled"] = False
          app.page = "settings"
          app._return_to_launcher("test", refresh_cec=False)
          assert app.page == "home"
          assert not app.sidebar_focus

          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app._keyboard_back_down_at = time.monotonic() - 3.1
          app._check_global_back_hold()
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key not in app.background_tasks

          # Regression: a legacy Android Stremio APK must stay removable and
          # must not be mistaken for today's native Linux Stremio Flatpak just
          # because both can share the same visible app name.
          legacy_stremio = {
              "name": "Stremio",
              "kind": "apk",
              "package": "com.stremio.legacy",
              "apk_path": "/home/pitv/PiTV/APKs/stremio-old.apk",
          }
          assert app.app_can_uninstall(legacy_stremio)
          assert app._store_item_for_app(legacy_stremio) is None
          native_stremio = {
              "name": "Stremio",
              "kind": "linux",
              "command": "flatpak run com.stremio.Stremio",
          }
          native_item = app._store_item_for_app(native_stremio)
          assert native_item
          assert native_item["installer"]["type"] == "flatpak"
          assert app.app_can_uninstall(native_stremio)

          # Built-in media runtimes have stable multitasking slots.
          kodi_app = {"name":"Kodi", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-launch"}
          plex_app = {"name":"Plex Player", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-addon run script.plexmod"}
          android_app = {"name":"SmartTube", "kind":"apk",
                         "package":"com.teamsmart.videomanager.tv"}
          assert app._task_key(kodi_app, "linux") == "kodi"
          assert app._task_key(plex_app, "linux") == "kodi"
          assert app._task_key(native_stremio, "linux") == "stremio"
          assert app._task_key(android_app, "apk") == (
              "android:com.teamsmart.videomanager.tv"
          )
          second_android = {
              "name": "Second APK", "kind": "apk",
              "package": "com.example.second",
          }
          assert app._task_key(second_android, "apk") != app._task_key(
              android_app, "apk"
          )
          assert app._workspace_for_app(kodi_app, "linux") == "Kodi"
          assert app._workspace_for_app(native_stremio, "linux") == "Stremio"
          assert app._workspace_for_app(android_app, "apk") == "Android"

          # Settings are OK-only: Right must not trigger a hidden
          # action. OK opens the visible list, then Up/Down + OK chooses.
          app.page = "appearance"
          app.sidebar_focus = False
          app.sub_selected = 2
          app.cfg["tile_scale"] = 1.15
          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.15) < 0.001
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Velikost dlaždic"
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.30) < 0.001

          # Theme selector exposes both values and can be cancelled with Back.
          app.sub_selected = 0
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # Regression: if a key relayed with wtype comes back into PiTV,
          # the external app no longer owns focus. Recover without wlrctl.
          app.external_kind = "linux"
          app.external_proc = None
          app._mark_relay_echo(pygame.K_LEFT)
          assert app._consume_relay_echo(pygame.K_LEFT)
          app._recover_external_focus()
          assert app.external_kind is None

          # Screensaver values use the same visible list model.
          app.page = "screensaver"
          app.sub_selected = 1
          app.cfg["screensaver_after_min"] = 1
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Spustit po"
          assert app.choice_options[app.choice_selected][1] == 1
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert app.cfg["screensaver_after_min"] == 2

          # PiTV 1.4.30: every section opened from Settings uses the
          # same three-column Settings list model; Updates exposes one
          # recommended action instead of a 10-card action grid.
          app.settings_context = True
          for detail_page in (
              "screensaver", "network", "audio", "cec", "apps",
              "server_store", "android", "updates", "system", "power", "about",
          ):
              app.page = detail_page
              app.draw()
              print("settings detail OK", detail_page)

          update_actions = app.update_items()
          assert len(update_actions) == 4
          assert update_actions[0][0] == "Aktualizovat vše"
          assert update_actions[1][0] == "Zkontrolovat aktualizace"
          assert update_actions[2][0] == "Pokročilé možnosti"
          assert app.system_items()[-1][0] == "Otevřít Aktualizace"
          assert hasattr(app, "_installed_store_flatpak_ids")
          assert hasattr(app, "_android_runtime_ready_file")
          assert hasattr(app, "android_key_queue")
          app.set_operation("Globální test", 42)
          app.page = "home"
          app.draw()
          assert app.operation_text == "Globální test"
          assert app.operation_progress == 42

          # PiTV 1.4.31 HDMI recovery contract. Dummy rendering must not try
          # to touch a real KMS/Wayland output, but the geometry helpers must
          # be present and safe.
          assert isinstance(app._desktop_size(), tuple)
          assert len(app._desktop_size()) == 2
          assert app._repair_fullscreen(force=True) is False
          assert hasattr(app, "android_pending_proc")
          assert app._android_ready_file().name == "pitv-waydroid-app-ready"

          # Application management is a fixed Settings menu. No Right
          # action is allowed; visibility and uninstall each open a list.
          app.apps = [dict(native_stremio), dict(legacy_stremio)]
          app.page = "apps"
          app.settings_context = True
          app.apps_selected = 1
          app_menu = app.app_items()
          assert [x["kind"] for x in app_menu] == [
              "store", "visibility", "uninstall", "refresh"
          ]
          assert app_menu[1]["name"] == "Zobrazení aplikací"
          assert app_menu[2]["name"] == "Odinstalovat aplikace"

          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active

          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Zobrazení aplikací"
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title in ("Stremio",)
          assert [x[1] for x in app.choice_options] == [True, False]
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          app.apps_selected = 2
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Odinstalovat aplikace"
          assert len(app.choice_options) >= 1
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # CEC and other configuration values must use a visible choice list,
          # not blind left/right toggling.
          app.page = "cec"
          app.open_cec_choice(1)
          assert app.choice_active
          assert app.choice_title == "Probudit TV při startu"
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active
          app.settings_context = False

          pages = (
              "home", "settings", "appearance", "screensaver", "network",
              "audio", "cec", "apps", "store", "server_store", "android",
              "updates", "system", "power", "about",
          )
          for theme in ("apple_dark", "apple_light"):
              app.cfg["theme"] = theme
              for page in pages:
                  app.page = page
                  app.draw()
                  print("render OK", theme, page)

          assert len(app.SETTINGS) == 12
          pygame.quit()
          print("PiTV runtime render OK", VERSION)
          PY

  windows-check:
    name: PiTV SD Installer Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer and engine
        shell: powershell
        run: |
          foreach ($file in @(
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1",
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              exit 1
            }
            Write-Host ("PowerShell syntax OK: " + $file)
          }

      - name: Verify live Ubuntu catalog
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -SelfTestCatalog

      - name: Compile native raw disk helper
        shell: powershell
        run: |
          Add-Type -Path "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs"
          if (-not ("PiTVNativeDisk" -as [type])) {
            throw "PiTVNativeDisk.cs did not compile."
          }
          if (-not ([PiTVNativeDisk].GetMethod("LockVolume"))) {
            throw "PiTVNativeDisk LockVolume helper is missing."
          }
          Write-Host "PiTVNativeDisk C# helper compiles"

      - name: Build lightweight PiTV XZ decoder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:RUNNER_TEMP "pitv-xz-build"

          cmake -S "$env:GITHUB_WORKSPACE\tools\windows\native" -B $build -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure for PiTV-XZ failed." }

          cmake --build $build --config Release --target PiTV-XZ
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ build failed." }

          $exe = Get-ChildItem $build -Recurse -Filter "PiTV-XZ.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "PiTV-XZ.exe was not produced." }

          $bin = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"
          Copy-Item $exe.FullName $bin -Force
          Write-Host ("Built " + $bin + " (" + $exe.Length + " bytes)")

      - name: Verify PiTV XZ extraction
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "pitv-xz-release-test"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $src = Join-Path $dir "sample.img"
          $xz = Join-Path $dir "sample.img.xz"
          $out = Join-Path $dir "expanded.img"
          $decoder = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"

          python -c "import lzma, pathlib, sys; data=bytes(range(256))*16384; pathlib.Path(sys.argv[1]).write_bytes(data); pathlib.Path(sys.argv[2]).write_bytes(lzma.compress(data, format=lzma.FORMAT_XZ))" "$src" "$xz"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create XZ test fixture." }

          & $decoder $xz $out
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ failed to expand the test image." }

          if ((Get-FileHash -Algorithm SHA256 $src).Hash -ne (Get-FileHash -Algorithm SHA256 $out).Hash) {
            throw "PiTV-XZ output is not byte-identical."
          }
          Write-Host "PiTV-XZ raw XZ extraction OK"

      - name: Verify PiTV writer contract
        shell: powershell
        run: |
          $installer = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -Raw
          $engine = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1" -Raw
          $native = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs" -Raw

          if ($installer -match "Ensure-Imager|Assert-ImagerCliContract|Invoke-ImagerWrite") {
            throw "Legacy Raspberry Pi Imager dependency is still present."
          }

          foreach ($required in @(
            "Get-PiTVOnlineImageFile",
            "Prepare-PiTVRawImage",
            "Write-PiTVRawImageToDisk",
            "Install-PiTVCloudInitToBootPartition"
          )) {
            if ($installer -notmatch [regex]::Escape($required)) {
              throw "Installer write flow is missing $required"
            }
          }

          foreach ($required in @(
            "PiTVNativeDisk",
            "PhysicalDrive",
            "CACHE HIT",
            "image_download_sha256",
            "Get-PiTVDeviceSha256",
            "Wait-PiTVTargetDiskReadyAfterRawWrite",
            "DiskPartRescan",
            "Write-PiTVBytesDurable",
            "FINALIZE RETRY",
            "PiTV-XZ.exe",
            "LockVolume"
          )) {
            if ($engine -notmatch [regex]::Escape($required)) {
              throw "Image engine is missing contract item $required"
            }
          }

          foreach ($required in @(
            "FSCTL_LOCK_VOLUME",
            "FSCTL_DISMOUNT_VOLUME",
            "LockAndDismount",
            "FlushFileBuffers",
            "FILE_FLAG_WRITE_THROUGH"
          )) {
            if ($native -notmatch [regex]::Escape($required)) {
              throw "Native disk helper is missing $required"
            }
          }

          Write-Host "PiTV raw writer/cache/volume-lock contract OK"

      - name: Upload PiTV XZ decoder
        uses: actions/upload-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows/PiTV-XZ.exe
          if-no-files-found: error
          retention-days: 1

      - name: Verify launcher target
        shell: powershell
        run: |
          $launcher = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\Start-PiTV-SD-Installer.cmd" -Raw
          if ($launcher -notmatch "PiTV-SD-Installer\.ps1") {
            throw "Launcher does not reference PiTV-SD-Installer.ps1"
          }
          Write-Host "Launcher target OK"

  release:
    name: Publish Alpha
    needs:
      - pitv-check
      - windows-check
    if: ${{ needs.pitv-check.result == 'success' && needs.windows-check.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PiTV XZ decoder
        uses: actions/download-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows

      - name: Release checks
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/windows/PiTV-XZ.exe
          test -s tools/windows/THIRD-PARTY-NOTICES.txt

          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-SD-Installer.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'
          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-ImageEngine.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p "dist/PiTV-SD-Installer-Windows"
          cp tools/windows/Start-PiTV-SD-Installer.cmd "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-SD-Installer.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-ImageEngine.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTVNativeDisk.cs "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-XZ.exe "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/THIRD-PARTY-NOTICES.txt "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/README.md "dist/PiTV-SD-Installer-Windows/README.md"
          cp LICENSE "dist/PiTV-SD-Installer-Windows/LICENSE"
          (
            cd dist
            zip -9 -r "PiTV-SD-Installer-Windows.zip" "PiTV-SD-Installer-Windows" >/dev/null
          )
          test -s dist/PiTV-SD-Installer-Windows.zip
          ls -lh dist/PiTV-SD-Installer-Windows.zip

      - name: Publish rolling Alpha release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f alpha "$GITHUB_SHA"
          git push -f origin refs/tags/alpha

          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          else
            gh release create alpha --target "$GITHUB_SHA" --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          fi

          while IFS= read -r asset; do
            if [ -n "$asset" ] && [ "$asset" != "PiTV-SD-Installer-Windows.zip" ]; then
              gh release delete-asset alpha "$asset" -y
            fi
          done < <(gh release view alpha --json assets --jq '.assets[].name')

          gh release upload alpha dist/PiTV-SD-Installer-Windows.zip --clobber
          gh release view alpha --json url,tagName,name,isDraft,isPrerelease,assets
 system/pitv-launcher-run
          ! grep -q 'while .*STOPPING' system/pitv-launcher-run
          ! grep -q 'pitv-launcher-run' system/labwc/autostart
          grep -q '^Requires=multi-user.target pitv-shell.service$' system/pitv.target
          grep -q '^AllowIsolate=yes$' system/pitv.target
          grep -q '^PAMName=login$' system/pitv-shell.service
          grep -q '^TTYPath=/dev/tty1$' system/pitv-shell.service
          grep -q '^Restart=always$' system/pitv-shell.service
          grep -q '^WantedBy=pitv.target$' system/pitv-shell.service
          grep -q '^Restart=always$' system/pitv-android-warm.service
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          ! grep -q 'start_android_warmer' system/pitv-launcher-run
          ! grep -q 'agetty --autologin' install.sh
          ! grep -q 'system/bash_profile /home/pitv/.bash_profile' install.sh
          grep -q 'systemctl set-default pitv.target' install.sh
          grep -q 'systemctl mask getty@tty1.service' install.sh
          ! grep -q '"waydroid", "shell", "input"' pitv/pitv.py
          grep -q 'waydroid show-full-ui' system/pitv-waydroid-launch
          test "$(grep -c 'waydroid show-full-ui' system/pitv-waydroid-launch)" -eq 1
          grep -q 'pitv-waydroid-app-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-runtime-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          grep -q 'waydroid-app-visible' system/pitv-waydroid-launch
          grep -q 'waydroid-app-visible' system/pitv-helper
          grep -q 'waydroid-app-stop' system/pitv-helper
          grep -q 'waydroid-app-stop' pitv/pitv.py
          ! grep -q '\["waydroid", "session", "stop"\]' pitv/pitv.py
          grep -q 'android_key_queue' pitv/pitv.py
          grep -q 'One global activity banner' pitv/pitv.py
          grep -q 'persist.waydroid.multi_windows false' system/pitv-waydroid-launch
          grep -q 'exec cage -d' system/pitv-waydroid-launch
          grep -q 'labwc cage wtype' install.sh
          grep -q 'pitv-launcher-run' install.sh
          grep -q 'pitv-launcher.service' install.sh
          grep -q 'ExecStart=/usr/bin/systemctl restart pitv-shell.service' install.sh
          grep -q 'legacy-android-media-v2.done' pitv/pitv.py
          grep -q 'DPkg::Lock::Timeout' scripts/install-waydroid.sh
          grep -q 'identifier="wlroots"' system/labwc/rc.xml
          grep -q 'title="PiTV \*"' system/labwc/rc.xml
          grep -q 'SendToDesktop" to="Android" follow="no"' system/labwc/rc.xml
          grep -q '<name>PiTV</name>' system/labwc/rc.xml
          grep -q '<name>Kodi</name>' system/labwc/rc.xml
          grep -q '<name>Stremio</name>' system/labwc/rc.xml
          grep -q '<name>Android</name>' system/labwc/rc.xml
          grep -q 'GoToDesktop" to="PiTV"' system/labwc/rc.xml
          grep -q '"127".*KEYCODE_MEDIA_PAUSE' system/pitv-helper
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          ET.parse("system/labwc/rc.xml")
          print("labwc rc.xml OK")
          PYXML
          grep -q 'flatpak-uninstall' system/pitv-helper
          grep -q 'apt-remove' system/pitv-helper
          grep -q 'pitv-session-run' install.sh
          grep -q 'DPkg::Lock::Timeout=' install.sh
          grep -q -- '--no-update universe' install.sh
          grep -q 'DPkg::Lock::Timeout=600' system/pitv-helper
          grep -q 'APT_LOCK_TIMEOUT' system/pitv-self-update
          grep -q 'stdout=subprocess.PIPE' system/pitv-self-update
          bash -n scripts/install-waydroid.sh
          grep -q 'getconf PAGESIZE' scripts/install-waydroid.sh
          grep -q '/proc/pressure' scripts/install-waydroid.sh
          bash -n tools/pitv-flasher.sh

      - name: Flasher dry run
        shell: bash
        run: |
          bash tools/pitv-flasher.sh --dry-run
          pwsh -NoProfile -File tools/pitv-flasher.ps1 -DryRun

      - name: Waydroid fallback snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/waydroid/noble
          test -s packages.env
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          for pkg in *.deb; do
            dpkg-deb --info "$pkg" >/dev/null
          done

      - name: Store JSON
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          for path in (
              "store/catalog.json",
              "store/server_catalog.json",
              "config/config.json",
          ):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)

          root = ET.parse("system/kodi/appliance.xml").getroot()
          values = {}
          for node in root.iter("setting"):
              default = node.find("default")
              if node.get("id") and default is not None:
                  values[node.get("id")] = (default.text or "").strip().lower()
          assert values["videoplayer.useprimedecoder"] == "true"
          assert values["videoplayer.useprimedecoderforhw"] == "true"
          print("Kodi DRM PRIME appliance defaults OK")
          PY

      - name: Runtime render with Ubuntu Pygame
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pygame
          PYTHONPATH=pitv SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            python3 - <<'PY'
          import time
          import pygame
          import pitv as pitv_module
          from queue import Queue
          from pitv import CECReader, LEGACY_ANDROID_PACKAGES, PiTV, VERSION

          assert VERSION == "1.5.0"

          # Regression: cec-ctl prints USER_CONTROL_PRESSED and ui-cmd on
          # separate lines. OK/Back must survive both decoded and raw formats.
          q = Queue()
          cec = CECReader(q)
          cec._handle_monitor_line("USER_CONTROL_PRESSED (0x44):\n")
          cec._handle_monitor_line("  ui-cmd: select (0x00)\n")
          assert q.get_nowait() == pygame.K_RETURN
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE

          # Back long-hold is a separate physical gesture from the raw-format
          # parser test above. Clear the prior gesture state first; otherwise
          # the deliberate 800 ms hold-continuity logic correctly treats this
          # next Back as the same held button and suppresses it.
          cec.clear_key_state()
          # The first Back is delivered once. Older TVs can repeat
          # press/release pairs while the button is held, so gesture duration
          # must survive a short release gap.
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          assert cec.gesture_key == pygame.K_ESCAPE
          cec.gesture_started_at = time.monotonic() - 3.1
          cec.gesture_last_seen_at = time.monotonic()
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.empty()
          assert cec.held_for(pygame.K_ESCAPE) >= 3.0
          cec.clear_key_state()
          assert cec.held_for(pygame.K_ESCAPE) == 0.0

          assert "com.stremio.one" in LEGACY_ANDROID_PACKAGES
          assert "com.plexapp.android" in LEGACY_ANDROID_PACKAGES

          # PiTV 1.4.10 regression contract: returning from an app must keep
          # one healthy CEC reader alive instead of replacing the kernel
          # monitor. The reader itself owns hotplug/reconnect recovery.
          class HealthyCEC:
              def __init__(self):
                  self.clears = 0
              def is_alive(self):
                  return True
              def is_ready(self):
                  return True
              def clear_key_state(self):
                  self.clears += 1

          probe = PiTV.__new__(PiTV)
          probe.cfg = {"cec_enabled": True}
          probe._cec_refreshing = False
          probe.cec_queue = Queue()
          healthy = HealthyCEC()
          probe.cec = healthy
          old_available = pitv_module.cec_available
          old_active_source = pitv_module.cec_active_source
          pitv_module.cec_available = lambda: True
          pitv_module.cec_active_source = lambda: (True, "test")
          try:
              probe._refresh_cec_after_return()
              deadline = time.monotonic() + 2.0
              while probe._cec_refreshing and time.monotonic() < deadline:
                  time.sleep(0.01)
              assert probe.cec is healthy
              assert healthy.clears == 1
              assert not probe._cec_refreshing
          finally:
              pitv_module.cec_available = old_available
              pitv_module.cec_active_source = old_active_source

          # Sencor/other TVs may expose the Home key as any CEC menu command.
          for raw_home in ("0a", "0c", "11"):
              cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
              cec._handle_monitor_line(f"> 01:44:{raw_home}\n")
              assert q.get_nowait() == pygame.K_HOME

          app = PiTV()

          # TV remote contract: Home remains optional multitasking on TVs that
          # have it, but 3-second Back is the universal EXIT for old remotes.
          demo_app = {"name": "Demo", "command": "demo-player"}
          demo_key = app._task_key(demo_app, "linux")
          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app.handle_key(pygame.K_HOME)
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key in app.background_tasks
          app.background_tasks.clear()

          # Every app exit converges on the same visible PiTV workspace.
          app.cfg["cec_enabled"] = False
          app.page = "settings"
          app._return_to_launcher("test", refresh_cec=False)
          assert app.page == "home"
          assert not app.sidebar_focus

          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app._keyboard_back_down_at = time.monotonic() - 3.1
          app._check_global_back_hold()
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key not in app.background_tasks

          # Regression: a legacy Android Stremio APK must stay removable and
          # must not be mistaken for today's native Linux Stremio Flatpak just
          # because both can share the same visible app name.
          legacy_stremio = {
              "name": "Stremio",
              "kind": "apk",
              "package": "com.stremio.legacy",
              "apk_path": "/home/pitv/PiTV/APKs/stremio-old.apk",
          }
          assert app.app_can_uninstall(legacy_stremio)
          assert app._store_item_for_app(legacy_stremio) is None
          native_stremio = {
              "name": "Stremio",
              "kind": "linux",
              "command": "flatpak run com.stremio.Stremio",
          }
          native_item = app._store_item_for_app(native_stremio)
          assert native_item
          assert native_item["installer"]["type"] == "flatpak"
          assert app.app_can_uninstall(native_stremio)

          # Built-in media runtimes have stable multitasking slots.
          kodi_app = {"name":"Kodi", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-launch"}
          plex_app = {"name":"Plex Player", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-addon run script.plexmod"}
          android_app = {"name":"SmartTube", "kind":"apk",
                         "package":"com.teamsmart.videomanager.tv"}
          assert app._task_key(kodi_app, "linux") == "kodi"
          assert app._task_key(plex_app, "linux") == "kodi"
          assert app._task_key(native_stremio, "linux") == "stremio"
          assert app._task_key(android_app, "apk") == (
              "android:com.teamsmart.videomanager.tv"
          )
          second_android = {
              "name": "Second APK", "kind": "apk",
              "package": "com.example.second",
          }
          assert app._task_key(second_android, "apk") != app._task_key(
              android_app, "apk"
          )
          assert app._workspace_for_app(kodi_app, "linux") == "Kodi"
          assert app._workspace_for_app(native_stremio, "linux") == "Stremio"
          assert app._workspace_for_app(android_app, "apk") == "Android"

          # Settings are OK-only: Right must not trigger a hidden
          # action. OK opens the visible list, then Up/Down + OK chooses.
          app.page = "appearance"
          app.sidebar_focus = False
          app.sub_selected = 2
          app.cfg["tile_scale"] = 1.15
          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.15) < 0.001
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Velikost dlaždic"
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.30) < 0.001

          # Theme selector exposes both values and can be cancelled with Back.
          app.sub_selected = 0
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # Regression: if a key relayed with wtype comes back into PiTV,
          # the external app no longer owns focus. Recover without wlrctl.
          app.external_kind = "linux"
          app.external_proc = None
          app._mark_relay_echo(pygame.K_LEFT)
          assert app._consume_relay_echo(pygame.K_LEFT)
          app._recover_external_focus()
          assert app.external_kind is None

          # Screensaver values use the same visible list model.
          app.page = "screensaver"
          app.sub_selected = 1
          app.cfg["screensaver_after_min"] = 1
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Spustit po"
          assert app.choice_options[app.choice_selected][1] == 1
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert app.cfg["screensaver_after_min"] == 2

          # PiTV 1.4.30: every section opened from Settings uses the
          # same three-column Settings list model; Updates exposes one
          # recommended action instead of a 10-card action grid.
          app.settings_context = True
          for detail_page in (
              "screensaver", "network", "audio", "cec", "apps",
              "server_store", "android", "updates", "system", "power", "about",
          ):
              app.page = detail_page
              app.draw()
              print("settings detail OK", detail_page)

          update_actions = app.update_items()
          assert len(update_actions) == 4
          assert update_actions[0][0] == "Aktualizovat vše"
          assert update_actions[1][0] == "Zkontrolovat aktualizace"
          assert update_actions[2][0] == "Pokročilé možnosti"
          assert app.system_items()[-1][0] == "Otevřít Aktualizace"
          assert hasattr(app, "_installed_store_flatpak_ids")
          assert hasattr(app, "_android_runtime_ready_file")
          assert hasattr(app, "android_key_queue")
          app.set_operation("Globální test", 42)
          app.page = "home"
          app.draw()
          assert app.operation_text == "Globální test"
          assert app.operation_progress == 42

          # PiTV 1.4.31 HDMI recovery contract. Dummy rendering must not try
          # to touch a real KMS/Wayland output, but the geometry helpers must
          # be present and safe.
          assert isinstance(app._desktop_size(), tuple)
          assert len(app._desktop_size()) == 2
          assert app._repair_fullscreen(force=True) is False
          assert hasattr(app, "android_pending_proc")
          assert app._android_ready_file().name == "pitv-waydroid-app-ready"

          # Application management is a fixed Settings menu. No Right
          # action is allowed; visibility and uninstall each open a list.
          app.apps = [dict(native_stremio), dict(legacy_stremio)]
          app.page = "apps"
          app.settings_context = True
          app.apps_selected = 1
          app_menu = app.app_items()
          assert [x["kind"] for x in app_menu] == [
              "store", "visibility", "uninstall", "refresh"
          ]
          assert app_menu[1]["name"] == "Zobrazení aplikací"
          assert app_menu[2]["name"] == "Odinstalovat aplikace"

          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active

          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Zobrazení aplikací"
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title in ("Stremio",)
          assert [x[1] for x in app.choice_options] == [True, False]
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          app.apps_selected = 2
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Odinstalovat aplikace"
          assert len(app.choice_options) >= 1
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # CEC and other configuration values must use a visible choice list,
          # not blind left/right toggling.
          app.page = "cec"
          app.open_cec_choice(1)
          assert app.choice_active
          assert app.choice_title == "Probudit TV při startu"
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active
          app.settings_context = False

          pages = (
              "home", "settings", "appearance", "screensaver", "network",
              "audio", "cec", "apps", "store", "server_store", "android",
              "updates", "system", "power", "about",
          )
          for theme in ("apple_dark", "apple_light"):
              app.cfg["theme"] = theme
              for page in pages:
                  app.page = page
                  app.draw()
                  print("render OK", theme, page)

          assert len(app.SETTINGS) == 12
          pygame.quit()
          print("PiTV runtime render OK", VERSION)
          PY

  windows-check:
    name: PiTV SD Installer Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer and engine
        shell: powershell
        run: |
          foreach ($file in @(
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1",
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              exit 1
            }
            Write-Host ("PowerShell syntax OK: " + $file)
          }

      - name: Verify live Ubuntu catalog
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -SelfTestCatalog

      - name: Compile native raw disk helper
        shell: powershell
        run: |
          Add-Type -Path "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs"
          if (-not ("PiTVNativeDisk" -as [type])) {
            throw "PiTVNativeDisk.cs did not compile."
          }
          if (-not ([PiTVNativeDisk].GetMethod("LockVolume"))) {
            throw "PiTVNativeDisk LockVolume helper is missing."
          }
          Write-Host "PiTVNativeDisk C# helper compiles"

      - name: Build lightweight PiTV XZ decoder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:RUNNER_TEMP "pitv-xz-build"

          cmake -S "$env:GITHUB_WORKSPACE\tools\windows\native" -B $build -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure for PiTV-XZ failed." }

          cmake --build $build --config Release --target PiTV-XZ
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ build failed." }

          $exe = Get-ChildItem $build -Recurse -Filter "PiTV-XZ.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "PiTV-XZ.exe was not produced." }

          $bin = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"
          Copy-Item $exe.FullName $bin -Force
          Write-Host ("Built " + $bin + " (" + $exe.Length + " bytes)")

      - name: Verify PiTV XZ extraction
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "pitv-xz-release-test"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $src = Join-Path $dir "sample.img"
          $xz = Join-Path $dir "sample.img.xz"
          $out = Join-Path $dir "expanded.img"
          $decoder = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"

          python -c "import lzma, pathlib, sys; data=bytes(range(256))*16384; pathlib.Path(sys.argv[1]).write_bytes(data); pathlib.Path(sys.argv[2]).write_bytes(lzma.compress(data, format=lzma.FORMAT_XZ))" "$src" "$xz"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create XZ test fixture." }

          & $decoder $xz $out
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ failed to expand the test image." }

          if ((Get-FileHash -Algorithm SHA256 $src).Hash -ne (Get-FileHash -Algorithm SHA256 $out).Hash) {
            throw "PiTV-XZ output is not byte-identical."
          }
          Write-Host "PiTV-XZ raw XZ extraction OK"

      - name: Verify PiTV writer contract
        shell: powershell
        run: |
          $installer = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -Raw
          $engine = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1" -Raw
          $native = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs" -Raw

          if ($installer -match "Ensure-Imager|Assert-ImagerCliContract|Invoke-ImagerWrite") {
            throw "Legacy Raspberry Pi Imager dependency is still present."
          }

          foreach ($required in @(
            "Get-PiTVOnlineImageFile",
            "Prepare-PiTVRawImage",
            "Write-PiTVRawImageToDisk",
            "Install-PiTVCloudInitToBootPartition"
          )) {
            if ($installer -notmatch [regex]::Escape($required)) {
              throw "Installer write flow is missing $required"
            }
          }

          foreach ($required in @(
            "PiTVNativeDisk",
            "PhysicalDrive",
            "CACHE HIT",
            "image_download_sha256",
            "Get-PiTVDeviceSha256",
            "Wait-PiTVTargetDiskReadyAfterRawWrite",
            "DiskPartRescan",
            "Write-PiTVBytesDurable",
            "FINALIZE RETRY",
            "PiTV-XZ.exe",
            "LockVolume"
          )) {
            if ($engine -notmatch [regex]::Escape($required)) {
              throw "Image engine is missing contract item $required"
            }
          }

          foreach ($required in @(
            "FSCTL_LOCK_VOLUME",
            "FSCTL_DISMOUNT_VOLUME",
            "LockAndDismount",
            "FlushFileBuffers",
            "FILE_FLAG_WRITE_THROUGH"
          )) {
            if ($native -notmatch [regex]::Escape($required)) {
              throw "Native disk helper is missing $required"
            }
          }

          Write-Host "PiTV raw writer/cache/volume-lock contract OK"

      - name: Upload PiTV XZ decoder
        uses: actions/upload-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows/PiTV-XZ.exe
          if-no-files-found: error
          retention-days: 1

      - name: Verify launcher target
        shell: powershell
        run: |
          $launcher = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\Start-PiTV-SD-Installer.cmd" -Raw
          if ($launcher -notmatch "PiTV-SD-Installer\.ps1") {
            throw "Launcher does not reference PiTV-SD-Installer.ps1"
          }
          Write-Host "Launcher target OK"

  release:
    name: Publish Alpha
    needs:
      - pitv-check
      - windows-check
    if: ${{ needs.pitv-check.result == 'success' && needs.windows-check.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PiTV XZ decoder
        uses: actions/download-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows

      - name: Release checks
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/windows/PiTV-XZ.exe
          test -s tools/windows/THIRD-PARTY-NOTICES.txt

          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-SD-Installer.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'
          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-ImageEngine.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p "dist/PiTV-SD-Installer-Windows"
          cp tools/windows/Start-PiTV-SD-Installer.cmd "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-SD-Installer.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-ImageEngine.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTVNativeDisk.cs "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-XZ.exe "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/THIRD-PARTY-NOTICES.txt "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/README.md "dist/PiTV-SD-Installer-Windows/README.md"
          cp LICENSE "dist/PiTV-SD-Installer-Windows/LICENSE"
          (
            cd dist
            zip -9 -r "PiTV-SD-Installer-Windows.zip" "PiTV-SD-Installer-Windows" >/dev/null
          )
          test -s dist/PiTV-SD-Installer-Windows.zip
          ls -lh dist/PiTV-SD-Installer-Windows.zip

      - name: Publish rolling Alpha release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f alpha "$GITHUB_SHA"
          git push -f origin refs/tags/alpha

          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          else
            gh release create alpha --target "$GITHUB_SHA" --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          fi

          while IFS= read -r asset; do
            if [ -n "$asset" ] && [ "$asset" != "PiTV-SD-Installer-Windows.zip" ]; then
              gh release delete-asset alpha "$asset" -y
            fi
          done < <(gh release view alpha --json assets --jq '.assets[].name')

          gh release upload alpha dist/PiTV-SD-Installer-Windows.zip --clobber
          gh release view alpha --json url,tagName,name,isDraft,isPrerelease,assets
 system/pitv-android-warm.service
          ! grep -q '^Requires=pitv-shell.service          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          ! grep -q 'start_android_warmer' system/pitv-launcher-run
          ! grep -q 'agetty --autologin' install.sh
          ! grep -q 'system/bash_profile /home/pitv/.bash_profile' install.sh
          grep -q 'systemctl set-default pitv.target' install.sh
          grep -q 'systemctl mask getty@tty1.service' install.sh
          ! grep -q '"waydroid", "shell", "input"' pitv/pitv.py
          grep -q 'waydroid show-full-ui' system/pitv-waydroid-launch
          test "$(grep -c 'waydroid show-full-ui' system/pitv-waydroid-launch)" -eq 1
          grep -q 'pitv-waydroid-app-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-runtime-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          grep -q 'waydroid-app-visible' system/pitv-waydroid-launch
          grep -q 'waydroid-app-visible' system/pitv-helper
          grep -q 'waydroid-app-stop' system/pitv-helper
          grep -q 'waydroid-app-stop' pitv/pitv.py
          ! grep -q '\["waydroid", "session", "stop"\]' pitv/pitv.py
          grep -q 'android_key_queue' pitv/pitv.py
          grep -q 'One global activity banner' pitv/pitv.py
          grep -q 'persist.waydroid.multi_windows false' system/pitv-waydroid-launch
          grep -q 'exec cage -d' system/pitv-waydroid-launch
          grep -q 'labwc cage wtype' install.sh
          grep -q 'pitv-launcher-run' install.sh
          grep -q 'pitv-launcher.service' install.sh
          grep -q 'ExecStart=/usr/bin/systemctl restart pitv-shell.service' install.sh
          grep -q 'legacy-android-media-v2.done' pitv/pitv.py
          grep -q 'DPkg::Lock::Timeout' scripts/install-waydroid.sh
          grep -q 'identifier="wlroots"' system/labwc/rc.xml
          grep -q 'title="PiTV \*"' system/labwc/rc.xml
          grep -q 'SendToDesktop" to="Android" follow="no"' system/labwc/rc.xml
          grep -q '<name>PiTV</name>' system/labwc/rc.xml
          grep -q '<name>Kodi</name>' system/labwc/rc.xml
          grep -q '<name>Stremio</name>' system/labwc/rc.xml
          grep -q '<name>Android</name>' system/labwc/rc.xml
          grep -q 'GoToDesktop" to="PiTV"' system/labwc/rc.xml
          grep -q '"127".*KEYCODE_MEDIA_PAUSE' system/pitv-helper
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          ET.parse("system/labwc/rc.xml")
          print("labwc rc.xml OK")
          PYXML
          grep -q 'flatpak-uninstall' system/pitv-helper
          grep -q 'apt-remove' system/pitv-helper
          grep -q 'pitv-session-run' install.sh
          grep -q 'DPkg::Lock::Timeout=' install.sh
          grep -q -- '--no-update universe' install.sh
          grep -q 'DPkg::Lock::Timeout=600' system/pitv-helper
          grep -q 'APT_LOCK_TIMEOUT' system/pitv-self-update
          grep -q 'stdout=subprocess.PIPE' system/pitv-self-update
          bash -n scripts/install-waydroid.sh
          grep -q 'getconf PAGESIZE' scripts/install-waydroid.sh
          grep -q '/proc/pressure' scripts/install-waydroid.sh
          bash -n tools/pitv-flasher.sh

      - name: Flasher dry run
        shell: bash
        run: |
          bash tools/pitv-flasher.sh --dry-run
          pwsh -NoProfile -File tools/pitv-flasher.ps1 -DryRun

      - name: Waydroid fallback snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/waydroid/noble
          test -s packages.env
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          for pkg in *.deb; do
            dpkg-deb --info "$pkg" >/dev/null
          done

      - name: Store JSON
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          for path in (
              "store/catalog.json",
              "store/server_catalog.json",
              "config/config.json",
          ):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)

          root = ET.parse("system/kodi/appliance.xml").getroot()
          values = {}
          for node in root.iter("setting"):
              default = node.find("default")
              if node.get("id") and default is not None:
                  values[node.get("id")] = (default.text or "").strip().lower()
          assert values["videoplayer.useprimedecoder"] == "true"
          assert values["videoplayer.useprimedecoderforhw"] == "true"
          print("Kodi DRM PRIME appliance defaults OK")
          PY

      - name: Runtime render with Ubuntu Pygame
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pygame
          PYTHONPATH=pitv SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            python3 - <<'PY'
          import time
          import pygame
          import pitv as pitv_module
          from queue import Queue
          from pitv import CECReader, LEGACY_ANDROID_PACKAGES, PiTV, VERSION

          assert VERSION == "1.5.0"

          # Regression: cec-ctl prints USER_CONTROL_PRESSED and ui-cmd on
          # separate lines. OK/Back must survive both decoded and raw formats.
          q = Queue()
          cec = CECReader(q)
          cec._handle_monitor_line("USER_CONTROL_PRESSED (0x44):\n")
          cec._handle_monitor_line("  ui-cmd: select (0x00)\n")
          assert q.get_nowait() == pygame.K_RETURN
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE

          # Back long-hold is a separate physical gesture from the raw-format
          # parser test above. Clear the prior gesture state first; otherwise
          # the deliberate 800 ms hold-continuity logic correctly treats this
          # next Back as the same held button and suppresses it.
          cec.clear_key_state()
          # The first Back is delivered once. Older TVs can repeat
          # press/release pairs while the button is held, so gesture duration
          # must survive a short release gap.
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          assert cec.gesture_key == pygame.K_ESCAPE
          cec.gesture_started_at = time.monotonic() - 3.1
          cec.gesture_last_seen_at = time.monotonic()
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.empty()
          assert cec.held_for(pygame.K_ESCAPE) >= 3.0
          cec.clear_key_state()
          assert cec.held_for(pygame.K_ESCAPE) == 0.0

          assert "com.stremio.one" in LEGACY_ANDROID_PACKAGES
          assert "com.plexapp.android" in LEGACY_ANDROID_PACKAGES

          # PiTV 1.4.10 regression contract: returning from an app must keep
          # one healthy CEC reader alive instead of replacing the kernel
          # monitor. The reader itself owns hotplug/reconnect recovery.
          class HealthyCEC:
              def __init__(self):
                  self.clears = 0
              def is_alive(self):
                  return True
              def is_ready(self):
                  return True
              def clear_key_state(self):
                  self.clears += 1

          probe = PiTV.__new__(PiTV)
          probe.cfg = {"cec_enabled": True}
          probe._cec_refreshing = False
          probe.cec_queue = Queue()
          healthy = HealthyCEC()
          probe.cec = healthy
          old_available = pitv_module.cec_available
          old_active_source = pitv_module.cec_active_source
          pitv_module.cec_available = lambda: True
          pitv_module.cec_active_source = lambda: (True, "test")
          try:
              probe._refresh_cec_after_return()
              deadline = time.monotonic() + 2.0
              while probe._cec_refreshing and time.monotonic() < deadline:
                  time.sleep(0.01)
              assert probe.cec is healthy
              assert healthy.clears == 1
              assert not probe._cec_refreshing
          finally:
              pitv_module.cec_available = old_available
              pitv_module.cec_active_source = old_active_source

          # Sencor/other TVs may expose the Home key as any CEC menu command.
          for raw_home in ("0a", "0c", "11"):
              cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
              cec._handle_monitor_line(f"> 01:44:{raw_home}\n")
              assert q.get_nowait() == pygame.K_HOME

          app = PiTV()

          # TV remote contract: Home remains optional multitasking on TVs that
          # have it, but 3-second Back is the universal EXIT for old remotes.
          demo_app = {"name": "Demo", "command": "demo-player"}
          demo_key = app._task_key(demo_app, "linux")
          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app.handle_key(pygame.K_HOME)
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key in app.background_tasks
          app.background_tasks.clear()

          # Every app exit converges on the same visible PiTV workspace.
          app.cfg["cec_enabled"] = False
          app.page = "settings"
          app._return_to_launcher("test", refresh_cec=False)
          assert app.page == "home"
          assert not app.sidebar_focus

          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app._keyboard_back_down_at = time.monotonic() - 3.1
          app._check_global_back_hold()
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key not in app.background_tasks

          # Regression: a legacy Android Stremio APK must stay removable and
          # must not be mistaken for today's native Linux Stremio Flatpak just
          # because both can share the same visible app name.
          legacy_stremio = {
              "name": "Stremio",
              "kind": "apk",
              "package": "com.stremio.legacy",
              "apk_path": "/home/pitv/PiTV/APKs/stremio-old.apk",
          }
          assert app.app_can_uninstall(legacy_stremio)
          assert app._store_item_for_app(legacy_stremio) is None
          native_stremio = {
              "name": "Stremio",
              "kind": "linux",
              "command": "flatpak run com.stremio.Stremio",
          }
          native_item = app._store_item_for_app(native_stremio)
          assert native_item
          assert native_item["installer"]["type"] == "flatpak"
          assert app.app_can_uninstall(native_stremio)

          # Built-in media runtimes have stable multitasking slots.
          kodi_app = {"name":"Kodi", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-launch"}
          plex_app = {"name":"Plex Player", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-addon run script.plexmod"}
          android_app = {"name":"SmartTube", "kind":"apk",
                         "package":"com.teamsmart.videomanager.tv"}
          assert app._task_key(kodi_app, "linux") == "kodi"
          assert app._task_key(plex_app, "linux") == "kodi"
          assert app._task_key(native_stremio, "linux") == "stremio"
          assert app._task_key(android_app, "apk") == (
              "android:com.teamsmart.videomanager.tv"
          )
          second_android = {
              "name": "Second APK", "kind": "apk",
              "package": "com.example.second",
          }
          assert app._task_key(second_android, "apk") != app._task_key(
              android_app, "apk"
          )
          assert app._workspace_for_app(kodi_app, "linux") == "Kodi"
          assert app._workspace_for_app(native_stremio, "linux") == "Stremio"
          assert app._workspace_for_app(android_app, "apk") == "Android"

          # Settings are OK-only: Right must not trigger a hidden
          # action. OK opens the visible list, then Up/Down + OK chooses.
          app.page = "appearance"
          app.sidebar_focus = False
          app.sub_selected = 2
          app.cfg["tile_scale"] = 1.15
          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.15) < 0.001
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Velikost dlaždic"
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.30) < 0.001

          # Theme selector exposes both values and can be cancelled with Back.
          app.sub_selected = 0
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # Regression: if a key relayed with wtype comes back into PiTV,
          # the external app no longer owns focus. Recover without wlrctl.
          app.external_kind = "linux"
          app.external_proc = None
          app._mark_relay_echo(pygame.K_LEFT)
          assert app._consume_relay_echo(pygame.K_LEFT)
          app._recover_external_focus()
          assert app.external_kind is None

          # Screensaver values use the same visible list model.
          app.page = "screensaver"
          app.sub_selected = 1
          app.cfg["screensaver_after_min"] = 1
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Spustit po"
          assert app.choice_options[app.choice_selected][1] == 1
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert app.cfg["screensaver_after_min"] == 2

          # PiTV 1.4.30: every section opened from Settings uses the
          # same three-column Settings list model; Updates exposes one
          # recommended action instead of a 10-card action grid.
          app.settings_context = True
          for detail_page in (
              "screensaver", "network", "audio", "cec", "apps",
              "server_store", "android", "updates", "system", "power", "about",
          ):
              app.page = detail_page
              app.draw()
              print("settings detail OK", detail_page)

          update_actions = app.update_items()
          assert len(update_actions) == 4
          assert update_actions[0][0] == "Aktualizovat vše"
          assert update_actions[1][0] == "Zkontrolovat aktualizace"
          assert update_actions[2][0] == "Pokročilé možnosti"
          assert app.system_items()[-1][0] == "Otevřít Aktualizace"
          assert hasattr(app, "_installed_store_flatpak_ids")
          assert hasattr(app, "_android_runtime_ready_file")
          assert hasattr(app, "android_key_queue")
          app.set_operation("Globální test", 42)
          app.page = "home"
          app.draw()
          assert app.operation_text == "Globální test"
          assert app.operation_progress == 42

          # PiTV 1.4.31 HDMI recovery contract. Dummy rendering must not try
          # to touch a real KMS/Wayland output, but the geometry helpers must
          # be present and safe.
          assert isinstance(app._desktop_size(), tuple)
          assert len(app._desktop_size()) == 2
          assert app._repair_fullscreen(force=True) is False
          assert hasattr(app, "android_pending_proc")
          assert app._android_ready_file().name == "pitv-waydroid-app-ready"

          # Application management is a fixed Settings menu. No Right
          # action is allowed; visibility and uninstall each open a list.
          app.apps = [dict(native_stremio), dict(legacy_stremio)]
          app.page = "apps"
          app.settings_context = True
          app.apps_selected = 1
          app_menu = app.app_items()
          assert [x["kind"] for x in app_menu] == [
              "store", "visibility", "uninstall", "refresh"
          ]
          assert app_menu[1]["name"] == "Zobrazení aplikací"
          assert app_menu[2]["name"] == "Odinstalovat aplikace"

          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active

          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Zobrazení aplikací"
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title in ("Stremio",)
          assert [x[1] for x in app.choice_options] == [True, False]
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          app.apps_selected = 2
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Odinstalovat aplikace"
          assert len(app.choice_options) >= 1
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # CEC and other configuration values must use a visible choice list,
          # not blind left/right toggling.
          app.page = "cec"
          app.open_cec_choice(1)
          assert app.choice_active
          assert app.choice_title == "Probudit TV při startu"
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active
          app.settings_context = False

          pages = (
              "home", "settings", "appearance", "screensaver", "network",
              "audio", "cec", "apps", "store", "server_store", "android",
              "updates", "system", "power", "about",
          )
          for theme in ("apple_dark", "apple_light"):
              app.cfg["theme"] = theme
              for page in pages:
                  app.page = page
                  app.draw()
                  print("render OK", theme, page)

          assert len(app.SETTINGS) == 12
          pygame.quit()
          print("PiTV runtime render OK", VERSION)
          PY

  windows-check:
    name: PiTV SD Installer Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer and engine
        shell: powershell
        run: |
          foreach ($file in @(
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1",
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              exit 1
            }
            Write-Host ("PowerShell syntax OK: " + $file)
          }

      - name: Verify live Ubuntu catalog
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -SelfTestCatalog

      - name: Compile native raw disk helper
        shell: powershell
        run: |
          Add-Type -Path "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs"
          if (-not ("PiTVNativeDisk" -as [type])) {
            throw "PiTVNativeDisk.cs did not compile."
          }
          if (-not ([PiTVNativeDisk].GetMethod("LockVolume"))) {
            throw "PiTVNativeDisk LockVolume helper is missing."
          }
          Write-Host "PiTVNativeDisk C# helper compiles"

      - name: Build lightweight PiTV XZ decoder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:RUNNER_TEMP "pitv-xz-build"

          cmake -S "$env:GITHUB_WORKSPACE\tools\windows\native" -B $build -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure for PiTV-XZ failed." }

          cmake --build $build --config Release --target PiTV-XZ
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ build failed." }

          $exe = Get-ChildItem $build -Recurse -Filter "PiTV-XZ.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "PiTV-XZ.exe was not produced." }

          $bin = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"
          Copy-Item $exe.FullName $bin -Force
          Write-Host ("Built " + $bin + " (" + $exe.Length + " bytes)")

      - name: Verify PiTV XZ extraction
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "pitv-xz-release-test"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $src = Join-Path $dir "sample.img"
          $xz = Join-Path $dir "sample.img.xz"
          $out = Join-Path $dir "expanded.img"
          $decoder = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"

          python -c "import lzma, pathlib, sys; data=bytes(range(256))*16384; pathlib.Path(sys.argv[1]).write_bytes(data); pathlib.Path(sys.argv[2]).write_bytes(lzma.compress(data, format=lzma.FORMAT_XZ))" "$src" "$xz"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create XZ test fixture." }

          & $decoder $xz $out
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ failed to expand the test image." }

          if ((Get-FileHash -Algorithm SHA256 $src).Hash -ne (Get-FileHash -Algorithm SHA256 $out).Hash) {
            throw "PiTV-XZ output is not byte-identical."
          }
          Write-Host "PiTV-XZ raw XZ extraction OK"

      - name: Verify PiTV writer contract
        shell: powershell
        run: |
          $installer = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -Raw
          $engine = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1" -Raw
          $native = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs" -Raw

          if ($installer -match "Ensure-Imager|Assert-ImagerCliContract|Invoke-ImagerWrite") {
            throw "Legacy Raspberry Pi Imager dependency is still present."
          }

          foreach ($required in @(
            "Get-PiTVOnlineImageFile",
            "Prepare-PiTVRawImage",
            "Write-PiTVRawImageToDisk",
            "Install-PiTVCloudInitToBootPartition"
          )) {
            if ($installer -notmatch [regex]::Escape($required)) {
              throw "Installer write flow is missing $required"
            }
          }

          foreach ($required in @(
            "PiTVNativeDisk",
            "PhysicalDrive",
            "CACHE HIT",
            "image_download_sha256",
            "Get-PiTVDeviceSha256",
            "Wait-PiTVTargetDiskReadyAfterRawWrite",
            "DiskPartRescan",
            "Write-PiTVBytesDurable",
            "FINALIZE RETRY",
            "PiTV-XZ.exe",
            "LockVolume"
          )) {
            if ($engine -notmatch [regex]::Escape($required)) {
              throw "Image engine is missing contract item $required"
            }
          }

          foreach ($required in @(
            "FSCTL_LOCK_VOLUME",
            "FSCTL_DISMOUNT_VOLUME",
            "LockAndDismount",
            "FlushFileBuffers",
            "FILE_FLAG_WRITE_THROUGH"
          )) {
            if ($native -notmatch [regex]::Escape($required)) {
              throw "Native disk helper is missing $required"
            }
          }

          Write-Host "PiTV raw writer/cache/volume-lock contract OK"

      - name: Upload PiTV XZ decoder
        uses: actions/upload-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows/PiTV-XZ.exe
          if-no-files-found: error
          retention-days: 1

      - name: Verify launcher target
        shell: powershell
        run: |
          $launcher = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\Start-PiTV-SD-Installer.cmd" -Raw
          if ($launcher -notmatch "PiTV-SD-Installer\.ps1") {
            throw "Launcher does not reference PiTV-SD-Installer.ps1"
          }
          Write-Host "Launcher target OK"

  release:
    name: Publish Alpha
    needs:
      - pitv-check
      - windows-check
    if: ${{ needs.pitv-check.result == 'success' && needs.windows-check.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PiTV XZ decoder
        uses: actions/download-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows

      - name: Release checks
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/windows/PiTV-XZ.exe
          test -s tools/windows/THIRD-PARTY-NOTICES.txt

          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-SD-Installer.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'
          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-ImageEngine.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p "dist/PiTV-SD-Installer-Windows"
          cp tools/windows/Start-PiTV-SD-Installer.cmd "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-SD-Installer.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-ImageEngine.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTVNativeDisk.cs "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-XZ.exe "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/THIRD-PARTY-NOTICES.txt "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/README.md "dist/PiTV-SD-Installer-Windows/README.md"
          cp LICENSE "dist/PiTV-SD-Installer-Windows/LICENSE"
          (
            cd dist
            zip -9 -r "PiTV-SD-Installer-Windows.zip" "PiTV-SD-Installer-Windows" >/dev/null
          )
          test -s dist/PiTV-SD-Installer-Windows.zip
          ls -lh dist/PiTV-SD-Installer-Windows.zip

      - name: Publish rolling Alpha release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f alpha "$GITHUB_SHA"
          git push -f origin refs/tags/alpha

          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          else
            gh release create alpha --target "$GITHUB_SHA" --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          fi

          while IFS= read -r asset; do
            if [ -n "$asset" ] && [ "$asset" != "PiTV-SD-Installer-Windows.zip" ]; then
              gh release delete-asset alpha "$asset" -y
            fi
          done < <(gh release view alpha --json assets --jq '.assets[].name')

          gh release upload alpha dist/PiTV-SD-Installer-Windows.zip --clobber
          gh release view alpha --json url,tagName,name,isDraft,isPrerelease,assets
 system/pitv-launcher-run
          ! grep -q 'while .*STOPPING' system/pitv-launcher-run
          ! grep -q 'pitv-launcher-run' system/labwc/autostart
          grep -q '^Requires=multi-user.target pitv-shell.service$' system/pitv.target
          grep -q '^AllowIsolate=yes$' system/pitv.target
          grep -q '^PAMName=login$' system/pitv-shell.service
          grep -q '^TTYPath=/dev/tty1$' system/pitv-shell.service
          grep -q '^Restart=always$' system/pitv-shell.service
          grep -q '^WantedBy=pitv.target$' system/pitv-shell.service
          grep -q '^Restart=always$' system/pitv-android-warm.service
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          ! grep -q 'start_android_warmer' system/pitv-launcher-run
          ! grep -q 'agetty --autologin' install.sh
          ! grep -q 'system/bash_profile /home/pitv/.bash_profile' install.sh
          grep -q 'systemctl set-default pitv.target' install.sh
          grep -q 'systemctl mask getty@tty1.service' install.sh
          ! grep -q '"waydroid", "shell", "input"' pitv/pitv.py
          grep -q 'waydroid show-full-ui' system/pitv-waydroid-launch
          test "$(grep -c 'waydroid show-full-ui' system/pitv-waydroid-launch)" -eq 1
          grep -q 'pitv-waydroid-app-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-runtime-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          grep -q 'waydroid-app-visible' system/pitv-waydroid-launch
          grep -q 'waydroid-app-visible' system/pitv-helper
          grep -q 'waydroid-app-stop' system/pitv-helper
          grep -q 'waydroid-app-stop' pitv/pitv.py
          ! grep -q '\["waydroid", "session", "stop"\]' pitv/pitv.py
          grep -q 'android_key_queue' pitv/pitv.py
          grep -q 'One global activity banner' pitv/pitv.py
          grep -q 'persist.waydroid.multi_windows false' system/pitv-waydroid-launch
          grep -q 'exec cage -d' system/pitv-waydroid-launch
          grep -q 'labwc cage wtype' install.sh
          grep -q 'pitv-launcher-run' install.sh
          grep -q 'pitv-launcher.service' install.sh
          grep -q 'ExecStart=/usr/bin/systemctl restart pitv-shell.service' install.sh
          grep -q 'legacy-android-media-v2.done' pitv/pitv.py
          grep -q 'DPkg::Lock::Timeout' scripts/install-waydroid.sh
          grep -q 'identifier="wlroots"' system/labwc/rc.xml
          grep -q 'title="PiTV \*"' system/labwc/rc.xml
          grep -q 'SendToDesktop" to="Android" follow="no"' system/labwc/rc.xml
          grep -q '<name>PiTV</name>' system/labwc/rc.xml
          grep -q '<name>Kodi</name>' system/labwc/rc.xml
          grep -q '<name>Stremio</name>' system/labwc/rc.xml
          grep -q '<name>Android</name>' system/labwc/rc.xml
          grep -q 'GoToDesktop" to="PiTV"' system/labwc/rc.xml
          grep -q '"127".*KEYCODE_MEDIA_PAUSE' system/pitv-helper
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          ET.parse("system/labwc/rc.xml")
          print("labwc rc.xml OK")
          PYXML
          grep -q 'flatpak-uninstall' system/pitv-helper
          grep -q 'apt-remove' system/pitv-helper
          grep -q 'pitv-session-run' install.sh
          grep -q 'DPkg::Lock::Timeout=' install.sh
          grep -q -- '--no-update universe' install.sh
          grep -q 'DPkg::Lock::Timeout=600' system/pitv-helper
          grep -q 'APT_LOCK_TIMEOUT' system/pitv-self-update
          grep -q 'stdout=subprocess.PIPE' system/pitv-self-update
          bash -n scripts/install-waydroid.sh
          grep -q 'getconf PAGESIZE' scripts/install-waydroid.sh
          grep -q '/proc/pressure' scripts/install-waydroid.sh
          bash -n tools/pitv-flasher.sh

      - name: Flasher dry run
        shell: bash
        run: |
          bash tools/pitv-flasher.sh --dry-run
          pwsh -NoProfile -File tools/pitv-flasher.ps1 -DryRun

      - name: Waydroid fallback snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/waydroid/noble
          test -s packages.env
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          for pkg in *.deb; do
            dpkg-deb --info "$pkg" >/dev/null
          done

      - name: Store JSON
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          for path in (
              "store/catalog.json",
              "store/server_catalog.json",
              "config/config.json",
          ):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)

          root = ET.parse("system/kodi/appliance.xml").getroot()
          values = {}
          for node in root.iter("setting"):
              default = node.find("default")
              if node.get("id") and default is not None:
                  values[node.get("id")] = (default.text or "").strip().lower()
          assert values["videoplayer.useprimedecoder"] == "true"
          assert values["videoplayer.useprimedecoderforhw"] == "true"
          print("Kodi DRM PRIME appliance defaults OK")
          PY

      - name: Runtime render with Ubuntu Pygame
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pygame
          PYTHONPATH=pitv SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            python3 - <<'PY'
          import time
          import pygame
          import pitv as pitv_module
          from queue import Queue
          from pitv import CECReader, LEGACY_ANDROID_PACKAGES, PiTV, VERSION

          assert VERSION == "1.5.0"

          # Regression: cec-ctl prints USER_CONTROL_PRESSED and ui-cmd on
          # separate lines. OK/Back must survive both decoded and raw formats.
          q = Queue()
          cec = CECReader(q)
          cec._handle_monitor_line("USER_CONTROL_PRESSED (0x44):\n")
          cec._handle_monitor_line("  ui-cmd: select (0x00)\n")
          assert q.get_nowait() == pygame.K_RETURN
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE

          # Back long-hold is a separate physical gesture from the raw-format
          # parser test above. Clear the prior gesture state first; otherwise
          # the deliberate 800 ms hold-continuity logic correctly treats this
          # next Back as the same held button and suppresses it.
          cec.clear_key_state()
          # The first Back is delivered once. Older TVs can repeat
          # press/release pairs while the button is held, so gesture duration
          # must survive a short release gap.
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.get_nowait() == pygame.K_ESCAPE
          cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
          assert cec.gesture_key == pygame.K_ESCAPE
          cec.gesture_started_at = time.monotonic() - 3.1
          cec.gesture_last_seen_at = time.monotonic()
          cec._handle_monitor_line("> 01:44:0d\n")
          assert q.empty()
          assert cec.held_for(pygame.K_ESCAPE) >= 3.0
          cec.clear_key_state()
          assert cec.held_for(pygame.K_ESCAPE) == 0.0

          assert "com.stremio.one" in LEGACY_ANDROID_PACKAGES
          assert "com.plexapp.android" in LEGACY_ANDROID_PACKAGES

          # PiTV 1.4.10 regression contract: returning from an app must keep
          # one healthy CEC reader alive instead of replacing the kernel
          # monitor. The reader itself owns hotplug/reconnect recovery.
          class HealthyCEC:
              def __init__(self):
                  self.clears = 0
              def is_alive(self):
                  return True
              def is_ready(self):
                  return True
              def clear_key_state(self):
                  self.clears += 1

          probe = PiTV.__new__(PiTV)
          probe.cfg = {"cec_enabled": True}
          probe._cec_refreshing = False
          probe.cec_queue = Queue()
          healthy = HealthyCEC()
          probe.cec = healthy
          old_available = pitv_module.cec_available
          old_active_source = pitv_module.cec_active_source
          pitv_module.cec_available = lambda: True
          pitv_module.cec_active_source = lambda: (True, "test")
          try:
              probe._refresh_cec_after_return()
              deadline = time.monotonic() + 2.0
              while probe._cec_refreshing and time.monotonic() < deadline:
                  time.sleep(0.01)
              assert probe.cec is healthy
              assert healthy.clears == 1
              assert not probe._cec_refreshing
          finally:
              pitv_module.cec_available = old_available
              pitv_module.cec_active_source = old_active_source

          # Sencor/other TVs may expose the Home key as any CEC menu command.
          for raw_home in ("0a", "0c", "11"):
              cec._handle_monitor_line("USER_CONTROL_RELEASED (0x45)\n")
              cec._handle_monitor_line(f"> 01:44:{raw_home}\n")
              assert q.get_nowait() == pygame.K_HOME

          app = PiTV()

          # TV remote contract: Home remains optional multitasking on TVs that
          # have it, but 3-second Back is the universal EXIT for old remotes.
          demo_app = {"name": "Demo", "command": "demo-player"}
          demo_key = app._task_key(demo_app, "linux")
          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app.handle_key(pygame.K_HOME)
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key in app.background_tasks
          app.background_tasks.clear()

          # Every app exit converges on the same visible PiTV workspace.
          app.cfg["cec_enabled"] = False
          app.page = "settings"
          app._return_to_launcher("test", refresh_cec=False)
          assert app.page == "home"
          assert not app.sidebar_focus

          app.external_kind = "linux"
          app.external_app = dict(demo_app)
          app.external_task_key = demo_key
          app.external_proc = None
          app._keyboard_back_down_at = time.monotonic() - 3.1
          app._check_global_back_hold()
          assert app.external_kind is None
          assert app.page == "home"
          assert demo_key not in app.background_tasks

          # Regression: a legacy Android Stremio APK must stay removable and
          # must not be mistaken for today's native Linux Stremio Flatpak just
          # because both can share the same visible app name.
          legacy_stremio = {
              "name": "Stremio",
              "kind": "apk",
              "package": "com.stremio.legacy",
              "apk_path": "/home/pitv/PiTV/APKs/stremio-old.apk",
          }
          assert app.app_can_uninstall(legacy_stremio)
          assert app._store_item_for_app(legacy_stremio) is None
          native_stremio = {
              "name": "Stremio",
              "kind": "linux",
              "command": "flatpak run com.stremio.Stremio",
          }
          native_item = app._store_item_for_app(native_stremio)
          assert native_item
          assert native_item["installer"]["type"] == "flatpak"
          assert app.app_can_uninstall(native_stremio)

          # Built-in media runtimes have stable multitasking slots.
          kodi_app = {"name":"Kodi", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-launch"}
          plex_app = {"name":"Plex Player", "kind":"linux",
                      "command":"/usr/local/bin/pitv-kodi-addon run script.plexmod"}
          android_app = {"name":"SmartTube", "kind":"apk",
                         "package":"com.teamsmart.videomanager.tv"}
          assert app._task_key(kodi_app, "linux") == "kodi"
          assert app._task_key(plex_app, "linux") == "kodi"
          assert app._task_key(native_stremio, "linux") == "stremio"
          assert app._task_key(android_app, "apk") == (
              "android:com.teamsmart.videomanager.tv"
          )
          second_android = {
              "name": "Second APK", "kind": "apk",
              "package": "com.example.second",
          }
          assert app._task_key(second_android, "apk") != app._task_key(
              android_app, "apk"
          )
          assert app._workspace_for_app(kodi_app, "linux") == "Kodi"
          assert app._workspace_for_app(native_stremio, "linux") == "Stremio"
          assert app._workspace_for_app(android_app, "apk") == "Android"

          # Settings are OK-only: Right must not trigger a hidden
          # action. OK opens the visible list, then Up/Down + OK chooses.
          app.page = "appearance"
          app.sidebar_focus = False
          app.sub_selected = 2
          app.cfg["tile_scale"] = 1.15
          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.15) < 0.001
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Velikost dlaždic"
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert not app.choice_active
          assert abs(float(app.cfg["tile_scale"]) - 1.30) < 0.001

          # Theme selector exposes both values and can be cancelled with Back.
          app.sub_selected = 0
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # Regression: if a key relayed with wtype comes back into PiTV,
          # the external app no longer owns focus. Recover without wlrctl.
          app.external_kind = "linux"
          app.external_proc = None
          app._mark_relay_echo(pygame.K_LEFT)
          assert app._consume_relay_echo(pygame.K_LEFT)
          app._recover_external_focus()
          assert app.external_kind is None

          # Screensaver values use the same visible list model.
          app.page = "screensaver"
          app.sub_selected = 1
          app.cfg["screensaver_after_min"] = 1
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Spustit po"
          assert app.choice_options[app.choice_selected][1] == 1
          app.handle_key(pygame.K_DOWN)
          app.handle_key(pygame.K_RETURN)
          assert app.cfg["screensaver_after_min"] == 2

          # PiTV 1.4.30: every section opened from Settings uses the
          # same three-column Settings list model; Updates exposes one
          # recommended action instead of a 10-card action grid.
          app.settings_context = True
          for detail_page in (
              "screensaver", "network", "audio", "cec", "apps",
              "server_store", "android", "updates", "system", "power", "about",
          ):
              app.page = detail_page
              app.draw()
              print("settings detail OK", detail_page)

          update_actions = app.update_items()
          assert len(update_actions) == 4
          assert update_actions[0][0] == "Aktualizovat vše"
          assert update_actions[1][0] == "Zkontrolovat aktualizace"
          assert update_actions[2][0] == "Pokročilé možnosti"
          assert app.system_items()[-1][0] == "Otevřít Aktualizace"
          assert hasattr(app, "_installed_store_flatpak_ids")
          assert hasattr(app, "_android_runtime_ready_file")
          assert hasattr(app, "android_key_queue")
          app.set_operation("Globální test", 42)
          app.page = "home"
          app.draw()
          assert app.operation_text == "Globální test"
          assert app.operation_progress == 42

          # PiTV 1.4.31 HDMI recovery contract. Dummy rendering must not try
          # to touch a real KMS/Wayland output, but the geometry helpers must
          # be present and safe.
          assert isinstance(app._desktop_size(), tuple)
          assert len(app._desktop_size()) == 2
          assert app._repair_fullscreen(force=True) is False
          assert hasattr(app, "android_pending_proc")
          assert app._android_ready_file().name == "pitv-waydroid-app-ready"

          # Application management is a fixed Settings menu. No Right
          # action is allowed; visibility and uninstall each open a list.
          app.apps = [dict(native_stremio), dict(legacy_stremio)]
          app.page = "apps"
          app.settings_context = True
          app.apps_selected = 1
          app_menu = app.app_items()
          assert [x["kind"] for x in app_menu] == [
              "store", "visibility", "uninstall", "refresh"
          ]
          assert app_menu[1]["name"] == "Zobrazení aplikací"
          assert app_menu[2]["name"] == "Odinstalovat aplikace"

          app.handle_key(pygame.K_RIGHT)
          assert not app.choice_active

          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Zobrazení aplikací"
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title in ("Stremio",)
          assert [x[1] for x in app.choice_options] == [True, False]
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          app.apps_selected = 2
          app.handle_key(pygame.K_RETURN)
          assert app.choice_active
          assert app.choice_title == "Odinstalovat aplikace"
          assert len(app.choice_options) >= 1
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active

          # CEC and other configuration values must use a visible choice list,
          # not blind left/right toggling.
          app.page = "cec"
          app.open_cec_choice(1)
          assert app.choice_active
          assert app.choice_title == "Probudit TV při startu"
          assert len(app.choice_options) == 2
          app.handle_key(pygame.K_ESCAPE)
          assert not app.choice_active
          app.settings_context = False

          pages = (
              "home", "settings", "appearance", "screensaver", "network",
              "audio", "cec", "apps", "store", "server_store", "android",
              "updates", "system", "power", "about",
          )
          for theme in ("apple_dark", "apple_light"):
              app.cfg["theme"] = theme
              for page in pages:
                  app.page = page
                  app.draw()
                  print("render OK", theme, page)

          assert len(app.SETTINGS) == 12
          pygame.quit()
          print("PiTV runtime render OK", VERSION)
          PY

  windows-check:
    name: PiTV SD Installer Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installer and engine
        shell: powershell
        run: |
          foreach ($file in @(
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1",
            "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
              }
              exit 1
            }
            Write-Host ("PowerShell syntax OK: " + $file)
          }

      - name: Verify live Ubuntu catalog
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -SelfTestCatalog

      - name: Compile native raw disk helper
        shell: powershell
        run: |
          Add-Type -Path "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs"
          if (-not ("PiTVNativeDisk" -as [type])) {
            throw "PiTVNativeDisk.cs did not compile."
          }
          if (-not ([PiTVNativeDisk].GetMethod("LockVolume"))) {
            throw "PiTVNativeDisk LockVolume helper is missing."
          }
          Write-Host "PiTVNativeDisk C# helper compiles"

      - name: Build lightweight PiTV XZ decoder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $env:RUNNER_TEMP "pitv-xz-build"

          cmake -S "$env:GITHUB_WORKSPACE\tools\windows\native" -B $build -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure for PiTV-XZ failed." }

          cmake --build $build --config Release --target PiTV-XZ
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ build failed." }

          $exe = Get-ChildItem $build -Recurse -Filter "PiTV-XZ.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "PiTV-XZ.exe was not produced." }

          $bin = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"
          Copy-Item $exe.FullName $bin -Force
          Write-Host ("Built " + $bin + " (" + $exe.Length + " bytes)")

      - name: Verify PiTV XZ extraction
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "pitv-xz-release-test"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $src = Join-Path $dir "sample.img"
          $xz = Join-Path $dir "sample.img.xz"
          $out = Join-Path $dir "expanded.img"
          $decoder = "$env:GITHUB_WORKSPACE\tools\windows\PiTV-XZ.exe"

          python -c "import lzma, pathlib, sys; data=bytes(range(256))*16384; pathlib.Path(sys.argv[1]).write_bytes(data); pathlib.Path(sys.argv[2]).write_bytes(lzma.compress(data, format=lzma.FORMAT_XZ))" "$src" "$xz"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create XZ test fixture." }

          & $decoder $xz $out
          if ($LASTEXITCODE -ne 0) { throw "PiTV-XZ failed to expand the test image." }

          if ((Get-FileHash -Algorithm SHA256 $src).Hash -ne (Get-FileHash -Algorithm SHA256 $out).Hash) {
            throw "PiTV-XZ output is not byte-identical."
          }
          Write-Host "PiTV-XZ raw XZ extraction OK"

      - name: Verify PiTV writer contract
        shell: powershell
        run: |
          $installer = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-SD-Installer.ps1" -Raw
          $engine = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTV-ImageEngine.ps1" -Raw
          $native = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\PiTVNativeDisk.cs" -Raw

          if ($installer -match "Ensure-Imager|Assert-ImagerCliContract|Invoke-ImagerWrite") {
            throw "Legacy Raspberry Pi Imager dependency is still present."
          }

          foreach ($required in @(
            "Get-PiTVOnlineImageFile",
            "Prepare-PiTVRawImage",
            "Write-PiTVRawImageToDisk",
            "Install-PiTVCloudInitToBootPartition"
          )) {
            if ($installer -notmatch [regex]::Escape($required)) {
              throw "Installer write flow is missing $required"
            }
          }

          foreach ($required in @(
            "PiTVNativeDisk",
            "PhysicalDrive",
            "CACHE HIT",
            "image_download_sha256",
            "Get-PiTVDeviceSha256",
            "Wait-PiTVTargetDiskReadyAfterRawWrite",
            "DiskPartRescan",
            "Write-PiTVBytesDurable",
            "FINALIZE RETRY",
            "PiTV-XZ.exe",
            "LockVolume"
          )) {
            if ($engine -notmatch [regex]::Escape($required)) {
              throw "Image engine is missing contract item $required"
            }
          }

          foreach ($required in @(
            "FSCTL_LOCK_VOLUME",
            "FSCTL_DISMOUNT_VOLUME",
            "LockAndDismount",
            "FlushFileBuffers",
            "FILE_FLAG_WRITE_THROUGH"
          )) {
            if ($native -notmatch [regex]::Escape($required)) {
              throw "Native disk helper is missing $required"
            }
          }

          Write-Host "PiTV raw writer/cache/volume-lock contract OK"

      - name: Upload PiTV XZ decoder
        uses: actions/upload-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows/PiTV-XZ.exe
          if-no-files-found: error
          retention-days: 1

      - name: Verify launcher target
        shell: powershell
        run: |
          $launcher = Get-Content "$env:GITHUB_WORKSPACE\tools\windows\Start-PiTV-SD-Installer.cmd" -Raw
          if ($launcher -notmatch "PiTV-SD-Installer\.ps1") {
            throw "Launcher does not reference PiTV-SD-Installer.ps1"
          }
          Write-Host "Launcher target OK"

  release:
    name: Publish Alpha
    needs:
      - pitv-check
      - windows-check
    if: ${{ needs.pitv-check.result == 'success' && needs.windows-check.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download PiTV XZ decoder
        uses: actions/download-artifact@v4
        with:
          name: pitv-xz-windows
          path: tools/windows

      - name: Release checks
        shell: bash
        run: |
          set -euo pipefail
          test -s tools/windows/PiTV-XZ.exe
          test -s tools/windows/THIRD-PARTY-NOTICES.txt

          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-SD-Installer.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'
          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("tools/windows/PiTV-ImageEngine.ps1",[ref]$null,[ref]$errors) > $null; if($errors.Count){$errors | Out-String | Write-Error; exit 1}'

      - name: Build Windows installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p "dist/PiTV-SD-Installer-Windows"
          cp tools/windows/Start-PiTV-SD-Installer.cmd "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-SD-Installer.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-ImageEngine.ps1 "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTVNativeDisk.cs "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/PiTV-XZ.exe "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/THIRD-PARTY-NOTICES.txt "dist/PiTV-SD-Installer-Windows/"
          cp tools/windows/README.md "dist/PiTV-SD-Installer-Windows/README.md"
          cp LICENSE "dist/PiTV-SD-Installer-Windows/LICENSE"
          (
            cd dist
            zip -9 -r "PiTV-SD-Installer-Windows.zip" "PiTV-SD-Installer-Windows" >/dev/null
          )
          test -s dist/PiTV-SD-Installer-Windows.zip
          ls -lh dist/PiTV-SD-Installer-Windows.zip

      - name: Publish rolling Alpha release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f alpha "$GITHUB_SHA"
          git push -f origin refs/tags/alpha

          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          else
            gh release create alpha --target "$GITHUB_SHA" --title "PiTV Alpha" --notes-file release-notes/alpha.md --prerelease
          fi

          while IFS= read -r asset; do
            if [ -n "$asset" ] && [ "$asset" != "PiTV-SD-Installer-Windows.zip" ]; then
              gh release delete-asset alpha "$asset" -y
            fi
          done < <(gh release view alpha --json assets --jq '.assets[].name')

          gh release upload alpha dist/PiTV-SD-Installer-Windows.zip --clobber
          gh release view alpha --json url,tagName,name,isDraft,isPrerelease,assets
 system/pitv-android-warm.service
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
