          grep -q 'systemctl mask getty@tty1.service' install.sh
          ! grep -q '"waydroid", "shell", "input"' pitv/pitv.py
          grep -q 'waydroid show-full-ui' system/pitv-waydroid-launch
          test "$(grep -c 'waydroid show-full-ui' system/pitv-waydroid-launch)" -eq 1
          grep -q 'pitv-waydroid-app-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-runtime-ready' system/pitv-waydroid-launch
          grep -q 'pitv-waydroid-launch --warm' system/pitv-android-warm
          grep -q 'waydroid-app-visible' system/pitv-waydroid-launch
          grep -q 'waydroid-app-visible' system/pitv-helper
          grep -q 'waydroid-app-stop' system/pitv-helper
          grep -q 'waydroid-app-stop' pitv/pitv.py
          ! grep -q '\["waydroid", "session", "stop"\]' pitv/pitv.py
          grep -q 'android_key_queue' pitv/pitv.py
          grep -q 'One global activity banner' pitv/pitv.py
          grep -q 'persist.waydroid.multi_windows false' system/pitv-waydroid-launch
          grep -q 'exec cage -d' system/pitv-waydroid-launch
          grep -q 'labwc cage wtype' install.sh
          grep -q 'pitv-launcher-run' install.sh
          grep -q 'pitv-launcher.service' install.sh
          grep -q 'ExecStart=/usr/bin/systemctl restart pitv-shell.service' install.sh
          grep -q 'legacy-android-media-v2.done' pitv/pitv.py
          grep -q 'DPkg::Lock::Timeout' scripts/install-waydroid.sh
          grep -q 'identifier="wlroots"' system/labwc/rc.xml
